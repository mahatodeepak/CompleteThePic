<script>

/* =========================================================
   COMPLETE THE PIC V1.6
   Based on V1.3
   3 × 3 Panda Puzzle
   ========================================================= */

const SIZE = 900;
const ROWS = 3;
const COLS = 3;
const CELL = SIZE / COLS;

/*
  Extra transparent space around every piece.
  This makes the jigsaw tabs visible while keeping
  the actual picture perfectly aligned.
*/
const PAD = 34;
const PIECE_SIZE = CELL + PAD * 2;

let sourceCanvas;
let pieces = [];

let moves = 0;
let seconds = 0;
let timerInterval = null;
let gameRunning = false;
let completedCount = 0;

let audioContext = null;

const board = document.getElementById("board");
const piecesContainer = document.getElementById("pieces");

/* ---------------------------------------------------------
   BEST SCORE
--------------------------------------------------------- */

function getBestScore(){
  const v = localStorage.getItem("completePic_v16_bestScore");
  return v ? Number(v) : null;
}

function getBestTime(){
  const v = localStorage.getItem("completePic_v16_bestTime");
  return v ? Number(v) : null;
}

function updateBestDisplay(){
  const bestScore = getBestScore();
  const bestTime = getBestTime();

  document.getElementById("bestScore").textContent =
    bestScore === null ? "—" : bestScore;

  document.getElementById("bestTime").textContent =
    bestTime === null ? "—" : bestTime;
}

/* ---------------------------------------------------------
   AUDIO
--------------------------------------------------------- */

function initAudio(){
  if(!audioContext){
    try{
      audioContext =
        new (window.AudioContext || window.webkitAudioContext)();
    }catch(e){}
  }

  if(audioContext && audioContext.state === "suspended"){
    audioContext.resume();
  }
}

function beep(frequency, duration, type="sine", volume=.06){
  initAudio();

  if(!audioContext) return;

  try{
    const osc = audioContext.createOscillator();
    const gain = audioContext.createGain();

    osc.type = type;
    osc.frequency.value = frequency;

    gain.gain.setValueAtTime(volume, audioContext.currentTime);
    gain.gain.exponentialRampToValueAtTime(
      0.001,
      audioContext.currentTime + duration
    );

    osc.connect(gain);
    gain.connect(audioContext.destination);

    osc.start();
    osc.stop(audioContext.currentTime + duration);
  }catch(e){}
}

function correctSound(){
  beep(660,.12,"sine",.07);

  setTimeout(()=>{
    beep(880,.15,"sine",.07);
  },100);
}

function wrongSound(){
  beep(170,.20,"sawtooth",.05);
}

function winSound(){
  [523,659,784,1046].forEach((f,i)=>{
    setTimeout(()=>{
      beep(f,.22,"sine",.07);
    },i*130);
  });
}

/* ---------------------------------------------------------
   GENERATED PANDA IMAGE
--------------------------------------------------------- */

function drawCloud(ctx,x,y,s){
  ctx.save();
  ctx.fillStyle="rgba(255,255,255,.92)";

  ctx.beginPath();
  ctx.arc(x,y,35*s,0,Math.PI*2);
  ctx.arc(x+40*s,y-18*s,45*s,0,Math.PI*2);
  ctx.arc(x+85*s,y,34*s,0,Math.PI*2);
  ctx.arc(x+45*s,y+15*s,48*s,0,Math.PI*2);
  ctx.fill();

  ctx.restore();
}

function drawPanda(){

  sourceCanvas = document.createElement("canvas");
  sourceCanvas.width = SIZE;
  sourceCanvas.height = SIZE;

  const ctx = sourceCanvas.getContext("2d");

  /* SKY */
  const sky = ctx.createLinearGradient(0,0,0,SIZE);
  sky.addColorStop(0,"#7ed8ff");
  sky.addColorStop(.55,"#c9f1ff");
  sky.addColorStop(1,"#eefcff");

  ctx.fillStyle = sky;
  ctx.fillRect(0,0,SIZE,SIZE);

  /* SUN */
  ctx.fillStyle="#ffe27a";
  ctx.beginPath();
  ctx.arc(760,120,62,0,Math.PI*2);
  ctx.fill();

  /* CLOUDS */
  drawCloud(ctx,120,145,1);
  drawCloud(ctx,530,105,.75);

  /* FAR MOUNTAINS */
  ctx.fillStyle="#8ac6a0";

  ctx.beginPath();
  ctx.moveTo(0,560);
  ctx.lineTo(170,360);
  ctx.lineTo(310,530);
  ctx.lineTo(460,330);
  ctx.lineTo(650,540);
  ctx.lineTo(790,380);
  ctx.lineTo(900,520);
  ctx.lineTo(900,900);
  ctx.lineTo(0,900);
  ctx.closePath();
  ctx.fill();

  /* SNOW CAPS */
  ctx.fillStyle="#f4ffff";

  ctx.beginPath();
  ctx.moveTo(170,360);
  ctx.lineTo(130,420);
  ctx.lineTo(170,402);
  ctx.lineTo(200,430);
  ctx.lineTo(220,405);
  ctx.lineTo(250,430);
  ctx.closePath();
  ctx.fill();

  ctx.beginPath();
  ctx.moveTo(460,330);
  ctx.lineTo(410,400);
  ctx.lineTo(455,382);
  ctx.lineTo(485,410);
  ctx.lineTo(515,382);
  ctx.lineTo(545,420);
  ctx.closePath();
  ctx.fill();

  /* GROUND */
  const ground = ctx.createLinearGradient(0,550,0,900);
  ground.addColorStop(0,"#72c96f");
  ground.addColorStop(1,"#31934e");

  ctx.fillStyle=ground;

  ctx.beginPath();
  ctx.moveTo(0,610);
  ctx.quadraticCurveTo(220,540,450,625);
  ctx.quadraticCurveTo(690,540,900,620);
  ctx.lineTo(900,900);
  ctx.lineTo(0,900);
  ctx.closePath();
  ctx.fill();

  /* BAMBOO */
  drawBamboo(ctx,105,485,1.05);
  drawBamboo(ctx,800,450,.85);

  /* PANDA BODY */
  ctx.save();

  /* Body black */
  ctx.fillStyle="#171717";

  ctx.beginPath();
  ctx.ellipse(470,610,185,220,0,0,Math.PI*2);
  ctx.fill();

  /* Belly */
  ctx.fillStyle="#f5f2e9";

  ctx.beginPath();
  ctx.ellipse(470,635,125,155,0,0,Math.PI*2);
  ctx.fill();

  /* Left arm */
  ctx.fillStyle="#171717";

  ctx.beginPath();
  ctx.ellipse(315,610,55,120,-.45,0,Math.PI*2);
  ctx.fill();

  /* Right arm */
  ctx.beginPath();
  ctx.ellipse(625,610,55,120,.45,0,Math.PI*2);
  ctx.fill();

  /* Feet */
  ctx.beginPath();
  ctx.ellipse(385,800,70,48,-.15,0,Math.PI*2);
  ctx.fill();

  ctx.beginPath();
  ctx.ellipse(555,800,70,48,.15,0,Math.PI*2);
  ctx.fill();

  /* HEAD */
  ctx.fillStyle="#171717";

  ctx.beginPath();
  ctx.arc(470,380,190,0,Math.PI*2);
  ctx.fill();

  /* EARS */
  ctx.beginPath();
  ctx.arc(320,245,62,0,Math.PI*2);
  ctx.fill();

  ctx.beginPath();
  ctx.arc(620,245,62,0,Math.PI*2);
  ctx.fill();

  /* FACE */
  ctx.fillStyle="#f8f5ec";

  ctx.beginPath();
  ctx.arc(470,400,148,0,Math.PI*2);
  ctx.fill();

  /* Eye patches */
  ctx.fillStyle="#181818";

  ctx.save();
  ctx.translate(405,370);
  ctx.rotate(-.35);
  ctx.beginPath();
  ctx.ellipse(0,0,42,62,0,0,Math.PI*2);
  ctx.fill();
  ctx.restore();

  ctx.save();
  ctx.translate(535,370);
  ctx.rotate(.35);
  ctx.beginPath();
  ctx.ellipse(0,0,42,62,0,0,Math.PI*2);
  ctx.fill();
  ctx.restore();

  /* Eyes */
  ctx.fillStyle="white";

  ctx.beginPath();
  ctx.arc(414,375,18,0,Math.PI*2);
  ctx.fill();

  ctx.beginPath();
  ctx.arc(526,375,18,0,Math.PI*2);
  ctx.fill();

  ctx.fillStyle="#111";

  ctx.beginPath();
  ctx.arc(414,377,9,0,Math.PI*2);
  ctx.fill();

  ctx.beginPath();
  ctx.arc(526,377,9,0,Math.PI*2);
  ctx.fill();

  /* Nose */
  ctx.beginPath();
  ctx.ellipse(470,445,24,17,0,0,Math.PI*2);
  ctx.fill();

  /* Mouth */
  ctx.strokeStyle="#111";
  ctx.lineWidth=8;
  ctx.lineCap="round";

  ctx.beginPath();
  ctx.moveTo(470,460);
  ctx.quadraticCurveTo(450,485,430,474);
  ctx.stroke();

  ctx.beginPath();
  ctx.moveTo(470,460);
  ctx.quadraticCurveTo(490,485,510,474);
  ctx.stroke();

  /* Cheeks */
  ctx.fillStyle="rgba(255,130,130,.55)";

  ctx.beginPath();
  ctx.arc(365,455,22,0,Math.PI*2);
  ctx.fill();

  ctx.beginPath();
  ctx.arc(575,455,22,0,Math.PI*2);
  ctx.fill();

  /* Bamboo in paw */
  ctx.strokeStyle="#4c9b39";
  ctx.lineWidth=24;
  ctx.lineCap="round";

  ctx.beginPath();
  ctx.moveTo(570,690);
  ctx.lineTo(700,530);
  ctx.stroke();

  ctx.strokeStyle="#2f702d";
  ctx.lineWidth=5;

  for(let i=0;i<5;i++){
    const x=590+i*22;
    const y=665-i*27;

    ctx.beginPath();
    ctx.moveTo(x-8,y-8);
    ctx.lineTo(x+8,y+8);
    ctx.stroke();
  }

  ctx.restore();

  /* Small grass */
  ctx.strokeStyle="#217c3c";
  ctx.lineWidth=5;

  for(let x=20;x<900;x+=45){
    const y=820+Math.sin(x)*15;

    ctx.beginPath();
    ctx.moveTo(x,y);
    ctx.lineTo(x-8,y-25);
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(x,y);
    ctx.lineTo(x+10,y-28);
    ctx.stroke();
  }
}

function drawBamboo(ctx,x,y,s){

  ctx.save();

  ctx.strokeStyle="#398b37";
  ctx.lineWidth=22*s;
  ctx.lineCap="round";

  ctx.beginPath();
  ctx.moveTo(x,y+210*s);
  ctx.lineTo(x+12*s,y);
  ctx.stroke();

  ctx.strokeStyle="#276c2c";
  ctx.lineWidth=4*s;

  for(let i=0;i<4;i++){
    const yy=y+45*i*s;

    ctx.beginPath();
    ctx.moveTo(x-10*s,yy);
    ctx.lineTo(x+18*s,yy);
    ctx.stroke();
  }

  ctx.fillStyle="#4eaa45";

  for(let i=0;i<3;i++){
    ctx.beginPath();
    ctx.ellipse(
      x+25*s,
      y+30*i*s+25,
      42*s,
      17*s,
      -.45,
      0,
      Math.PI*2
    );
    ctx.fill();
  }

  ctx.restore();
}

/* ---------------------------------------------------------
   JIGSAW EDGE SYSTEM
--------------------------------------------------------- */

let horizontalEdges = [];
let verticalEdges = [];

/*
  Each internal edge gets one value:

  +1 = tab coming OUT
  -1 = slot going IN

  Neighboring pieces automatically receive
  opposite values, creating matching shapes.
*/

function generateEdges(){

  horizontalEdges = [];

  for(let r=0;r<ROWS;r++){
    horizontalEdges[r]=[];

    for(let c=0;c<COLS-1;c++){
      horizontalEdges[r][c] =
        Math.random()>.5 ? 1 : -1;
    }
  }

  verticalEdges = [];

  for(let r=0;r<ROWS-1;r++){
    verticalEdges[r]=[];

    for(let c=0;c<COLS;c++){
      verticalEdges[r][c] =
        Math.random()>.5 ? 1 : -1;
    }
  }
}

/* ---------------------------------------------------------
   JIGSAW PATH
--------------------------------------------------------- */

function addEdge(path,x1,y1,x2,y2,tab){

  const horizontal = Math.abs(y2-y1)<1;

  if(horizontal){

    const dir = x2>x1 ? 1 : -1;

    const sx = Math.min(x1,x2);
    const sy = y1;

    const w = Math.abs(x2-x1);

    if(tab===0){
      path.lineTo(x2,y2);
      return;
    }

    const sign = tab;

    path.lineTo(sx + w*.32*dir, sy);

    path.bezierCurveTo(
      sx + w*.36*dir, sy,
      sx + w*.36*dir, sy + sign*32,
      sx + w*.50*dir, sy + sign*32
    );

    path.bezierCurveTo(
      sx + w*.64*dir, sy + sign*32,
      sx + w*.64*dir, sy,
      sx + w*.68*dir, sy
    );

    path.lineTo(x2,y2);

  }else{

    const dir = y2>y1 ? 1 : -1;

    const sx = x1;
    const sy = Math.min(y1,y2);

    const h = Math.abs(y2-y1);

    if(tab===0){
      path.lineTo(x2,y2);
      return;
    }

    const sign = tab;

    path.lineTo(sx, sy+h*.32*dir);

    path.bezierCurveTo(
      sx,
      sy+h*.36*dir,
      sx+sign*32,
      sy+h*.36*dir,
      sx+sign*32,
      sy+h*.50*dir
    );

    path.bezierCurveTo(
      sx+sign*32,
      sy+h*.64*dir,
      sx,
      sy+h*.64*dir,
      sx,
      sy+h*.68*dir
    );

    path.lineTo(x2,y2);
  }
}

function piecePath(row,col){

  const p = new Path2D();

  const x0 = PAD;
  const y0 = PAD;

  const x1 = PAD + CELL;
  const y1 = PAD + CELL;

  /* TOP */
  p.moveTo(x0,y0);

  if(row===0){
    p.lineTo(x1,y0);
  }else{
    const edge = verticalEdges[row-1][col];
    addEdge(p,x0,y0,x1,y0,-edge);
  }

  /* RIGHT */
  if(col===COLS-1){
    p.lineTo(x1,y1);
  }else{
    const edge = horizontalEdges[row][col];
    addEdge(p,x1,y0,x1,y1,edge);
  }

  /* BOTTOM */
  if(row===ROWS-1){
    p.lineTo(x0,y1);
  }else{
    const edge = verticalEdges[row][col];
    addEdge(p,x1,y1,x0,y1,edge);
  }

  /* LEFT */
  if(col===0){
    p.lineTo(x0,y0);
  }else{
    const edge = horizontalEdges[row][col-1];
    addEdge(p,x0,y1,x0,y0,-edge);
  }

  p.closePath();

  return p;
}

/* ---------------------------------------------------------
   CREATE ONE PUZZLE PIECE
--------------------------------------------------------- */

function createPieceCanvas(row,col){

  const canvas = document.createElement("canvas");

  canvas.width = PIECE_SIZE;
  canvas.height = PIECE_SIZE;

  const ctx = canvas.getContext("2d");

  const path = piecePath(row,col);

  ctx.save();

  ctx.clip(path);

  /*
    Important:
    Draw the SAME source image with a shifted origin.

    This ensures that when all pieces are correctly placed,
    the Panda picture matches perfectly.
  */

  ctx.drawImage(
    sourceCanvas,
    PAD - col*CELL,
    PAD - row*CELL
  );

  ctx.restore();

  /* Piece outline */
  ctx.strokeStyle="rgba(0,0,0,.55)";
  ctx.lineWidth=3;
  ctx.stroke(path);

  return canvas;
}

/* ---------------------------------------------------------
   TARGET CELLS
--------------------------------------------------------- */

function createTargets(){

  board.innerHTML="";

  for(let row=0;row<ROWS;row++){

    for(let col=0;col<COLS;col++){

      const target=document.createElement("div");

      target.className="target";

      target.style.left=(col/COLS*100)+"%";
      target.style.top=(row/ROWS*100)+"%";
      target.style.width=(100/COLS)+"%";
      target.style.height=(100/ROWS)+"%";

      target.dataset.row=row;
      target.dataset.col=col;

      board.appendChild(target);
    }
  }
}

/* ---------------------------------------------------------
   CREATE PIECES
--------------------------------------------------------- */

function createPieces(){

  piecesContainer.innerHTML="";
  pieces=[];

  let index=0;

  for(let row=0;row<ROWS;row++){

    for(let col=0;col<COLS;col++){

      const piece=document.createElement("div");

      piece.className="piece";

      piece.dataset.row=row;
      piece.dataset.col=col;
      piece.dataset.index=index;

      const canvas=createPieceCanvas(row,col);
      canvas.className="pieceCanvas";

      piece.appendChild(canvas);

      pieces.push(piece);

      addDragEvents(piece);

      piecesContainer.appendChild(piece);

      index++;
    }
  }

  shufflePieces();
}

/* ---------------------------------------------------------
   SHUFFLE
--------------------------------------------------------- */

function shufflePieces(){

  for(let i=pieces.length-1;i>0;i--){

    const j=Math.floor(Math.random()*(i+1));

    const temp=pieces[i];
    pieces[i]=pieces[j];
    pieces[j]=temp;
  }

  pieces.forEach(piece=>{
    piecesContainer.appendChild(piece);
  });
}

/* ---------------------------------------------------------
   DRAGGING
--------------------------------------------------------- */

function addDragEvents(piece){

  let dragging=false;
  let offsetX=0;
  let offsetY=0;

  piece.addEventListener("pointerdown",function(e){

    if(piece.classList.contains("locked")) return;

    initAudio();

    e.preventDefault();

    dragging=true;

    piece.classList.add("dragging");

    const rect=piece.getBoundingClientRect();

    offsetX=e.clientX-rect.left;
    offsetY=e.clientY-rect.top;

    /*
      Fixed positioning makes dragging work reliably
      on Android screens.
    */

    piece.style.position="fixed";
    piece.style.width=PIECE_SIZE+"px";
    piece.style.height=PIECE_SIZE+"px";

    piece.style.left=(e.clientX-offsetX)+"px";
    piece.style.top=(e.clientY-offsetY)+"px";

    try{
      piece.setPointerCapture(e.pointerId);
    }catch(err){}
  });

  piece.addEventListener("pointermove",function(e){

    if(!dragging) return;

    e.preventDefault();

    piece.style.left=(e.clientX-offsetX)+"px";
    piece.style.top=(e.clientY-offsetY)+"px";
  });

  piece.addEventListener("pointerup",function(e){

    if(!dragging) return;

    dragging=false;

    piece.classList.remove("dragging");

    try{
      piece.releasePointerCapture(e.pointerId);
    }catch(err){}

    checkDrop(piece);
  });

  piece.addEventListener("pointercancel",function(){

    if(!dragging) return;

    dragging=false;
    piece.classList.remove("dragging");

    returnPiece(piece);
  });
}

/* ---------------------------------------------------------
   CHECK DROP
--------------------------------------------------------- */

function checkDrop(piece){

  if(piece.classList.contains("locked")) return;

  const row=Number(piece.dataset.row);
  const col=Number(piece.dataset.col);

  const boardRect=board.getBoundingClientRect();

  const pieceRect=piece.getBoundingClientRect();

  const centerX=
    pieceRect.left + pieceRect.width/2;

  const centerY=
    pieceRect.top + pieceRect.height/2;

  const targetX=
    boardRect.left +
    (col+.5)*(boardRect.width/COLS);

  const targetY=
    boardRect.top +
    (row+.5)*(boardRect.height/ROWS);

  const dx=centerX-targetX;
  const dy=centerY-targetY;

  const distance=Math.sqrt(dx*dx+dy*dy);

  /*
    Forgiving snap area for Android.
  */

  const snapDistance=
    Math.min(boardRect.width/COLS,boardRect.height/ROWS)*.48;

  moves++;

  updateStats();

  if(distance<=snapDistance){

    placeCorrectPiece(piece,row,col);

  }else{

    wrongPiece(piece);
  }
}

/* ---------------------------------------------------------
   CORRECT PLACEMENT
--------------------------------------------------------- */

function placeCorrectPiece(piece,row,col){

  const boardRect=board.getBoundingClientRect();

  /*
    Convert the padded piece size from source pixels
    into the board's displayed size.
  */

  const scale=boardRect.width/SIZE;

  const displayedPieceSize=
    PIECE_SIZE*scale;

  const left=
    boardRect.left +
    col*CELL*scale -
    PAD*scale;

  const top=
    boardRect.top +
    row*CELL*scale -
    PAD*scale;

  piece.style.position="fixed";

  piece.style.width=displayedPieceSize+"px";
  piece.style.height=displayedPieceSize+"px";

  piece.style.left=left+"px";
  piece.style.top=top+"px";

  piece.classList.add("locked");

  piece.style.pointerEvents="none";

  completedCount++;

  correctSound();

  showMessage("🎉 Great! Correct piece!",true);

  if(completedCount===ROWS*COLS){

    setTimeout(finishGame,350);
  }
}

/* ---------------------------------------------------------
   WRONG PIECE
--------------------------------------------------------- */

function wrongPiece(piece){

  wrongSound();

  showMessage("❌ Not there. Try another position.",false);

  piece.classList.add("shake");

  setTimeout(()=>{

    piece.classList.remove("shake");

    returnPiece(piece);

  },350);
}

/* ---------------------------------------------------------
   RETURN PIECE
--------------------------------------------------------- */

function returnPiece(piece){

  piece.style.position="";
  piece.style.width="";
  piece.style.height="";
  piece.style.left="";
  piece.style.top="";
  piece.style.zIndex="";

  piecesContainer.appendChild(piece);
}

/* ---------------------------------------------------------
   STATS
--------------------------------------------------------- */

function updateStats(){

  document.getElementById("moves").textContent=moves;

  let currentScore=
    Math.max(
      0,
      100 -
      moves*2 -
      Math.floor(seconds/5)
    );

  document.getElementById("score").textContent=currentScore;
}

function currentScore(){

  return Math.max(
    0,
    100 -
    moves*2 -
    Math.floor(seconds/5)
  );
}

function showMessage(text,good){

  const msg=document.getElementById("message");

  msg.textContent=text;

  msg.className=good ? "good" : "bad";

  setTimeout(()=>{

    if(gameRunning){
      msg.textContent="Drag each piece into the correct place.";
      msg.className="";
    }

  },1200);
}

/* ---------------------------------------------------------
   TIMER
--------------------------------------------------------- */

function startTimer(){

  clearInterval(timerInterval);

  timerInterval=setInterval(()=>{

    if(!gameRunning) return;

    seconds++;

    document.getElementById("timer").textContent=seconds;

    updateStats();

  },1000);
}

/* ---------------------------------------------------------
   FINISH
--------------------------------------------------------- */

function finishGame(){

  if(!gameRunning) return;

  gameRunning=false;

  clearInterval(timerInterval);

  const finalScore=currentScore();

  document.getElementById("finalTime").textContent=seconds;
  document.getElementById("finalMoves").textContent=moves;
  document.getElementById("finalScore").textContent=finalScore;

  const oldBestScore=getBestScore();
  const oldBestTime=getBestTime();

  if(oldBestScore===null || finalScore>oldBestScore){

    localStorage.setItem(
      "completePic_v16_bestScore",
      finalScore
    );
  }

  if(oldBestTime===null || seconds<oldBestTime){

    localStorage.setItem(
      "completePic_v16_bestTime",
      seconds
    );
  }

  updateBestDisplay();

  winSound();

  setTimeout(()=>{

    document.getElementById("winBox").style.display="flex";

  },300);
}

/* ---------------------------------------------------------
   NEW GAME
--------------------------------------------------------- */

function newGame(){

  initAudio();

  clearInterval(timerInterval);

  moves=0;
  seconds=0;
  completedCount=0;
  gameRunning=true;

  document.getElementById("timer").textContent="0";
  document.getElementById("moves").textContent="0";
  document.getElementById("score").textContent="100";

  document.getElementById("message").textContent=
    "Drag each piece into the correct place.";

  document.getElementById("message").className="";

  document.getElementById("winBox").style.display="none";

  drawPanda();

  generateEdges();

  createTargets();

  createPieces();

  updateBestDisplay();

  startTimer();

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });
}

/* ---------------------------------------------------------
   PLAY AGAIN
--------------------------------------------------------- */

function closeWinAndNewGame(){

  document.getElementById("winBox").style.display="none";

  newGame();
}

/* ---------------------------------------------------------
   START
--------------------------------------------------------- */

updateBestDisplay();
newGame();

</script>
