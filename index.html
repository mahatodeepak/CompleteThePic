}

    position:relative;

    inset:0;

    position:absolute;

    pointer-events:none;

    padding:10px 4px 20px;

/*
   Pieces are deliberately larger than before.
*/

    height:92px;

    touch-action:none;
    user-select:none;
    -webkit-user-select:none;

    cursor:grab;

    z-index:20;

    background:transparent;
}

.piece.dragging{
    cursor:grabbing;
    z-index:10000;

    filter:
        drop-shadow(0 7px 10px rgba(0,0,0,.28));

    transform:scale(1.04);
}

.pieceCanvas{

    height:100%;
    display:block;
    pointer-events:none;

    border-radius:4px;

/* LOCKED */

.piece.locked{
    position:absolute !important;

    margin:0 !important;

    cursor:default;

    pointer-events:none;

    z-index:5;

    transform:none !important;

    filter:none;
}

/* MESSAGE */

    text-align:center;
    min-height:28px;
    font-weight:bold;
    margin:3px 0 8px;
}

    display:flex;
    justify-content:center;
    margin-top:5px;
}

    border-radius:12px;
    padding:12px 24px;

    font-size:16px;
    font-weight:bold;

    color:white;

    box-shadow:0 3px 8px rgba(0,0,0,.16);
}

    transform:scale(.97);
}

<body>

<header>

<h1>🧩 Complete the Pic</h1>

<div class="subtitle">
Pick the pieces. Complete the picture!
</div>

<div class="stats">

<div class="stat">
<b id="time">00:00</b>
<span>TIME</span>
</div>

<div class="stat">
<b id="moves">0</b>
<span>MOVES</span>
</div>

<div class="stat">
<b id="score">100</b>
<span>SCORE</span>
</div>

<div class="stat">
<b id="best">—</b>
<span>BEST</span>
</div>

</div>

</header>


<div id="game">

<div id="frameWrap">

<div id="frame">

<canvas id="board"></canvas>

<div id="lockedPieces"></div>

</div>

</div>


<div id="piecesTitle">
🧩 Drag the pieces into the Panda picture
</div>

<div id="piecesArea"></div>

<div id="message"></div>

<div class="buttons">
<button onclick="newGame()">🔄 New Game</button>
</div>

</div>


<div id="winScreen">

<div class="winBox">

<h2>🎉 Picture Complete!</h2>

<p>
You completed the Panda picture!
</p>

<p>
<b>Time:</b>
<span id="finalTime">00:00</span>
<br>

<b>Moves:</b>
<span id="finalMoves">0</span>
<br>

<b>Score:</b>
<span id="finalScore">100</span>
</p>

<button onclick="newGame()">
▶ Play Again
</button>

</div>

</div>


<div id="confetti"></div>


<script>

/* ==================================
   GAME SETTINGS
================================== */

const ROWS = 3;
const COLS = 3;


/* ==================================
   ELEMENTS
================================== */

const frame =
    document.getElementById("frame");

const board =
    document.getElementById("board");

const ctx =
    board.getContext("2d");

const piecesArea =
    document.getElementById("piecesArea");

const lockedPieces =
    document.getElementById("lockedPieces");

const message =
    document.getElementById("message");

const timeEl =
    document.getElementById("time");

const movesEl =
    document.getElementById("moves");

const scoreEl =
    document.getElementById("score");

const bestEl =
    document.getElementById("best");


/* ==================================
   IMAGE
================================== */

const pandaImage =
    new Image();

let imageReady = false;


/*
   IMPORTANT:
   Game starts ONLY after image loads.
*/

pandaImage.onload = function(){

    imageReady = true;

    resizeBoard();

    newGame();
};

pandaImage.onerror = function(){

    imageReady = false;

    message.innerHTML =
        "⚠️ <b>panda.png not found.</b><br>" +
        "Put panda.png in the same folder as index.html.";
};


/*
   Cache-busting prevents an old broken
   image from being used by browser cache.
*/

pandaImage.src =
    "panda.png?v=26";


/* ==================================
   GAME VARIABLES
================================== */

let seconds = 0;
let moves = 0;
let score = 100;

let timer = null;
let gameStarted = false;

let lockedCount = 0;

let draggingPiece = null;

let offsetX = 0;
let offsetY = 0;


/* ==================================
   BEST SCORE
================================== */

function showBest(){

    const best =
        localStorage.getItem(
            "completePic_v26_bestScore"
        );

    bestEl.textContent =
        best ? best : "—";
}


/* ==================================
   TIME
================================== */

function formatTime(value){

    const minutes =
        Math.floor(value / 60);

    const secondsPart =
        value % 60;

    return String(minutes).padStart(2,"0")
        + ":" +
        String(secondsPart).padStart(2,"0");
}


function startTimer(){

    if(timer) return;

    timer = setInterval(function(){

        if(!gameStarted) return;

        seconds++;

        updateStats();

    },1000);
}


function stopTimer(){

    if(timer){

        clearInterval(timer);

        timer = null;
    }
}


/* ==================================
   STATS
================================== */

function updateStats(){

    timeEl.textContent =
        formatTime(seconds);

    movesEl.textContent =
        moves;

    score =
        Math.max(
            0,
            100 -
            moves * 2 -
            Math.floor(seconds / 5)
        );

    scoreEl.textContent =
        score;
}


/* ==================================
   BOARD SIZE
================================== */

function resizeBoard(){

    const rect =
        frame.getBoundingClientRect();

    const dpr =
        window.devicePixelRatio || 1;

    board.width =
        Math.round(rect.width * dpr);

    board.height =
        Math.round(rect.height * dpr);

    board.style.width =
        rect.width + "px";

    board.style.height =
        rect.height + "px";

    ctx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
    );

    drawBoard();

    repositionLockedPieces();
}


/* ==================================
   DRAW FRAME PICTURE
================================== */

function drawBoard(){

    if(!imageReady) return;

    const w =
        frame.clientWidth;

    const h =
        frame.clientHeight;

    ctx.clearRect(
        0,
        0,
        w,
        h
    );

    /*
       White frame
    */

    ctx.fillStyle =
        "#ffffff";

    ctx.fillRect(
        0,
        0,
        w,
        h
    );

    /*
       Very faint Panda guide
    */

    ctx.globalAlpha =
        0.11;

    ctx.drawImage(
        pandaImage,
        0,
        0,
        w,
        h
    );

    ctx.globalAlpha =
        1;

    /*
       Very light puzzle grid
    */

    ctx.strokeStyle =
        "rgba(100,110,120,.16)";

    ctx.lineWidth = 1;

    for(let i=1;i<3;i++){

        const x =
            w * i / 3;

        ctx.beginPath();

        ctx.moveTo(x,0);
        ctx.lineTo(x,h);

        ctx.stroke();
    }

    for(let i=1;i<3;i++){

        const y =
            h * i / 3;

        ctx.beginPath();

        ctx.moveTo(0,y);
        ctx.lineTo(w,y);

        ctx.stroke();
    }
}


/* ==================================
   CREATE ONE PIECE
================================== */

function createPiece(
    row,
    col,
    number
){

    const piece =
        document.createElement("div");

    piece.className =
        "piece";

    piece.dataset.row =
        row;

    piece.dataset.col =
        col;

    piece.dataset.number =
        number;

    /*
       Every piece gets a different
       interesting silhouette.
    */

    const canvas =
        document.createElement("canvas");

    canvas.className =
        "pieceCanvas shape" + number;

    const size = 200;

    canvas.width = size;
    canvas.height = size;

    const pctx =
        canvas.getContext("2d");

    /*
       Draw the exact corresponding
       part of the Panda image.
    */

    const sw =
        pandaImage.naturalWidth / 3;

    const sh =
        pandaImage.naturalHeight / 3;

    pctx.drawImage(
        pandaImage,

        col * sw,
        row * sh,
        sw,
        sh,

        0,
        0,
        size,
        size
    );

    piece.appendChild(canvas);

    piecesArea.appendChild(piece);

    setupDrag(piece);
}


/* ==================================
   CREATE ALL PIECES
================================== */

function createPieces(){

    piecesArea.innerHTML = "";

    let list = [];

    for(let row=0;row<3;row++){

        for(let col=0;col<3;col++){

            list.push({
                row:row,
                col:col
            });
        }
    }

    /*
       Shuffle
    */

    list.sort(
        () => Math.random() - 0.5
    );

    list.forEach(
        (item,index)=>{

            createPiece(
                item.row,
                item.col,
                index
            );

        }
    );
}


/* ==================================
   DRAG
================================== */

function setupDrag(piece){

    piece.addEventListener(
        "pointerdown",
        function(e){

            startDrag(
                piece,
                e
            );

        }
    );
}


function startDrag(piece,e){

    if(piece.classList.contains("locked")){
        return;
    }

    e.preventDefault();

    draggingPiece =
        piece;

    const rect =
        piece.getBoundingClientRect();

    offsetX =
        e.clientX - rect.left;

    offsetY =
        e.clientY - rect.top;

    /*
       IMPORTANT:
       Move piece to BODY.
       This allows it to cross
       the frame.
    */

    document.body.appendChild(piece);

    piece.style.position =
        "fixed";

    piece.style.left =
        rect.left + "px";

    piece.style.top =
        rect.top + "px";

    piece.classList.add(
        "dragging"
    );

    if(!gameStarted){

        gameStarted = true;

        startTimer();
    }

    vibrate(15);
}


/* ==================================
   MOVE
================================== */

document.addEventListener(
    "pointermove",
    function(e){

        if(!draggingPiece){
            return;
        }

        e.preventDefault();

        draggingPiece.style.left =
            (
                e.clientX -
                offsetX
            ) + "px";

        draggingPiece.style.top =
            (
                e.clientY -
                offsetY
            ) + "px";

    },
    {
        passive:false
    }
);


/* ==================================
   DROP
================================== */

document.addEventListener(
    "pointerup",
    function(){

        if(!draggingPiece){
            return;
        }

        const piece =
            draggingPiece;

        draggingPiece = null;

        piece.classList.remove(
            "dragging"
        );

        checkDrop(piece);
    }
);


/* ==================================
   CHECK DROP
================================== */

function checkDrop(piece){

    const frameRect =
        frame.getBoundingClientRect();

    const pieceRect =
        piece.getBoundingClientRect();

    const centerX =
        pieceRect.left +
        pieceRect.width / 2;

    const centerY =
        pieceRect.top +
        pieceRect.height / 2;

    const cellW =
        frameRect.width / 3;

    const cellH =
        frameRect.height / 3;

    const correctRow =
        Number(piece.dataset.row);

    const correctCol =
        Number(piece.dataset.col);

    const targetX =
        frameRect.left +
        correctCol * cellW +
        cellW / 2;

    const targetY =
        frameRect.top +
        correctRow * cellH +
        cellH / 2;

    const dx =
        centerX - targetX;

    const dy =
        centerY - targetY;

    const distance =
        Math.sqrt(
            dx*dx + dy*dy
        );

    /*
       Large tolerance makes
       Android placement easy.
    */

    const tolerance =
        Math.min(
            cellW,
            cellH
        ) * 0.72;

    if(distance <= tolerance){

        lockPiece(
            piece,
            correctRow,
            correctCol
        );

    }else{

        wrongPiece(piece);
    }
}


/* ==================================
   LOCK
================================== */

function lockPiece(
    piece,
    row,
    col
){

    const cellW =
        frame.clientWidth / 3;

    const cellH =
        frame.clientHeight / 3;

    /*
       Put completed piece INSIDE
       the frame.

       This fixes the scrolling problem.
    */

    lockedPieces.appendChild(piece);

    piece.classList.add(
        "locked"
    );

    piece.style.width =
        cellW + "px";

    piece.style.height =
        cellH + "px";

    piece.style.left =
        (col * cellW) + "px";

    piece.style.top =
        (row * cellH) + "px";

    piece.style.position =
        "absolute";

    piece.dataset.locked =
        "true";

    lockedCount++;

    moves++;

    updateStats();

    message.textContent =
        "🎉 Great! Correct piece!";

    vibrate(40);

    if(lockedCount === 9){

        finishGame();
    }
}


/* ==================================
   WRONG
================================== */

function wrongPiece(piece){

    moves++;

    updateStats();

    message.textContent =
        "❌ Try another position!";

    piece.classList.add(
        "shake"
    );

    vibrate([
        35,
        25,
        35
    ]);

    setTimeout(
        function(){

            piece.classList.remove(
                "shake"
            );

            returnPiece(piece);

        },
        350
    );
}


/* ==================================
   RETURN PIECE
================================== */

function returnPiece(piece){

    piecesArea.appendChild(
        piece
    );

    piece.style.position =
        "relative";

    piece.style.left = "";
    piece.style.top = "";

    piece.style.width = "";
    piece.style.height = "";

    piece.dataset.locked =
        "false";
}


/* ==================================
   KEEP LOCKED PIECES WITH FRAME
================================== */

function repositionLockedPieces(){

    if(!lockedPieces){
        return;
    }

    const cellW =
        frame.clientWidth / 3;

    const cellH =
        frame.clientHeight / 3;

    const pieces =
        lockedPieces.querySelectorAll(
            ".piece"
        );

    pieces.forEach(
        function(piece){

            const row =
                Number(piece.dataset.row);

            const col =
                Number(piece.dataset.col);

            piece.style.width =
                cellW + "px";

            piece.style.height =
                cellH + "px";

            piece.style.left =
                (col * cellW) + "px";

            piece.style.top =
                (row * cellH) + "px";
        }
    );
}


/* ==================================
   FINISH
================================== */

function finishGame(){

    stopTimer();

    gameStarted = false;

    updateStats();

    const oldBest =
        Number(
            localStorage.getItem(
                "completePic_v26_bestScore"
            ) || 0
        );

    if(score > oldBest){

        localStorage.setItem(
            "completePic_v26_bestScore",
            score
        );
    }

    showBest();

    document.getElementById(
        "finalTime"
    ).textContent =
        formatTime(seconds);

    document.getElementById(
        "finalMoves"
    ).textContent =
        moves;

    document.getElementById(
        "finalScore"
    ).textContent =
        score;

    createConfetti();

    setTimeout(
        function(){

            document.getElementById(
                "winScreen"
            ).style.display =
                "flex";

        },
        500
    );
}


/* ==================================
   CONFETTI
================================== */

function createConfetti(){

    const area =
        document.getElementById(
            "confetti"
        );

    area.innerHTML = "";

    for(let i=0;i<80;i++){

        const c =
            document.createElement("div");

        c.className =
            "confetti";

        c.style.left =
            Math.random()*100 + "%";

        c.style.background =
            `hsl(${Math.random()*360},80%,55%)`;

        c.style.animationDelay =
            Math.random()*1.2 + "s";

        area.appendChild(c);
    }

    setTimeout(
        function(){
            area.innerHTML = "";
        },
        4000
    );
}


/* ==================================
   VIBRATION
================================== */

function vibrate(pattern){

    if(
        navigator.vibrate &&
        typeof navigator.vibrate === "function"
    ){

        navigator.vibrate(pattern);
    }
}


/* ==================================
   NEW GAME
================================== */

function newGame(){

    /*
       Refresh / New Game ALWAYS
       starts completely from zero.
    */

    stopTimer();

    seconds = 0;
    moves = 0;
    score = 100;

    gameStarted = false;

    lockedCount = 0;

    draggingPiece = null;

    /*
       Remove every old piece.
    */

    document
        .querySelectorAll(".piece")
        .forEach(
            function(piece){
                piece.remove();
            }
        );

    piecesArea.innerHTML = "";

    lockedPieces.innerHTML = "";

    document.getElementById(
        "winScreen"
    ).style.display = "none";

    document.getElementById(
        "confetti"
    ).innerHTML = "";

    message.textContent = "";

    updateStats();

    drawBoard();

    /*
       Only create pieces if
       image is ready.
    */

    if(imageReady){

        createPieces();
    }

    showBest();
}


/* ==================================
   WINDOW RESIZE
================================== */

window.addEventListener(
    "resize",
    function(){

        if(imageReady){

            resizeBoard();
        }
    }
);


/* ==================================
   INITIAL
================================== */

showBest();

</script>

</html>
