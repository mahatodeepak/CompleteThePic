<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Complete the Pic V2.1</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  padding:0;
  width:100%;
  min-height:100%;
  font-family:Arial,sans-serif;
  background:linear-gradient(180deg,#eef8ff,#ffffff);
  color:#222;
  overflow-x:hidden;
}

body{
  text-align:center;
}

h1{
  margin:15px 0 3px;
  font-size:28px;
  color:#222;
}

.subtitle{
  margin:0 0 12px;
  color:#666;
  font-size:15px;
}

#info{
  display:flex;
  justify-content:center;
  gap:10px;
  flex-wrap:wrap;
  margin:8px auto 14px;
}

.infoBox{
  background:white;
  border:1px solid #ddd;
  border-radius:12px;
  padding:8px 14px;
  min-width:85px;
  box-shadow:0 2px 8px rgba(0,0,0,.06);
}

.infoTitle{
  font-size:11px;
  color:#888;
}

.infoValue{
  font-size:18px;
  font-weight:bold;
  margin-top:2px;
}

#gameArea{
  width:100%;
  max-width:620px;
  margin:auto;
  padding:0 12px 30px;
}

/* =========================
   PUZZLE FRAME
========================= */

#frameTitle{
  font-size:14px;
  color:#777;
  margin-bottom:7px;
}

#boardWrap{
  width:min(92vw,500px);
  aspect-ratio:1/1;
  margin:auto;

  background:#fff;

  /* LIGHT FRAME */
  border:4px solid #bfc5ca;
  border-radius:10px;

  box-shadow:
    0 3px 12px rgba(0,0,0,.08),
    inset 0 0 0 1px #f4f4f4;

  position:relative;
  overflow:visible;
}

#board{
  width:100%;
  height:100%;
  display:block;
  border-radius:5px;
}

/* Very light target grid */
.targetGrid{
  position:absolute;
  inset:0;
  display:grid;
  grid-template-columns:repeat(3,1fr);
  grid-template-rows:repeat(3,1fr);
  pointer-events:none;
}

.targetCell{
  border:1px dashed rgba(120,130,140,.25);
  background:rgba(255,255,255,.06);
}

/* =========================
   INSTRUCTION
========================= */

#instruction{
  margin:12px auto 8px;
  width:min(92vw,500px);
  padding:10px;
  border-radius:10px;
  background:#ffffff;
  border:1px solid #e1e1e1;
  color:#666;
  font-size:14px;
}

/* =========================
   PIECES AREA
========================= */

#piecesTitle{
  margin:16px 0 8px;
  font-size:16px;
  font-weight:bold;
}

#piecesArea{
  width:min(94vw,600px);
  min-height:230px;
  margin:auto;
  padding:12px;

  background:rgba(255,255,255,.9);
  border:1px solid #ddd;
  border-radius:14px;

  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  align-items:center;
  gap:10px;

  position:relative;
}

/* Puzzle pieces */
.piece{
  position:relative;

  width:92px;
  height:92px;

  border:2px solid #aaa;
  border-radius:6px;

  background:#fff;

  box-shadow:
    0 3px 8px rgba(0,0,0,.16);

  touch-action:none;
  user-select:none;
  -webkit-user-select:none;

  cursor:grab;

  z-index:10;

  transition:
    transform .12s ease,
    box-shadow .12s ease;
}

.piece canvas{
  width:100%;
  height:100%;
  display:block;
  border-radius:4px;
  pointer-events:none;
}

.piece.dragging{
  cursor:grabbing;

  transform:scale(1.06);

  box-shadow:
    0 12px 28px rgba(0,0,0,.30);

  z-index:99999;
}

/* Wrong answer */
.piece.wrong{
  animation:shake .35s ease;
}

@keyframes shake{
  0%{transform:translateX(0);}
  20%{transform:translateX(-10px);}
  40%{transform:translateX(10px);}
  60%{transform:translateX(-8px);}
  80%{transform:translateX(8px);}
  100%{transform:translateX(0);}
}

/* Locked pieces */
.piece.locked{
  position:fixed !important;
  margin:0;
  padding:0;

  border:1px solid rgba(0,0,0,.12);

  box-shadow:none;

  z-index:500;

  cursor:default;

  pointer-events:none;
}

/* =========================
   BUTTON
========================= */

button{
  border:0;
  border-radius:12px;
  padding:12px 22px;

  background:#222;
  color:white;

  font-size:16px;
  font-weight:bold;

  cursor:pointer;

  box-shadow:0 3px 8px rgba(0,0,0,.15);
}

button:active{
  transform:scale(.96);
}

#newGameBtn{
  margin-top:14px;
}

/* =========================
   WIN MODAL
========================= */

#winScreen{
  position:fixed;
  inset:0;

  background:rgba(0,0,0,.55);

  display:none;
  align-items:center;
  justify-content:center;

  z-index:100000;
}

#winBox{
  width:min(88vw,380px);

  background:white;
  border-radius:20px;

  padding:28px 20px;

  box-shadow:0 15px 45px rgba(0,0,0,.35);

  animation:pop .35s ease;
}

@keyframes pop{
  0%{
    transform:scale(.6);
    opacity:0;
  }

  100%{
    transform:scale(1);
    opacity:1;
  }
}

#winEmoji{
  font-size:55px;
}

#winBox h2{
  margin:8px 0;
  font-size:27px;
}

#winMessage{
  color:#666;
  line-height:1.5;
}

#finalScore{
  font-size:22px;
  font-weight:bold;
  margin:12px 0;
}

/* Confetti */
.confetti{
  position:fixed;
  width:9px;
  height:14px;
  z-index:100001;
  pointer-events:none;
  animation:fall 2s linear forwards;
}

@keyframes fall{
  from{
    transform:translateY(-20px) rotate(0deg);
    opacity:1;
  }

  to{
    transform:translateY(100vh) rotate(720deg);
    opacity:0;
  }
}

/* Small screens */
@media(max-width:400px){

  h1{
    font-size:24px;
  }

  .piece{
    width:82px;
    height:82px;
  }

  #piecesArea{
    min-height:215px;
    gap:7px;
    padding:8px;
  }
}
</style>
</head>

<body>

<h1>🧩 Complete the Pic</h1>

<div class="subtitle">
  Pick the pieces. Complete the picture!
</div>

<div id="info">

  <div class="infoBox">
    <div class="infoTitle">TIME</div>
    <div class="infoValue" id="timer">00:00</div>
  </div>

  <div class="infoBox">
    <div class="infoTitle">MOVES</div>
    <div class="infoValue" id="moves">0</div>
  </div>

  <div class="infoBox">
    <div class="infoTitle">SCORE</div>
    <div class="infoValue" id="score">100</div>
  </div>

</div>

<div id="gameArea">

  <div id="frameTitle">
    🐼 Complete the Panda
  </div>

  <div id="boardWrap">

    <canvas id="board"></canvas>

    <div class="targetGrid">
      <div class="targetCell"></div>
      <div class="targetCell"></div>
      <div class="targetCell"></div>
      <div class="targetCell"></div>
      <div class="targetCell"></div>
      <div class="targetCell"></div>
      <div class="targetCell"></div>
      <div class="targetCell"></div>
      <div class="targetCell"></div>
    </div>

  </div>

  <div id="instruction">
    👆 Drag a piece <b>across the frame</b> and place it near its matching position.
  </div>

  <div id="piecesTitle">
    🧩 Pieces
  </div>

    🔄 New Game
  </button>

<!-- WIN SCREEN -->

  <div id="winBox">

    <div id="winEmoji">🎉🐼🎉</div>

    <h2>Picture Complete!</h2>

    <div id="winMessage">
      Great job! You completed the Panda.
    </div>

    <div id="finalScore">
      Score: 100
    </div>

    <button id="playAgainBtn">
      ▶ Play Again
    </button>

  </div>

<script>

/* =====================================================
   COMPLETE THE PIC V2.1
   ===================================================== */

/* ---------- IMAGE ---------- */

const pandaImage = new Image();

pandaImage.src = "panda.png";

let imageReady = false;

pandaImage.onload = function(){

  imageReady = true;

  drawBoard();

  newGame();

};

pandaImage.onerror = function(){

  alert(
    "panda.png could not be loaded. " +
    "Please make sure panda.png is in the same folder as index.html."
  );

};


/* ---------- ELEMENTS ---------- */

const board =
  document.getElementById("board");

const boardWrap =
  document.getElementById("boardWrap");

const piecesArea =
  document.getElementById("piecesArea");

const timerElement =
  document.getElementById("timer");

const movesElement =
  document.getElementById("moves");

const scoreElement =
  document.getElementById("score");

const winScreen =
  document.getElementById("winScreen");

const finalScore =
  document.getElementById("finalScore");

const playAgainBtn =
  document.getElementById("playAgainBtn");

const newGameBtn =
  document.getElementById("newGameBtn");

const boardCtx =
  board.getContext("2d");


/* ---------- GAME SETTINGS ---------- */

const GRID = 3;

let pieces = [];

let lockedCount = 0;

let moves = 0;

let seconds = 0;

let timerInterval = null;

let gameStarted = false;

let draggingPiece = null;

let dragOffsetX = 0;

let dragOffsetY = 0;

let originalParent = null;

let originalLeft = "";

let originalTop = "";

let originalPosition = "";

let originalZIndex = "";


/* ---------- AUDIO ---------- */

let audioContext = null;

function getAudio(){

  if(!audioContext){

    try{

      audioContext =
        new (window.AudioContext ||
             window.webkitAudioContext)();

    }catch(e){}

  }

  return audioContext;

}


function beep(
  frequency,
  duration,
  type="sine"
){

  const ctx = getAudio();

  if(!ctx) return;

  try{

    const oscillator =
      ctx.createOscillator();

    const gain =
      ctx.createGain();

    oscillator.type = type;

    oscillator.frequency.value =
      frequency;

    gain.gain.setValueAtTime(
      .0001,
      ctx.currentTime
    );

    gain.gain.exponentialRampToValueAtTime(
      .12,
      ctx.currentTime + .02
    );

    gain.gain.exponentialRampToValueAtTime(
      .0001,
      ctx.currentTime + duration
    );

    oscillator.connect(gain);

    gain.connect(ctx.destination);

    oscillator.start();

    oscillator.stop(
      ctx.currentTime + duration
    );

  }catch(e){}

}


function correctSound(){

  beep(700,.12,"sine");

  setTimeout(()=>{
    beep(950,.16,"sine");
  },100);

}


function wrongSound(){

  beep(170,.18,"sawtooth");

}


/* ---------- VIBRATION ---------- */

function vibrate(ms){

  if(
    navigator.vibrate
  ){

    navigator.vibrate(ms);

  }

}


/* =====================================================
   BOARD
   ===================================================== */

function resizeBoard(){

  const rect =
    board.getBoundingClientRect();

  const dpr =
    window.devicePixelRatio || 1;

  board.width =
    Math.round(rect.width * dpr);

  board.height =
    Math.round(rect.height * dpr);

  boardCtx.setTransform(
    dpr,
    0,
    0,
    dpr,
    0,
    0
  );

}


/* ---------- DRAW BOARD ---------- */

function drawBoard(){

  if(!imageReady) return;

  resizeBoard();

  const rect =
    board.getBoundingClientRect();

  const w = rect.width;

  const h = rect.height;

  boardCtx.clearRect(
    0,
    0,
    w,
    h
  );

  /* White background */

  boardCtx.fillStyle =
    "#ffffff";

  boardCtx.fillRect(
    0,
    0,
    w,
    h
  );

  /* Very faint Panda guide */

  boardCtx.globalAlpha =
    0.10;

  boardCtx.drawImage(
    pandaImage,
    0,
    0,
    w,
    h
  );

  boardCtx.globalAlpha =
    1;

}


/* =====================================================
   CREATE PUZZLE PIECES
   ===================================================== */

function createPieces(){

  piecesArea.innerHTML = "";

  pieces = [];

  lockedCount = 0;

  const sourceW =
    pandaImage.naturalWidth;

  const sourceH =
    pandaImage.naturalHeight;

  const cropW =
    sourceW / GRID;

  const cropH =
    sourceH / GRID;


  /* Create positions 0 → 8 */

  const positions = [];

  for(let r=0;r<GRID;r++){

    for(let c=0;c<GRID;c++){

      positions.push({
        row:r,
        col:c,
        index:r*GRID+c
      });

    }

  }


  /* Shuffle */

  for(let i=positions.length-1;i>0;i--){

    const j =
      Math.floor(
        Math.random()*(i+1)
      );

    [
      positions[i],
      positions[j]
    ] =
    [
      positions[j],
      positions[i]
    ];

  }


  positions.forEach(
    (pos,index)=>{

      const piece =
        document.createElement("div");

      piece.className =
        "piece";

      piece.dataset.row =
        pos.row;

      piece.dataset.col =
        pos.col;

      piece.dataset.index =
        pos.index;


      const canvas =
        document.createElement("canvas");

      canvas.width = 300;

      canvas.height = 300;

      const ctx =
        canvas.getContext("2d");

      /*
        IMPORTANT:
        Every piece is cropped from
        the SAME panda.png.
      */

      ctx.drawImage(
        pandaImage,

        pos.col * cropW,
        pos.row * cropH,
        cropW,
        cropH,

        0,
        0,
        300,
        300
      );


      piece.appendChild(canvas);

      piecesArea.appendChild(piece);

      setupDragging(piece);

      pieces.push(piece);

    }
  );

}


/* =====================================================
   DRAGGING
   ===================================================== */

function setupDragging(piece){

  piece.addEventListener(
    "pointerdown",
    startDrag
  );

}


function startDrag(e){

  e.preventDefault();

  if(
    this.classList.contains("locked")
  ){

    return;

  }

  if(!gameStarted){

    startTimer();

  }


  const piece = this;

  draggingPiece = piece;

  originalParent =
    piece.parentElement;

  originalLeft =
    piece.style.left;

  originalTop =
    piece.style.top;

  originalPosition =
    piece.style.position;

  originalZIndex =
    piece.style.zIndex;


  /*
    VERY IMPORTANT FIX:

    Remove the piece from the pieces area
    while dragging.

    It is placed directly on BODY.

    Therefore it CAN cross the frame boundary.
  */

  const rect =
    piece.getBoundingClientRect();

  dragOffsetX =
    e.clientX - rect.left;

  dragOffsetY =
    e.clientY - rect.top;


  document.body.appendChild(piece);


  piece.style.position =
    "fixed";

  piece.style.width =
    rect.width + "px";

  piece.style.height =
    rect.height + "px";

  piece.style.left =
    rect.left + "px";

  piece.style.top =
    rect.top + "px";

  piece.style.margin =
    "0";

  piece.style.zIndex =
    "99999";

  piece.classList.add(
    "dragging"
  );


  try{

    piece.setPointerCapture(
      e.pointerId
    );

  }catch(err){}


  piece.addEventListener(
    "pointermove",
    dragMove
  );

  piece.addEventListener(
    "pointerup",
    endDrag
  );

  piece.addEventListener(
    "pointercancel",
    cancelDrag
  );

}


function dragMove(e){

  e.preventDefault();

  if(
    !draggingPiece
  ) return;


  /*
    NO CLAMPING HERE.

    The piece is allowed to move
    over the ENTIRE SCREEN.
  */

  draggingPiece.style.left =
    (
      e.clientX -
      dragOffsetX
    ) + "px";

  draggingPiece.style.top =
    (
      e.clientY -
      dragOffsetY
    ) + "px";

}


function endDrag(e){

  e.preventDefault();

  if(
    !draggingPiece
  ) return;


  const piece =
    draggingPiece;


  piece.removeEventListener(
    "pointermove",
    dragMove
  );

  piece.removeEventListener(
    "pointerup",
    endDrag
  );

  piece.removeEventListener(
    "pointercancel",
    cancelDrag
  );


  checkDrop(
    piece,
    e.clientX,
    e.clientY
  );


  draggingPiece =
    null;

}


function cancelDrag(){

  if(!draggingPiece)
    return;

  returnPiece(
    draggingPiece
  );

  draggingPiece =
    null;

}


/* =====================================================
   DROP CHECK
   ===================================================== */

function checkDrop(
  piece,
  pointerX,
  pointerY
){

  const boardRect =
    board.getBoundingClientRect();


  const pieceRect =
    piece.getBoundingClientRect();


  /* Center of the piece */

  const pieceCenterX =
    pieceRect.left +
    pieceRect.width / 2;

  const pieceCenterY =
    pieceRect.top +
    pieceRect.height / 2;


  /*
    Determine nearest puzzle cell
    using the piece CENTER.
  */

  const cellW =
    boardRect.width / GRID;

  const cellH =
    boardRect.height / GRID;


  let col =
    Math.floor(
      (pieceCenterX -
       boardRect.left) /
      cellW
    );

  let row =
    Math.floor(
      (pieceCenterY -
       boardRect.top) /
      cellH
    );


  /*
    If center is exactly on an edge,
    keep it within the board.
  */

  col =
    Math.max(
      0,
      Math.min(
        GRID-1,
        col
      )
    );

  row =
    Math.max(
      0,
      Math.min(
        GRID-1,
        row
      )
    );


  const correctRow =
    Number(piece.dataset.row);

  const correctCol =
    Number(piece.dataset.col);


  /*
    Distance from piece center
    to correct cell center.
  */

  const targetCenterX =
    boardRect.left +
    correctCol * cellW +
    cellW / 2;

  const targetCenterY =
    boardRect.top +
    correctRow * cellH +
    cellH / 2;


  const dx =
    pieceCenterX -
    targetCenterX;

  const dy =
    pieceCenterY -
    targetCenterY;


  const distance =
    Math.sqrt(
      dx*dx +
      dy*dy
    );


  /*
    VERY GENEROUS DROP RANGE.

    User does NOT have to be exact.
  */

  const tolerance =
    Math.min(
      cellW,
      cellH
    ) * 0.95;


  if(
    row === correctRow &&
    col === correctCol &&
    distance <= tolerance
  ){

    lockPiece(
      piece,
      correctRow,
      correctCol
    );

  }else{

    /*
      Also allow an easier
      "near the correct cell" drop.
    */

    if(
      distance <=
      Math.min(cellW,cellH) * 1.05
    ){

      lockPiece(
        piece,
        correctRow,
        correctCol
      );

    }else{

      wrongPlacement(
        piece
      );

    }

  }

}


/* =====================================================
   LOCK CORRECT PIECE
   ===================================================== */

function lockPiece(
  piece,
  row,
  col
){

  const boardRect =
    board.getBoundingClientRect();


  const cellW =
    boardRect.width / GRID;

  const cellH =
    boardRect.height / GRID;


  piece.classList.remove(
    "dragging"
  );

  piece.classList.add(
    "locked"
  );


  piece.style.position =
    "fixed";

  piece.style.width =
    cellW + "px";

  piece.style.height =
    cellH + "px";


  piece.style.left =
    (
      boardRect.left +
      col * cellW
    ) + "px";


  piece.style.top =
    (
      boardRect.top +
      row * cellH
    ) + "px";


  piece.style.zIndex =
    "500";


  lockedCount++;

  moves++;

  updateStats();

  correctSound();

  vibrate(40);


  if(
    lockedCount === GRID * GRID
  ){

    finishGame();

  }

}


/* =====================================================
   WRONG PIECE
   ===================================================== */

function wrongPlacement(piece){

  moves++;

  updateStats();

  wrongSound();

  vibrate(100);


  piece.classList.remove(
    "dragging"
  );

  piece.classList.add(
    "wrong"
  );


  setTimeout(()=>{

    piece.classList.remove(
      "wrong"
    );

    returnPiece(
      piece
    );

  },350);

}


/* =====================================================
   RETURN PIECE TO PIECES AREA
   ===================================================== */

function returnPiece(piece){

  if(
    piece.classList.contains("locked")
  ){

    return;

  }


  /*
    Put the piece back into the
    pieces area.
  */

  piecesArea.appendChild(
    piece
  );


  piece.style.position =
    "relative";

  piece.style.left =
    "";

  piece.style.top =
    "";

  piece.style.width =
    "";

  piece.style.height =
    "";

  piece.style.margin =
    "";

  piece.style.zIndex =
    "10";

  piece.style.transform =
    "";

  piece.classList.remove(
    "dragging"
  );

}


/* =====================================================
   TIMER
   ===================================================== */

function startTimer(){

  if(gameStarted)
    return;

  gameStarted = true;

  timerInterval =
    setInterval(()=>{

      seconds++;

      updateTimer();

      updateScore();

    },1000);

}


function stopTimer(){

  clearInterval(
    timerInterval
  );

  timerInterval =
    null;

}


function updateTimer(){

  const minutes =
    Math.floor(
      seconds / 60
    );

  const secs =
    seconds % 60;


  timerElement.textContent =
    String(minutes).padStart(2,"0")
    + ":" +
    String(secs).padStart(2,"0");

}


/* =====================================================
   SCORE
   ===================================================== */

function calculateScore(){

  /*
    Base score = 100

    - 2 points per move
    - 1 point every 5 seconds
  */

  return Math.max(
    0,
    100 -
    moves * 2 -
    Math.floor(seconds / 5)
  );

}


function updateScore(){

  scoreElement.textContent =
    calculateScore();

}


function updateStats(){

  movesElement.textContent =
    moves;

  updateScore();

}


/* =====================================================
   NEW GAME
   ===================================================== */

function newGame(){

  stopTimer();

  seconds = 0;

  moves = 0;

  lockedCount = 0;

  gameStarted = false;

  draggingPiece = null;

  updateTimer();

  updateStats();

  winScreen.style.display =
    "none";


  drawBoard();

  createPieces();

}


/* =====================================================
   FINISH
   ===================================================== */

function finishGame(){

  stopTimer();

  gameStarted = false;


  const final =
    calculateScore();


  finalScore.textContent =
    "Score: " + final;


  saveBest(
    final,
    seconds
  );


  setTimeout(()=>{

    winScreen.style.display =
      "flex";

    confetti();

  },400);

}


/* =====================================================
   BEST SCORE
   ===================================================== */

function saveBest(
  score,
  time
){

  const oldScore =
    Number(
      localStorage.getItem(
        "completePic_v21_bestScore"
      ) || 0
    );

  const oldTime =
    Number(
      localStorage.getItem(
        "completePic_v21_bestTime"
      ) || 999999
    );


  if(
    score > oldScore
  ){

    localStorage.setItem(
      "completePic_v21_bestScore",
      score
    );

  }


  if(
    time < oldTime
  ){

    localStorage.setItem(
      "completePic_v21_bestTime",
      time
    );

  }

}


/* =====================================================
   CONFETTI
   ===================================================== */

function confetti(){

  const symbols =
    ["🎉","⭐","✨","🐼","💚","🎊"];

  for(
    let i=0;
    i<45;
    i++
  ){

    const c =
      document.createElement("div");

    c.className =
      "confetti";

    c.textContent =
      symbols[
        Math.floor(
          Math.random() *
          symbols.length
        )
      ];


    c.style.left =
      Math.random()*100 +
      "vw";


    c.style.top =
      "-30px";


    c.style.fontSize =
      (
        12 +
        Math.random()*14
      ) + "px";


    c.style.animationDuration =
      (
        1.5 +
        Math.random()*1.5
      ) + "s";


    document.body.appendChild(c);


    setTimeout(()=>{

      c.remove();

    },3500);

  }

}

newGameBtn.addEventListener(

playAgainBtn.addEventListener(

/* =====================================================
   RESIZE
   ===================================================== */

window.addEventListener(
  "resize",
  function(){

    if(!imageReady)
      return;

    drawBoard();

    /*
      Reposition already locked pieces
      if screen orientation changes.
    */

    pieces
      .filter(p =>
        p.classList.contains("locked")
      )
      .forEach(p => {

        const row =
          Number(p.dataset.row);

        const col =
          Number(p.dataset.col);

        const rect =
          board.getBoundingClientRect();

        const cellW =
          rect.width / GRID;

        const cellH =
          rect.height / GRID;

        p.style.width =
          cellW + "px";

        p.style.height =
          cellH + "px";

        p.style.left =
          (
            rect.left +
            col * cellW
          ) + "px";

        p.style.top =
          (
            rect.top +
            row * cellH
          ) + "px";

      });

  }
);


/* =====================================================
   START
   ===================================================== */

if(
  pandaImage.complete &&
  pandaImage.naturalWidth > 0
){

  imageReady = true;

  drawBoard();

  newGame();

}
