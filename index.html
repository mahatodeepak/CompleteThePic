<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
      initial-scale=1.0,
      maximum-scale=1.0,
      user-scalable=no">

<title>Complete the Pic - Panda</title>

<style>

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  padding:0;
  min-height:100%;
  font-family:Arial,Helvetica,sans-serif;
  background:linear-gradient(180deg,#dff6ff,#f5ffe9);
  color:#222;
  overflow-x:hidden;
}

body{
  display:flex;
  justify-content:center;
}

.game{
  width:100%;
  max-width:700px;
  padding:12px;
  text-align:center;
}

h1{
  margin:5px 0 2px;
  font-size:30px;
  font-weight:900;
}

.subtitle{
  color:#555;
  font-size:14px;
  margin-bottom:10px;
}

.stats{
  display:flex;
  justify-content:center;
  gap:7px;
  flex-wrap:wrap;
  margin-bottom:10px;
}

.stat{
  background:#fff;
  padding:7px 12px;
  border-radius:16px;
  box-shadow:0 3px 10px rgba(0,0,0,.12);
  font-size:14px;
  font-weight:bold;
}

/* =========================
   PUZZLE BOARD
========================= */

#board{
  position:relative;
  width:min(92vw,560px);
  aspect-ratio:1/1;
  margin:10px auto 15px;

  border:8px solid #111;
  border-radius:15px;

  overflow:hidden;
  background:#000;

  box-shadow:
    0 8px 22px rgba(0,0,0,.25),
    inset 0 0 0 2px #444;
}

#boardCanvas{
  position:absolute;
  left:0;
  top:0;

  width:100%;
  height:100%;

  display:block;

  /*
    Light guide picture
  */
  opacity:.22;
}

#targetGrid{
  position:absolute;
  inset:0;

  display:grid;
  grid-template-columns:repeat(3,1fr);
  grid-template-rows:repeat(3,1fr);

  pointer-events:none;
}

.target{
  border:1px dashed rgba(0,0,0,.16);
}

/* =========================
   PIECES
========================= */

#piecesArea{
  position:relative;

  width:100%;
  min-height:230px;

  padding:10px;

  border-radius:18px;

  background:rgba(255,255,255,.78);

  box-shadow:
    0 4px 15px rgba(0,0,0,.12);

  touch-action:none;
}

#piecesTitle{
  font-weight:bold;
  color:#444;
  margin-bottom:8px;
}

.piece{
  position:absolute;

  width:100px;
  height:100px;

  border:3px solid #222;
  border-radius:8px;

  background:#fff;

  overflow:hidden;

  box-shadow:
    0 5px 12px rgba(0,0,0,.25);

  touch-action:none;
  user-select:none;
  -webkit-user-select:none;

  cursor:grab;

  z-index:5;
}

.piece canvas{
  width:100%;
  height:100%;
  display:block;

  pointer-events:none;
}

.piece.dragging{
  z-index:100;

  transform:scale(1.06);

  cursor:grabbing;

  box-shadow:
    0 12px 25px rgba(0,0,0,.35);
}

.piece.locked{
  position:fixed;

  border:0;
  border-radius:0;

  box-shadow:none;

  transform:none;

  cursor:default;

  z-index:100;
}

/* =========================
   MESSAGE
========================= */

#message{
  min-height:28px;

  margin:7px 0;

  font-size:17px;
  font-weight:bold;
}

.good{
  color:#149447;
}

.bad{
  color:#d62929;
}

.win{
  color:#7c3aed;
}

/* =========================
   BUTTON
========================= */

button{
  border:0;

  padding:12px 22px;

  border-radius:25px;

  background:#222;
  color:white;

  font-size:16px;
  font-weight:bold;

  box-shadow:
    0 4px 10px rgba(0,0,0,.2);

  cursor:pointer;
}

button:active{
  transform:scale(.96);
}

/* =========================
   SHAKE
========================= */

.shake{
  animation:shake .35s;
}

@keyframes shake{

  0%{
    transform:translateX(0);
  }

  20%{
    transform:translateX(-10px);
  }

  40%{
    transform:translateX(10px);
  }

  60%{
    transform:translateX(-8px);
  }

  80%{
    transform:translateX(8px);
  }

  100%{
    transform:translateX(0);
  }

}

/* =========================
   WIN BOX
========================= */

#winBox{
  display:none;

  position:fixed;
  inset:0;

  background:rgba(0,0,0,.68);

  z-index:500;

  align-items:center;
  justify-content:center;

  padding:20px;
}

.winCard{
  background:white;

  width:min(90vw,400px);

  padding:28px 20px;

  border-radius:25px;

  box-shadow:
    0 15px 45px rgba(0,0,0,.4);

  animation:pop .35s;
}

@keyframes pop{

  from{
    transform:scale(.6);
    opacity:0;
  }

  to{
    transform:scale(1);
    opacity:1;
  }

}

.winCard h2{
  margin:0 0 8px;
  font-size:30px;
}

.winCard p{
  margin:7px;
  font-size:17px;
}

/* =========================
   CONFETTI
========================= */

.confetti{
  position:fixed;

  width:8px;
  height:14px;

  top:-20px;

  z-index:600;

  animation:
    fall 2.8s linear forwards;
}

@keyframes fall{

  to{
    transform:
      translateY(110vh)
      rotate(720deg);
  }

}

/* =========================
   MOBILE
========================= */

@media(max-width:500px){

  h1{
    font-size:25px;
  }

  .subtitle{
    font-size:13px;
  }

  .stat{
    font-size:13px;
    padding:6px 9px;
  }

  #piecesArea{
    min-height:190px;
  }

  .piece{
    width:78px;
    height:78px;
  }

  button{
    padding:11px 20px;
  }

}

</style>
</head>


<body>

<div class="game">

  <h1>🐼 Complete the Pic</h1>

  <div class="subtitle">

  </div>


  <div class="stats">

    <div class="stat">
      ⏱️ Time:
      <span id="timer">0</span>s
    </div>

    <div class="stat">
      🎯 Moves:
      <span id="moves">0</span>
    </div>

    <div class="stat">
      ⭐ Score:
      <span id="score">100</span>
    </div>

    <div class="stat">
      🏆 Best:
      <span id="bestScore">0</span>
    </div>

  </div>


  <div id="message"></div>


  <!-- PUZZLE BOARD -->

  <div id="board">

    <canvas id="boardCanvas"></canvas>

    <div id="targetGrid">

      <div class="target"></div>
      <div class="target"></div>
      <div class="target"></div>

      <div class="target"></div>
      <div class="target"></div>
      <div class="target"></div>

      <div class="target"></div>
      <div class="target"></div>
      <div class="target"></div>

    </div>

  </div>


  <!-- PIECES -->

  <div id="piecesArea">

    <div id="piecesTitle">
      🧩 Drag the pieces into the picture
    </div>

  </div>


  <button onclick="newGame()">
    🔄 New Game
  </button>

</div>


<!-- WIN -->

<div id="winBox">

  <div class="winCard">

    <h2>🎉 Amazing!</h2>

    <p>
      You completed the Panda!
    </p>

    <p>
      ⏱️ Time:
      <b><span id="finalTime">0</span>s</b>
    </p>

    <p>
      🎯 Moves:
      <b><span id="finalMoves">0</span></b>
    </p>

    <p>
      ⭐ Score:
      <b><span id="finalScore">0</span></b>
    </p>

    <p>
      🏆 Best Score:
      <b><span id="finalBest">0</span></b>
    </p>

    <br>

    <button onclick="newGame()">
      🐼 Play Again
    </button>

  </div>

</div>


<script>

/* =====================================================
   COMPLETE THE PIC V2.0
   REAL PANDA IMAGE VERSION
   ===================================================== */

const ROWS = 3;
const COLS = 3;

const board =
  document.getElementById("board");

const boardCanvas =
  document.getElementById("boardCanvas");

const boardCtx =
  boardCanvas.getContext("2d");

const piecesArea =
  document.getElementById("piecesArea");

const timerEl =
  document.getElementById("timer");

const movesEl =
  document.getElementById("moves");

const scoreEl =
  document.getElementById("score");

const bestScoreEl =
  document.getElementById("bestScore");

const messageEl =
  document.getElementById("message");

const winBox =
  document.getElementById("winBox");


/* =====================================================
   PANDA IMAGE
   ===================================================== */

const pandaImage =
  new Image();

pandaImage.src = "panda.png";

let imageLoaded = false;


/* =====================================================
   GAME VARIABLES
   ===================================================== */

let pieces = [];

let moves = 0;
let seconds = 0;

let timer = null;

let gameStarted = false;
let gameFinished = false;

let bestScore =
  Number(
    localStorage.getItem(
      "completePic_v20_bestScore"
    ) || 0
  );

let bestTime =
  Number(
    localStorage.getItem(
      "completePic_v20_bestTime"
    ) || 0
  );

bestScoreEl.textContent =
  bestScore;


/* =====================================================
   AUDIO
   ===================================================== */

let audioCtx = null;


function sound(
  frequency,
  duration,
  type="sine"
){

  try{

    if(!audioCtx){

      audioCtx =
        new (
          window.AudioContext ||
          window.webkitAudioContext
        )();

    }

    const osc =
      audioCtx.createOscillator();

    const gain =
      audioCtx.createGain();


    osc.type = type;

    osc.frequency.value =
      frequency;


    gain.gain.setValueAtTime(
      0.0001,
      audioCtx.currentTime
    );

    gain.gain.exponentialRampToValueAtTime(
      0.15,
      audioCtx.currentTime + .02
    );

    gain.gain.exponentialRampToValueAtTime(
      0.0001,
      audioCtx.currentTime + duration
    );


    osc.connect(gain);

    gain.connect(
      audioCtx.destination
    );


    osc.start();

    osc.stop(
      audioCtx.currentTime + duration
    );

  }catch(e){}

}


function correctSound(){

  sound(650,.12);

  setTimeout(
    ()=>sound(900,.16),
    100
  );

}


function wrongSound(){

  sound(180,.18,"square");

}


/* =====================================================
   IMAGE LOAD
   ===================================================== */

pandaImage.onload = function(){

  imageLoaded = true;

  resizeBoardCanvas();

  createPieces();

};


pandaImage.onerror = function(){

  showMessage(
    "❌ panda.png was not found.",
    "bad"
  );

};


/* =====================================================
   DRAW LIGHT GUIDE
   ===================================================== */

function resizeBoardCanvas(){

  if(!imageLoaded)
    return;


  const rect =
    boardCanvas.getBoundingClientRect();

  const dpr =
    window.devicePixelRatio || 1;


  boardCanvas.width =
    Math.round(
      rect.width*dpr
    );

  boardCanvas.height =
    Math.round(
      rect.height*dpr
    );


  boardCtx.setTransform(
    dpr,
    0,
    0,
    dpr,
    0,
    0
  );


  boardCtx.clearRect(
    0,
    0,
    rect.width,
    rect.height
  );


  /*
    Draw the complete Panda
    as a LIGHT guide.
  */

  boardCtx.globalAlpha = .23;


  boardCtx.drawImage(
    pandaImage,
    0,
    0,
    rect.width,
    rect.height
  );


  boardCtx.globalAlpha = 1;

}


/* =====================================================
   CREATE ONE PUZZLE PIECE
   ===================================================== */

function createPieceCanvas(
  row,
  col
){

  const canvas =
    document.createElement("canvas");

  canvas.width = 300;
  canvas.height = 300;


  const ctx =
    canvas.getContext("2d");


  const sw =
    pandaImage.naturalWidth /
    COLS;

  const sh =
    pandaImage.naturalHeight /
    ROWS;


  ctx.drawImage(

    pandaImage,

    col * sw,
    row * sh,

    sw,
    sh,

    0,
    0,

    300,
    300

  );


  return canvas;

}


/* =====================================================
   CREATE PIECES
   ===================================================== */

function createPieces(){

  if(!imageLoaded)
    return;


  document
    .querySelectorAll(".piece")
    .forEach(
      p=>p.remove()
    );


  pieces=[];


  const areaRect =
    piecesArea.getBoundingClientRect();


  const pieceSize =
    window.innerWidth <= 500
      ? 78
      : 100;


  const maxX =
    Math.max(
      5,
      areaRect.width -
      pieceSize -
      10
    );


  const maxY =
    Math.max(
      60,
      areaRect.height -
      pieceSize -
      10
    );


  let positions=[];


  for(let i=0;i<9;i++){

    let x;
    let y;

    let tries=0;


    do{

      x =
        5 +
        Math.random()*maxX;


      y =
        42 +
        Math.random()*
        Math.max(
          10,
          maxY-42
        );


      tries++;


    }while(

      positions.some(
        p =>
          Math.abs(p.x-x) <
            pieceSize*.72
          &&
          Math.abs(p.y-y) <
            pieceSize*.72
      )

      &&
      tries<100

    );


    positions.push({
      x:x,
      y:y
    });


    const row =
      Math.floor(i/3);

    const col =
      i%3;


    const piece =
      document.createElement(
        "div"
      );


    piece.className =
      "piece";


    piece.dataset.row =
      row;

    piece.dataset.col =
      col;

    piece.dataset.index =
      i;


    piece.style.left =
      x+"px";

    piece.style.top =
      y+"px";


    const pieceCanvas =
      createPieceCanvas(
        row,
        col
      );


    piece.appendChild(
      pieceCanvas
    );


    piecesArea.appendChild(
      piece
    );


    setupDrag(piece);


    pieces.push(piece);

  }

}


/* =====================================================
   DRAG SYSTEM
   ===================================================== */

function setupDrag(piece){

  let dragging=false;

  let offsetX=0;
  let offsetY=0;


  piece.addEventListener(
    "pointerdown",
    function(e){

      if(
        piece.classList.contains(
          "locked"
        )
      )
        return;


      e.preventDefault();


      dragging=true;


      piece.classList.add(
        "dragging"
      );


      piece.setPointerCapture(
        e.pointerId
      );


      const rect =
        piece.getBoundingClientRect();


      offsetX =
        e.clientX -
        rect.left;

      offsetY =
        e.clientY -
        rect.top;


      if(!gameStarted){

        startTimer();

      }

    },
    {passive:false}
  );


  piece.addEventListener(
    "pointermove",
    function(e){

      if(!dragging)
        return;


      e.preventDefault();


      const areaRect =
        piecesArea.getBoundingClientRect();


      let left =
        e.clientX -
        areaRect.left -
        offsetX;


      let top =
        e.clientY -
        areaRect.top -
        offsetY;


      const maxLeft =
        areaRect.width -
        piece.offsetWidth;


      const maxTop =
        areaRect.height -
        piece.offsetHeight;


      left =
        Math.max(
          -piece.offsetWidth*.25,
          Math.min(
            left,
            maxLeft+
            piece.offsetWidth*.25
          )
        );


      top =
        Math.max(
          -piece.offsetHeight*.25,
          Math.min(
            top,
            maxTop+
            piece.offsetHeight*.25
          )
        );


      piece.style.left =
        left+"px";

      piece.style.top =
        top+"px";

    },
    {passive:false}
  );


  piece.addEventListener(
    "pointerup",
    function(e){

      if(!dragging)
        return;


      e.preventDefault();


      dragging=false;


      piece.classList.remove(
        "dragging"
      );


      moves++;

      movesEl.textContent =
        moves;


      checkDrop(piece);

    },
    {passive:false}
  );


  piece.addEventListener(
    "pointercancel",
    function(){

      dragging=false;

      piece.classList.remove(
        "dragging"
      );

    }
  );

}


/* =====================================================
   CHECK POSITION
   ===================================================== */

function checkDrop(piece){

  /*
    Use the actual canvas rectangle.
    This gives accurate alignment
    even with the black frame.
  */

  const boardRect =
    boardCanvas.getBoundingClientRect();


  const pieceRect =
    piece.getBoundingClientRect();


  const centerX =
    pieceRect.left +
    pieceRect.width/2;


  const centerY =
    pieceRect.top +
    pieceRect.height/2;


  const cellW =
    boardRect.width /
    COLS;


  const cellH =
    boardRect.height /
    ROWS;


  let col =
    Math.floor(
      (
        centerX -
        boardRect.left
      ) / cellW
    );


  let row =
    Math.floor(
      (
        centerY -
        boardRect.top
      ) / cellH
    );


  if(
    row<0 ||
    row>=ROWS ||
    col<0 ||
    col>=COLS
  ){

    wrongPlacement(piece);

    return;

  }


  const correctRow =
    Number(
      piece.dataset.row
    );


  const correctCol =
    Number(
      piece.dataset.col
    );


  const targetCenterX =
    boardRect.left +
    (correctCol+.5) *
    cellW;


  const targetCenterY =
    boardRect.top +
    (correctRow+.5) *
    cellH;


  const distance =
    Math.hypot(
      centerX-targetCenterX,
      centerY-targetCenterY
    );


  const tolerance =
    Math.min(
      cellW,
      cellH
    )*.62;


  if(

    row===correctRow &&

    col===correctCol &&

    distance<=tolerance

  ){

    lockPiece(
      piece,
      correctRow,
      correctCol
    );

  }else{

    wrongPlacement(piece);

  }

}


/* =====================================================
   LOCK PIECE
   ===================================================== */

function lockPiece(
  piece,
  row,
  col
){

  const boardRect =
    boardCanvas.getBoundingClientRect();


  const cellW =
    boardRect.width /
    COLS;


  const cellH =
    boardRect.height /
    ROWS;


  /*
    Move the piece to body so
    fixed positioning is accurate.
  */

  document.body.appendChild(
    piece
  );


  piece.classList.add(
    "locked"
  );


  piece.style.position =
    "fixed";


  piece.style.left =
    (
      boardRect.left +
      col*cellW
    )+"px";


  piece.style.top =
    (
      boardRect.top +
      row*cellH
    )+"px";


  piece.style.width =
    cellW+"px";


  piece.style.height =
    cellH+"px";


  piece.style.zIndex =
    "100";


  correctSound();


  if(navigator.vibrate){

    navigator.vibrate(45);

  }


  showMessage(
    "🎉 Great! Correct piece!",
    "good"
  );


  checkWin();

}


/* =====================================================
   WRONG PIECE
   ===================================================== */

function wrongPlacement(piece){

  wrongSound();


  piece.classList.add(
    "shake"
  );


  showMessage(
    "❌ Wrong position. Try again!",
    "bad"
  );


  if(navigator.vibrate){

    navigator.vibrate([
      40,
      30,
      40
    ]);

  }


  setTimeout(
    ()=>{

      piece.classList.remove(
        "shake"
      );

      returnPiece(piece);

    },
    400
  );

}


/* =====================================================
   RETURN PIECE
   ===================================================== */

function returnPiece(piece){

  /*
    Return it to the pieces area.
  */

  piecesArea.appendChild(
    piece
  );


  piece.classList.remove(
    "locked"
  );


  const areaRect =
    piecesArea.getBoundingClientRect();


  const pieceSize =
    window.innerWidth<=500
      ? 78
      : 100;


  const maxX =
    Math.max(
      5,
      areaRect.width -
      pieceSize -
      10
    );


  const maxY =
    Math.max(
      60,
      areaRect.height -
      pieceSize -
      10
    );


  const left =
    5 +
    Math.random()*maxX;


  const top =
    42 +
    Math.random()*
    Math.max(
      10,
      maxY-42
    );


  piece.style.position =
    "absolute";


  piece.style.left =
    left+"px";


  piece.style.top =
    top+"px";


  piece.style.width =
    pieceSize+"px";


  piece.style.height =
    pieceSize+"px";


  piece.style.zIndex =
    "5";

}


/* =====================================================
   TIMER
   ===================================================== */

function startTimer(){

  if(
    gameStarted ||
    gameFinished
  )
    return;


  gameStarted=true;


  timer =
    setInterval(
      ()=>{

        seconds++;


        timerEl.textContent =
          seconds;


        updateScore();

      },
      1000
    );

}


function stopTimer(){

  if(timer){

    clearInterval(timer);

    timer=null;

  }

}


/* =====================================================
   SCORE
   ===================================================== */

function updateScore(){

  const score =
    Math.max(
      0,
      100 -
      moves*2 -
      Math.floor(seconds/5)
    );


  scoreEl.textContent =
    score;


  return score;

}


/* =====================================================
   MESSAGE
   ===================================================== */

function showMessage(
  text,
  type
){

  messageEl.textContent =
    text;

  messageEl.className =
    type;

}


/* =====================================================
   WIN
   ===================================================== */

function checkWin(){

  const locked =
    document.querySelectorAll(
      ".piece.locked"
    ).length;


  if(locked!==9)
    return;


  gameFinished=true;

  stopTimer();


  const finalScore =
    updateScore();


  if(
    finalScore >
    bestScore
  ){

    bestScore =
      finalScore;


    localStorage.setItem(
      "completePic_v20_bestScore",
      bestScore
    );

  }


  if(
    bestTime===0 ||
    seconds<bestTime
  ){

    bestTime =
      seconds;


    localStorage.setItem(
      "completePic_v20_bestTime",
      bestTime
    );

  }


  bestScoreEl.textContent =
    bestScore;


  document.getElementById(
    "finalTime"
  ).textContent =
    seconds;


  document.getElementById(
    "finalMoves"
  ).textContent =
    moves;


  document.getElementById(
    "finalScore"
  ).textContent =
    finalScore;


  document.getElementById(
    "finalBest"
  ).textContent =
    bestScore;


  showMessage(
    "🏆 Picture Complete!",
    "win"
  );


  winBox.style.display =
    "flex";


  correctSound();


  setTimeout(
    ()=>sound(1100,.25),
    180
  );


  setTimeout(
    ()=>sound(1400,.3),
    350
  );


  createConfetti();

}


/* =====================================================
   CONFETTI
   ===================================================== */

function createConfetti(){

  for(
    let i=0;
    i<80;
    i++
  ){

    const c =
      document.createElement(
        "div"
      );


    c.className =
      "confetti";


    c.style.left =
      Math.random()*100+
      "vw";


    c.style.animationDelay =
      Math.random()*1.2+
      "s";


    c.style.background =
      [
        "#ff4d6d",
        "#ffd166",
        "#06d6a0",
        "#118ab2",
        "#8338ec",
        "#ff9f1c"
      ][
        Math.floor(
          Math.random()*6
        )
      ];


    document.body.appendChild(
      c
    );


    setTimeout(
      ()=>c.remove(),
      4000
    );

  }

}


/* =====================================================
   NEW GAME
   ===================================================== */

function newGame(){

  stopTimer();


  gameStarted=false;
  gameFinished=false;


  seconds=0;
  moves=0;


  timerEl.textContent="0";
  movesEl.textContent="0";
  scoreEl.textContent="100";


  messageEl.textContent="";
  messageEl.className="";


  winBox.style.display =
    "none";


  /*
    Remove pieces that were
    locked on the board.
  */

  document
    .querySelectorAll(
      ".piece.locked"
    )
    .forEach(
      p=>p.remove()
    );


  if(imageLoaded){

    resizeBoardCanvas();

    createPieces();

  }

}


/* =====================================================
   RESIZE
   ===================================================== */

window.addEventListener(
  "resize",
  function(){

    if(imageLoaded){

      resizeBoardCanvas();

    }

  }
);


/* =====================================================
   START
   ===================================================== */

if(pandaImage.complete){

  if(
    pandaImage.naturalWidth>0
  ){

    imageLoaded=true;

    resizeBoardCanvas();

    createPieces();

  }

}

</script>

</html>
