<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1.0,user-scalable=no">

<title>Complete the Pic - Panda Puzzle</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  text-align:center;
  background:linear-gradient(135deg,#dff7ff,#fff1cc);
  color:#222;
  overflow-x:hidden;
}

h1{
  margin:12px 0 2px;
  font-size:30px;
}

.subtitle{
  color:#555;
  margin-bottom:10px;
}

.info{
  display:flex;
  justify-content:center;
  gap:25px;
  font-weight:bold;
  margin-bottom:10px;
}

#game{
  width:100%;
  max-width:560px;
  margin:auto;
  padding:8px;
}

/* =========================
   PUZZLE FRAME
========================= */

#board{
  position:relative;
  width:min(92vw,450px);
  height:min(92vw,450px);
  margin:auto;
  background:#fff;
  border:9px solid #000;
  overflow:hidden;
  box-shadow:0 6px 18px rgba(0,0,0,.28);
}

/* Panda background */
#panda{
  position:absolute;
  inset:0;
  background:
    linear-gradient(#bcecff 0 58%,#8bd36d 58%);
}

/* Panda ears */
.ear{
  position:absolute;
  width:17%;
  height:17%;
  background:#111;
  border-radius:50%;
  top:18%;
}

.ear.left{left:27%}
.ear.right{right:27%}

/* Head */
.head{
  position:absolute;
  width:48%;
  height:43%;
  left:26%;
  top:20%;
  background:white;
  border:5px solid #111;
  border-radius:48%;
}

/* Eye patches */
.eyePatch{
  position:absolute;
  width:20%;
  height:30%;
  background:#111;
  border-radius:50%;
  top:30%;
}

.eyePatch.left{
  left:20%;
  transform:rotate(25deg);
}

.eyePatch.right{
  right:20%;
  transform:rotate(-25deg);
}

.eye{
  position:absolute;
  width:34%;
  height:34%;
  background:white;
  border-radius:50%;
  left:33%;
  top:18%;
}

.pupil{
  position:absolute;
  width:48%;
  height:48%;
  background:#111;
  border-radius:50%;
  left:26%;
  top:26%;
}

/* Nose */
.nose{
  position:absolute;
  width:13%;
  height:9%;
  background:#111;
  border-radius:50%;
  left:43.5%;
  top:61%;
}

/* Mouth */
.mouth{
  position:absolute;
  width:20%;
  height:13%;
  left:40%;
  top:68%;
  border-bottom:4px solid #111;
  border-radius:50%;
}

/* Body */
.body{
  position:absolute;
  width:39%;
  height:39%;
  left:30.5%;
  top:57%;
  background:#111;
  border-radius:45% 45% 35% 35%;
}

.belly{
  position:absolute;
  width:58%;
  height:58%;
  left:21%;
  top:22%;
  background:white;
  border-radius:50%;
}

/* Arms */
.arm{
  position:absolute;
  width:22%;
  height:38%;
  top:59%;
  background:#111;
  border-radius:50%;
}

.arm.left{
  left:18%;
  transform:rotate(35deg);
}

.arm.right{
  right:18%;
  transform:rotate(-35deg);
}


/* =========================
   JIGSAW PIECES AREA
========================= */

#message{
  min-height:30px;
  margin:8px;
  font-size:17px;
  font-weight:bold;
}

#piecesArea{
  width:min(96vw,520px);
  margin:10px auto;
  padding:12px;
  background:rgba(255,255,255,.8);
  border:3px dashed #555;
  border-radius:15px;
}

#piecesTitle{
  font-weight:bold;
  margin-bottom:10px;
}

#pieces{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  justify-items:center;
}

/* =========================
   JIGSAW PIECE
========================= */

.piece{
  position:relative;
  width:min(28vw,135px);
  height:min(28vw,135px);
  cursor:grab;
  touch-action:none;
  user-select:none;
  z-index:10;
  filter:drop-shadow(0 3px 4px rgba(0,0,0,.25));
}

.piece:active{
  cursor:grabbing;
  transform:scale(1.05);
  z-index:100;
}

.pieceCanvas{
  position:absolute;
  width:100%;
  height:100%;
}


/* =========================
   BUTTON
========================= */

button{
  border:none;
  border-radius:12px;
  padding:12px 24px;
  margin:6px;
  background:#222;
  color:white;
  font-size:16px;
  font-weight:bold;
}

button:active{
  transform:scale(.95);
}


/* =========================
   WIN
========================= */

.win{
  color:#0b942d;
  font-size:23px!important;
}

@keyframes celebrate{
  0%{transform:scale(1)}
  50%{transform:scale(1.08) rotate(2deg)}
  100%{transform:scale(1)}
}

.celebrate{
  animation:celebrate .6s infinite;
}


/* =========================
   WRONG PIECE
========================= */

@keyframes shake{
  0%{transform:translateX(0)}
  25%{transform:translateX(-8px)}
  50%{transform:translateX(8px)}
  75%{transform:translateX(-8px)}
  100%{transform:translateX(0)}
}

.shake{
  animation:shake .3s;
}


/* Mobile */
@media(max-width:420px){

  h1{
    font-size:25px;
  }

  .info{
    gap:15px;
    font-size:14px;
  }
}
</style>
</head>

<body>

<h1>🐼 Complete the Pic</h1>

<div class="subtitle">
Pick the pieces. Complete the picture!
</div>

<div class="info">
  <div>⏱️ <span id="timer">0</span>s</div>
  <div>🎯 Moves: <span id="moves">0</span></div>
  <div>🏆 <span id="score">100</span></div>
</div>

<div id="game">

  <!-- =====================
       BLACK FRAME
  ====================== -->

  <div id="board">

    <div id="panda">

      <div class="ear left"></div>
      <div class="ear right"></div>

      <div class="head">

        <div class="eyePatch left">
          <div class="eye">
            <div class="pupil"></div>
          </div>
        </div>

        <div class="eyePatch right">
          <div class="eye">
            <div class="pupil"></div>
          </div>
        </div>

        <div class="nose"></div>
        <div class="mouth"></div>

      </div>

      <div class="body">
        <div class="belly"></div>
      </div>

      <div class="arm left"></div>
      <div class="arm right"></div>

    </div>

  </div>


  <div id="message">
    Drag a puzzle piece into the black frame.
  </div>


  <!-- =====================
       PIECES
  ====================== -->

  <div id="piecesArea">

    <div id="piecesTitle">
      🧩 Puzzle Pieces
    </div>

    <div id="pieces"></div>

  </div>


  <button onclick="newGame()">
    🔄 New Game
  </button>

</div>


<script>

/* ==================================================
   COMPLETE THE PIC V1.2
   ================================================== */

const board =
document.getElementById("board");

const piecesContainer =
document.getElementById("pieces");

const message =
document.getElementById("message");

const timerText =
document.getElementById("timer");

const movesText =
document.getElementById("moves");

const scoreText =
document.getElementById("score");


let moves=0;
let seconds=0;
let completed=0;
let timer=null;
let started=false;


/* ==================================================
   SIMPLE SOUND SYSTEM
================================================== */

let audioContext=null;

function sound(type){

  try{

    if(!audioContext){
      audioContext=
        new (window.AudioContext ||
        window.webkitAudioContext)();
    }

    const oscillator=
      audioContext.createOscillator();

    const gain=
      audioContext.createGain();

    oscillator.connect(gain);
    gain.connect(audioContext.destination);

    if(type==="correct"){
      oscillator.frequency.value=700;
    }

    if(type==="wrong"){
      oscillator.frequency.value=180;
    }

    if(type==="win"){
      oscillator.frequency.value=900;
    }

    gain.gain.setValueAtTime(
      .08,
      audioContext.currentTime
    );

    gain.gain.exponentialRampToValueAtTime(
      .001,
      audioContext.currentTime+.25
    );

    oscillator.start();

    oscillator.stop(
      audioContext.currentTime+.25
    );

  }catch(e){}
}


/* ==================================================
   CREATE SVG JIGSAW PIECE
================================================== */

function createPieceSVG(index){

  const svg=
  document.createElementNS(
    "http://www.w3.org/2000/svg",
    "svg"
  );

  svg.setAttribute("viewBox","0 0 100 100");
  svg.classList.add("pieceCanvas");

  /*
    Different edge shapes make the pieces
    look like jigsaw pieces.
  */

  let top =
    index<3
    ? "M0 0 H100 V18 C82 8 78 35 62 23 C45 10 55 0 38 0 Z"
    : "M0 0 H38 C55 0 45 10 62 23 C78 35 82 8 100 18 V0 Z";

  let path="";

  /*
    Main jigsaw outline.
    Each piece remains square visually but
    has curved tabs/holes.
  */

  const paths=[

`M5 5 H95 V32
 C82 18 72 35 60 25
 C48 15 40 38 30 30
 C20 22 17 35 5 32 Z`,

`M5 5 H32
 C18 18 35 28 25 40
 C15 52 38 58 30 70
 C22 82 35 88 5 95 Z`,

`M95 5 V32
 C82 18 72 35 60 25
 C48 15 40 38 30 30
 C20 22 17 35 5 32 V5 Z`

  ];

  /*
    Use SVG clip path so the panda artwork
    appears inside a jigsaw shape.
  */

  const clipId="clip"+index;

  const defs=
    document.createElementNS(
      "http://www.w3.org/2000/svg",
      "defs"
    );

  const clip=
    document.createElementNS(
      "http://www.w3.org/2000/svg",
      "clipPath"
    );

  clip.setAttribute("id",clipId);

  const shape=
    document.createElementNS(
      "http://www.w3.org/2000/svg",
      "path"
    );

  /*
    Slightly different tabs depending
    on the piece position.
  */

  let d=
`M5 5
H35
C25 20 48 20 45 35
C42 48 60 45 65 35
C70 25 88 28 95 18
V95
H70
C80 82 58 78 60 65
C62 52 42 55 40 68
C38 80 20 75 5 85
Z`;

  shape.setAttribute("d",d);

  clip.appendChild(shape);
  defs.appendChild(clip);
  svg.appendChild(defs);

  /*
    Panda miniature
  */

  const background=
    document.createElementNS(
      "http://www.w3.org/2000/svg",
      "rect"
    );

  background.setAttribute("x","0");
  background.setAttribute("y","0");
  background.setAttribute("width","100");
  background.setAttribute("height","100");
  background.setAttribute(
    "fill","#bcecff"
  );

  background.setAttribute(
    "clip-path",
    `url(#${clipId})`
  );

  svg.appendChild(background);


  /*
    Green ground
  */

  const ground=
    document.createElementNS(
      "http://www.w3.org/2000/svg",
      "rect"
    );

  ground.setAttribute("x","0");
  ground.setAttribute("y","58");
  ground.setAttribute("width","100");
  ground.setAttribute("height","42");
  ground.setAttribute(
    "fill","#8bd36d"
  );

  ground.setAttribute(
    "clip-path",
    `url(#${clipId})`
  );

  svg.appendChild(ground);


  /*
    Panda head
  */

  const head=
    document.createElementNS(
      "http://www.w3.org/2000/svg",
      "ellipse"
    );

  head.setAttribute("cx","50");
  head.setAttribute("cy","38");
  head.setAttribute("rx","24");
  head.setAttribute("ry","21");
  head.setAttribute("fill","white");
  head.setAttribute("stroke","#111");
  head.setAttribute("stroke-width","2");

  svg.appendChild(head);


  /*
    Ears
  */

  function circle(cx,cy,r,fill){

    const c=
      document.createElementNS(
        "http://www.w3.org/2000/svg",
        "circle"
      );

    c.setAttribute("cx",cx);
    c.setAttribute("cy",cy);
    c.setAttribute("r",r);
    c.setAttribute("fill",fill);

    svg.appendChild(c);
  }

  circle(31,22,9,"#111");
  circle(69,22,9,"#111");


  /*
    Eyes
  */

  circle(41,36,5,"#111");
  circle(59,36,5,"#111");

  circle(40,34,1.7,"white");
  circle(58,34,1.7,"white");


  /*
    Nose
  */

  const nose=
    document.createElementNS(
      "http://www.w3.org/2000/svg",
      "ellipse"
    );

  nose.setAttribute("cx","50");
  nose.setAttribute("cy","47");
  nose.setAttribute("rx","5");
  nose.setAttribute("ry","3.5");
  nose.setAttribute("fill","#111");

  svg.appendChild(nose);


  /*
    Body
  */

  const body=
    document.createElementNS(
      "http://www.w3.org/2000/svg",
      "ellipse"
    );

  body.setAttribute("cx","50");
  body.setAttribute("cy","76");
  body.setAttribute("rx","20");
  body.setAttribute("ry","20");
  body.setAttribute("fill","#111");

  svg.appendChild(body);


  /*
    Belly
  */

  const belly=
    document.createElementNS(
      "http://www.w3.org/2000/svg",
      "ellipse"
    );

  belly.setAttribute("cx","50");
  belly.setAttribute("cy","78");
  belly.setAttribute("rx","11");
  belly.setAttribute("ry","13");
  belly.setAttribute("fill","white");

  svg.appendChild(belly);


  /*
    Border
  */

  const outline=
    document.createElementNS(
      "http://www.w3.org/2000/svg",
      "path"
    );

  outline.setAttribute("d",d);
  outline.setAttribute(
    "fill","none"
  );
  outline.setAttribute(
    "stroke","#111"
  );
  outline.setAttribute(
    "stroke-width","2"
  );

  svg.appendChild(outline);

  return svg;
}


/* ==================================================
   CREATE PIECES
================================================== */

function createPieces(){

  piecesContainer.innerHTML="";

  let order=[
    0,1,2,
    3,4,5,
    6,7,8
  ];

  /*
    Shuffle
  */

  for(let i=order.length-1;i>0;i--){

    let j=
      Math.floor(
        Math.random()*(i+1)
      );

    [
      order[i],
      order[j]
    ]=[
      order[j],
      order[i]
    ];
  }


  order.forEach(correctPosition=>{

    const piece=
      document.createElement("div");

    piece.className="piece";

    piece.dataset.correct=
      correctPosition;

    piece.appendChild(
      createPieceSVG(
        correctPosition
      )
    );

    addDrag(piece);

    piecesContainer.appendChild(piece);

  });
}


/* ==================================================
   DRAG SYSTEM
================================================== */

function addDrag(piece){

  let dragging=false;

  let startX=0;
  let startY=0;

  piece.addEventListener(
    "pointerdown",
    e=>{

      if(
        piece.dataset.locked==="true"
      ) return;

      e.preventDefault();

      dragging=true;

      startX=e.clientX;
      startY=e.clientY;

      piece.setPointerCapture(
        e.pointerId
      );

      piece.style.zIndex=200;

      if(!started){

        started=true;

        startTimer();

      }

      sound("click");

    }
  );


  piece.addEventListener(
    "pointermove",
    e=>{

      if(!dragging)return;

      let dx=
        e.clientX-startX;

      let dy=
        e.clientY-startY;

      piece.style.transform=
        `translate(${dx}px,${dy}px)
         scale(1.08)`;

    }
  );


  piece.addEventListener(
    "pointerup",
    e=>{

      if(!dragging)return;

      dragging=false;

      piece.style.transform="";

      piece.style.zIndex=10;

      moves++;

      movesText.textContent=moves;

      checkPosition(piece);

    }
  );
}


/* ==================================================
   CHECK POSITION
================================================== */

function checkPosition(piece){

  const boardRect=
    board.getBoundingClientRect();

  const pieceRect=
    piece.getBoundingClientRect();

  const centerX=
    pieceRect.left+
    pieceRect.width/2;

  const centerY=
    pieceRect.top+
    pieceRect.height/2;

  const x=
    centerX-boardRect.left;

  const y=
    centerY-boardRect.top;

  const cellW=
    boardRect.width/3;

  const cellH=
    boardRect.height/3;

  const col=
    Math.floor(x/cellW);

  const row=
    Math.floor(y/cellH);

  if(
    col<0 ||
    col>2 ||
    row<0 ||
    row>2
  ){

    wrong(piece);
    return;
  }

  const target=
    row*3+col;

  const correct=
    Number(piece.dataset.correct);

  if(target===correct){

    placePiece(
      piece,
      target
    );

  }else{

    wrong(piece);

  }
}


/* ==================================================
   PLACE CORRECT PIECE
================================================== */

function placePiece(piece,target){

  const boardRect=
    board.getBoundingClientRect();

  /*
    Move piece to board.
  */

  piece.dataset.locked="true";

  piece.style.position="absolute";

  piece.style.width=
    (100/3)+"%";

  piece.style.height=
    (100/3)+"%";

  piece.style.left=
    ((target%3)*100/3)+"%";

  piece.style.top=
    (Math.floor(target/3)*100/3)+"%";

  piece.style.margin="0";

  piece.style.transform="";

  piece.style.zIndex=5;

  piece.style.cursor="default";

  board.appendChild(piece);

  completed++;

  sound("correct");

  message.textContent=
    "✅ Correct!";

  /*
    Update score.
  */

  let score=
    Math.max(
      10,
      100-
      moves*2-
      Math.floor(seconds/5)
    );

  scoreText.textContent=score;

  /*
    Finished?
  */

  if(completed===9){

    finishGame();

  }

}


/* ==================================================
   WRONG
================================================== */

function wrong(piece){

  piece.classList.remove("shake");

  void piece.offsetWidth;

  piece.classList.add("shake");

  sound("wrong");

  message.textContent=
    "❌ Wrong place — try again!";

}


/* ==================================================
   TIMER
================================================== */

function startTimer(){

  if(timer)return;

  timer=
    setInterval(()=>{

      seconds++;

      timerText.textContent=
        seconds;

      /*
        Slowly reduce score.
      */

      let score=
        Math.max(
          10,
          100-
          moves*2-
          Math.floor(seconds/5)
        );

      scoreText.textContent=
        score;

    },1000);
}


/* ==================================================
   WIN
================================================== */

function finishGame(){

  clearInterval(timer);

  timer=null;

  started=false;

  let finalScore=
    Math.max(
      10,
      100-
      moves*2-
      Math.floor(seconds/5)
    );

  scoreText.textContent=
    finalScore;

  message.innerHTML=
    `🎉 AMAZING!<br>
     🐼 Picture Complete!<br>
     <span style="font-size:16px">
     Time: ${seconds}s |
     Moves: ${moves} |
     Score: ${finalScore}
     </span>`;

  message.classList.add("win");

  board.classList.add("celebrate");

  sound("win");

}


/* ==================================================
   NEW GAME
================================================== */

function newGame(){

  clearInterval(timer);

  timer=null;

  moves=0;
  seconds=0;
  completed=0;
  started=false;

  timerText.textContent="0";
  movesText.textContent="0";
  scoreText.textContent="100";

  message.className="";
  message.textContent=
    "Drag a puzzle piece into the black frame.";

  board.classList.remove(
    "celebrate"
  );

  /*
    Remove pieces currently
    inside the board.
  */

  document
    .querySelectorAll(
      "#board .piece"
    )
    .forEach(p=>p.remove());

  createPieces();

}


/* ==================================================
   START
================================================== */

createPieces();

</script>

</body>
</html>
