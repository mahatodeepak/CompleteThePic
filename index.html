<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, user-scalable=no">

<title>Complete the Pic - V2.4</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  padding:0;
  width:100%;
  min-height:100%;
  font-family:Arial,sans-serif;
  background:#f7f7f7;
  color:#222;
  overflow-x:hidden;
}

body{
  padding-bottom:35px;
}

header{
  text-align:center;
  padding:16px 10px 8px;
}

h1{
  margin:0;
  font-size:28px;
}

.subtitle{
  margin-top:5px;
  color:#666;
  font-size:14px;
}

.stats{
  display:flex;
  justify-content:center;
  flex-wrap:wrap;
  gap:8px;
  margin:12px auto;
}

.stat{
  min-width:78px;
  background:#fff;
  border:1px solid #ddd;
  border-radius:12px;
  padding:8px 10px;
  box-shadow:0 2px 7px rgba(0,0,0,.06);
}

.stat b{
  display:block;
  font-size:18px;
}

.stat span{
  font-size:11px;
  color:#777;
}

#gameArea{
  width:min(94vw,520px);
  margin:auto;
}

/* ================= FRAME ================= */

#frame{
  position:relative;
  width:100%;
  aspect-ratio:1/1;
  background:#fff;
  border:3px solid #777;
  border-radius:14px;
  overflow:visible;
  box-shadow:0 3px 12px rgba(0,0,0,.08);
}

#boardCanvas{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  display:block;
  border-radius:10px;
  z-index:1;
}

/*
   Correct pieces are placed INSIDE this frame.
   Therefore they scroll together with the frame.
*/

#lockedPieces{
  position:absolute;
  inset:0;
  z-index:5;
  pointer-events:none;
}

/* ================= PIECES ================= */

#piecesTitle{
  text-align:center;
  margin:20px 0 8px;
  font-weight:bold;
}

#piecesArea{
  min-height:250px;
  padding:12px;
  display:flex;
  justify-content:center;
  align-items:center;
  flex-wrap:wrap;
  gap:8px;
  background:#fff;
  border:1px solid #ddd;
  border-radius:16px;
  box-shadow:0 2px 8px rgba(0,0,0,.05);
}

.piece{
  width:96px;
  height:96px;
  position:relative;
  touch-action:none;
  user-select:none;
  cursor:grab;
  z-index:20;
}

.piece svg{
  width:100%;
  height:100%;
  display:block;
  overflow:visible;
  touch-action:none;
  user-select:none;
}

.piece.dragging{
  position:fixed;
  z-index:9999;
  cursor:grabbing;
  filter:drop-shadow(0 7px 12px rgba(0,0,0,.25));
}

.piece.locked{
  position:absolute;
  cursor:default;
  pointer-events:none;
  z-index:10;
}

.shake{
  animation:shake .35s ease;
}

@keyframes shake{
  0%,100%{
    transform:translateX(0);
  }
  20%{
    transform:translateX(-10px);
  }
  40%{
    transform:translateX(10px);
  }
  60%{
    transform:translateX(-8px);
  }
  80%{
    transform:translateX(8px);
  }
}

/* ================= BUTTONS ================= */

#buttons{
  display:flex;
  justify-content:center;
  margin:16px auto;
}

button{
  border:0;
  border-radius:12px;
  padding:12px 20px;
  font-size:16px;
  font-weight:bold;
  background:#222;
  color:#fff;
  cursor:pointer;
}

button:active{
  transform:scale(.96);
}

#message{
  min-height:28px;
  text-align:center;
  font-weight:bold;
  margin:8px;
}

#loading{
  text-align:center;
  padding:10px;
  color:#777;
}

/* ================= WIN ================= */

#winScreen{
  position:fixed;
  inset:0;
  display:none;
  align-items:center;
  justify-content:center;
  background:rgba(0,0,0,.55);
  z-index:10000;
  padding:20px;
}

.winBox{
  width:min(90vw,380px);
  background:#fff;
  border-radius:22px;
  padding:28px 20px;
  text-align:center;
  box-shadow:0 10px 40px rgba(0,0,0,.3);
  animation:pop .35s ease;
}

.winBox h2{
  margin-top:0;
  font-size:30px;
}

.winEmoji{
  font-size:55px;
}

@keyframes pop{
  from{
    transform:scale(.7);
    opacity:0;
  }
  to{
    transform:scale(1);
    opacity:1;
  }
}

/* ================= CONFETTI ================= */

.confetti{
  position:fixed;
  top:-20px;
  z-index:11000;
  font-size:22px;
  pointer-events:none;
  animation:fall 2.5s linear forwards;
}

@keyframes fall{
  to{
    transform:translateY(110vh) rotate(720deg);
    opacity:0;
  }
}
</style>
</head>

<body>

<header>

  <h1>🐼 Complete the Pic</h1>

  <div class="subtitle">
    Pick the pieces. Complete the picture!
  </div>

  <div class="stats">

    <div class="stat">
      <b id="timer">00:00</b>
      <span>Time</span>
    </div>

    <div class="stat">
      <b id="moves">0</b>
      <span>Moves</span>
    </div>

      <b id="score">100</b>
      <span>Score</span>
    </div>

    <div class="stat">
      <b id="bestScore">-</b>
      <span>Best</span>
    </div>

  </div>

</header>


<div id="gameArea">

  <div id="loading">
    Loading Panda picture...
  </div>


  <!-- ================= FRAME ================= -->

  <div id="frame">

    <canvas id="boardCanvas"></canvas>

    <!-- Correct pieces stay INSIDE the frame -->
    <div id="lockedPieces"></div>

  </div>


  <div id="piecesTitle">

  </div>

<div id="winScreen">

  <div class="winBox">

    <div class="winEmoji">

    </div>

    </h2>

    <p>
      Great job!
    </p>

    <p>
      Time:
      <b id="finalTime">00:00</b>
    </p>

    <p>
      Moves:
      <b id="finalMoves">0</b>
    </p>

    <p>
      Score:
      <b id="finalScore">0</b>
    </p>

    <button onclick="newGame()">
      ▶ Play Again
    </button>

  </div>

</div>


<script>

/* =========================================================
   COMPLETE THE PIC V2.4
   DIFFERENT JIGSAW SHAPES
   FIXED INSIDE FRAME
   ========================================================= */

const GRID = 3;


/* ================= ELEMENTS ================= */

const frame =
  document.getElementById("frame");

const boardCanvas =
  document.getElementById("boardCanvas");

const boardCtx =
  boardCanvas.getContext("2d");

const lockedPieces =
  document.getElementById("lockedPieces");

const piecesArea =
  document.getElementById("piecesArea");

const loading =
  document.getElementById("loading");

const timerEl =
  document.getElementById("timer");

const movesEl =
  document.getElementById("moves");

const scoreEl =
  document.getElementById("score");

const bestScoreEl =
  document.getElementById("bestScore");

const messageEl =
  document.getElementById("message");

const winScreen =
  document.getElementById("winScreen");

const finalTimeEl =
  document.getElementById("finalTime");

const finalMovesEl =
  document.getElementById("finalMoves");

const finalScoreEl =
  document.getElementById("finalScore");


/* ================= IMAGE ================= */

const pandaImage =
  new Image();

pandaImage.src =
  "panda.png";

let imageReady = false;


/* ================= GAME ================= */

let seconds = 0;
let moves = 0;
let lockedCount = 0;

let timerInterval = null;
let gameStarted = false;

let draggingPiece = null;

let dragOffsetX = 0;
let dragOffsetY = 0;

let horizontalEdges = [];
let verticalEdges = [];

let audioContext = null;


/* ================= BEST SCORE ================= */

let bestScore =
  Number(
    localStorage.getItem(
      "completePic_v24_bestScore"
    )
  ) || 0;

let bestTime =
  Number(
    localStorage.getItem(
      "completePic_v24_bestTime"
    )
  ) || 0;

bestScoreEl.textContent =
  bestScore > 0
    ? bestScore
    : "-";


/* =========================================================
   IMAGE LOAD
   ========================================================= */

pandaImage.onload = function(){

  imageReady = true;

  loading.style.display = "none";

  resizeBoard();

  newGame();
};


pandaImage.onerror = function(){

  loading.textContent =
    "❌ panda.png not found. Put panda.png beside index.html.";

};


/* =========================================================
   RESIZE BOARD
   ========================================================= */

function resizeBoard(){

  const rect =
    frame.getBoundingClientRect();

  const size =
    Math.max(
      300,
      Math.floor(rect.width)
    );

  boardCanvas.width =
    size;

  boardCanvas.height =
    size;

  drawBoard();

}


/* =========================================================
   DRAW BOARD
   ========================================================= */

function drawBoard(){

  if(!imageReady)
    return;

  const w =
    boardCanvas.width;

  const h =
    boardCanvas.height;


  boardCtx.clearRect(
    0,
    0,
    w,
    h
  );


  boardCtx.fillStyle =
    "#ffffff";

  boardCtx.fillRect(
    0,
    0,
    w,
    h
  );


  /*
     Very faint Panda guide.
  */

  boardCtx.save();

  boardCtx.globalAlpha =
    0.10;

  boardCtx.drawImage(
    pandaImage,
    0,
    0,
    w,
    h
  );

  boardCtx.restore();


  /*
     Light grid.
  */

  boardCtx.save();

  boardCtx.strokeStyle =
    "rgba(80,80,80,.18)";

  boardCtx.lineWidth = 1;


  const cell =
    w / GRID;


  for(let i=1;i<GRID;i++){

    boardCtx.beginPath();

    boardCtx.moveTo(
      i*cell,
      0
    );

    boardCtx.lineTo(
      i*cell,
      h
    );

    boardCtx.stroke();


    boardCtx.beginPath();

    boardCtx.moveTo(
      0,
      i*cell
    );

    boardCtx.lineTo(
      w,
      i*cell
    );

    boardCtx.stroke();

  }

  boardCtx.restore();

}


/* =========================================================
   CREATE DIFFERENT EDGE SHAPES
   ========================================================= */

function buildEdges(){

  horizontalEdges = [];
  verticalEdges = [];


  /*
     Horizontal internal edges.

     Randomly choose:
       +1 tab
       -1 notch
  */

  for(
    let r=0;
    r<GRID-1;
    r++
  ){

    horizontalEdges[r] = [];

    for(
      let c=0;
      c<GRID;
      c++
    ){

      horizontalEdges[r][c] =
        Math.random() < .5
          ? 1
          : -1;

    }

  }


  /*
     Vertical internal edges.
  */

  for(
    let r=0;
    r<GRID;
    r++
  ){

    verticalEdges[r] = [];

    for(
      let c=0;
      c<GRID-1;
      c++
    ){

      verticalEdges[r][c] =
        Math.random() < .5
          ? 1
          : -1;

    }

  }

}


/* =========================================================
   HORIZONTAL EDGE
   ========================================================= */

function horizontalEdge(
  x,
  y,
  length,
  sign
){

  if(sign === 0){

    return `
      L ${x+length} ${y}
    `;

  }


  const direction =
    length >= 0
      ? 1
      : -1;

  const L =
    Math.abs(length);


  /*
     Tab size.
  */

  const tab =
    15;


  const a =
    x +
    direction *
    L *
    .28;

  const b =
    x +
    direction *
    L *
    .38;

  const c =
    x +
    direction *
    L *
    .62;

  const d =
    x +
    direction *
    L *
    .72;


  const bumpY =
    y +
    sign *
    tab;


  return `
    L ${a} ${y}

    C
      ${a + direction*5} ${y},
      ${b - direction*2} ${bumpY},
      ${b} ${bumpY}

    C
      ${x + direction*46} ${bumpY},
      ${x + direction*54} ${bumpY},
      ${c} ${bumpY}

    C
      ${c + direction*2} ${bumpY},
      ${d - direction*5} ${y},
      ${d} ${y}

    L ${x+length} ${y}
  `;

}


/* =========================================================
   VERTICAL EDGE
   ========================================================= */

function verticalEdge(
  x,
  y,
  length,
  sign
){

  if(sign === 0){

    return `
      L ${x} ${y+length}
    `;

  }


  const direction =
    length >= 0
      ? 1
      : -1;

  const L =
    Math.abs(length);

  const tab =
    15;


  const a =
    y +
    direction *
    L *
    .28;

  const b =
    y +
    direction *
    L *
    .38;

  const c =
    y +
    direction *
    L *
    .62;

  const d =
    y +
    direction *
    L *
    .72;


  const bumpX =
    x +
    sign *
    tab;


  return `
    L ${x} ${a}

    C
      ${x} ${a + direction*5},
      ${bumpX} ${b - direction*2},
      ${bumpX} ${b}

    C
      ${bumpX} ${y + direction*46},
      ${bumpX} ${y + direction*54},
      ${bumpX} ${c}

    C
      ${bumpX} ${c + direction*2},
      ${x} ${d - direction*5},
      ${x} ${d}

    L ${x} ${y+length}
  `;

}


/* =========================================================
   CREATE JIGSAW PATH
   ========================================================= */

function makeJigsawPath(
  row,
  col,
  S,
  P
){

  const left =
    P;

  const top =
    P;

  const right =
    P + S;

  const bottom =
    P + S;


  let d =
    `M ${left} ${top} `;


  /*
     TOP
  */

  let topSign = 0;

  if(row > 0){

    topSign =
      -horizontalEdges[row-1][col];

  }

  d += horizontalEdge(
    left,
    top,
    S,
    -topSign
  );


  /*
     RIGHT
  */

  let rightSign = 0;

  if(col < GRID-1){

    rightSign =
      verticalEdges[row][col];

  }

  d += verticalEdge(
    right,
    top,
    S,
    rightSign
  );


  /*
     BOTTOM

     Reverse direction.
  */

  let bottomSign = 0;

  if(row < GRID-1){

    bottomSign =
      horizontalEdges[row][col];

  }

  d += horizontalEdge(
    right,
    bottom,
    -S,
    bottomSign
  );


  /*
     LEFT

     Reverse direction.
  */

  let leftSign = 0;

  if(col > 0){

    leftSign =
      -verticalEdges[row][col-1];

  }

  d += verticalEdge(
    left,
    bottom,
    -S,
    leftSign
  );


  d += " Z";


  return d;
}


/* =========================================================
   CREATE PIECE
   ========================================================= */

function createPiece(
  row,
  col
){

  const piece =
    document.createElement("div");

  piece.className =
    "piece";

  piece.dataset.row =
    row;

  piece.dataset.col =
    col;


  const svgNS =
    "http://www.w3.org/2000/svg";


  const svg =
    document.createElementNS(
      svgNS,
      "svg"
    );


  /*
     100 = cell.
     18 = tab space.
  */

  const S = 100;
  const P = 18;


  svg.setAttribute(
    "viewBox",
    "0 0 136 136"
  );

  svg.setAttribute(
    "preserveAspectRatio",
    "none"
  );


  const pathData =
    makeJigsawPath(
      row,
      col,
      S,
      P
    );


  /*
     Clip path.
  */

  const defs =
    document.createElementNS(
      svgNS,
      "defs"
    );


  const clip =
    document.createElementNS(
      svgNS,
      "clipPath"
    );


  const clipID =
    "clip_" +
    Date.now() +
    "_" +
    Math.random()
      .toString(36)
      .substring(2,9);


  clip.setAttribute(
    "id",
    clipID
  );


  const clipPath =
    document.createElementNS(
      svgNS,
      "path"
    );


  clipPath.setAttribute(
    "d",
    pathData
  );


  clip.appendChild(
    clipPath
  );

  defs.appendChild(
    clip
  );

  svg.appendChild(
    defs
  );


  /*
     Panda image.
  */

  const image =
    document.createElementNS(
      svgNS,
      "image"
    );


  const imageURL =
    pandaImage.currentSrc ||
    pandaImage.src;


  image.setAttribute(
    "href",
    imageURL
  );

  image.setAttribute(
    "xlink:href",
    imageURL
  );


  /*
     Position the full Panda image
     behind the selected jigsaw shape.
  */

  image.setAttribute(
    "x",
    P - col*S
  );

  image.setAttribute(
    "y",
    P - row*S
  );

  image.setAttribute(
    "width",
    GRID*S
  );

  image.setAttribute(
    "height",
    GRID*S
  );

  image.setAttribute(
    "preserveAspectRatio",
    "none"
  );

  image.setAttribute(
    "clip-path",
    `url(#${clipID})`
  );


  svg.appendChild(
    image
  );


  /*
     Piece outline.
  */

  const outline =
    document.createElementNS(
      svgNS,
      "path"
    );


  outline.setAttribute(
    "d",
    pathData
  );

  outline.setAttribute(
    "fill",
    "none"
  );

  outline.setAttribute(
    "stroke",
    "rgba(0,0,0,.35)"
  );

  outline.setAttribute(
    "stroke-width",
    "1.6"
  );

  outline.setAttribute(
    "pointer-events",
    "none"
  );


  svg.appendChild(
    outline
  );


  piece.appendChild(
    svg
  );


  piece.addEventListener(
    "pointerdown",
    startDrag
  );


  return piece;
}


/* =========================================================
   CREATE ALL PIECES
   ========================================================= */

function createPieces(){

  piecesArea.innerHTML = "";


  const pieces = [];


  for(
    let row=0;
    row<GRID;
    row++
  ){

    for(
      let col=0;
      col<GRID;
      col++
    ){

      pieces.push(
        createPiece(row,col)
      );

    }

  }


  /*
     Shuffle.
  */

  pieces.sort(
    () =>
      Math.random() - .5
  );


  pieces.forEach(
    piece =>
      piecesArea.appendChild(piece)
  );

}


/* =========================================================
   NEW GAME
   ========================================================= */

function newGame(){

  if(!imageReady)
    return;


  stopTimer();


  seconds = 0;
  moves = 0;
  lockedCount = 0;

  gameStarted = false;


  messageEl.textContent = "";


  winScreen.style.display =
    "none";


  /*
     Remove old pieces
     from both places.
  */

  document
    .querySelectorAll(".piece")
    .forEach(
      p => p.remove()
    );


  piecesArea.innerHTML = "";

  lockedPieces.innerHTML = "";


  /*
     Generate new shapes.
  */

  buildEdges();


  resizeBoard();


  createPieces();


  updateStats();

}


/* =========================================================
   START DRAG
   ========================================================= */

function startDrag(e){

  if(
    e.button !== undefined &&
    e.button !== 0
  ){
    return;
  }


  const piece =
    e.currentTarget;


  if(
    piece.classList.contains(
      "locked"
    )
  ){
    return;
  }


  initAudio();


  if(!gameStarted){

    gameStarted = true;

    startTimer();

  }


  const rect =
    piece.getBoundingClientRect();


  dragOffsetX =
    e.clientX -
    rect.left;

  dragOffsetY =
    e.clientY -
    rect.top;


  /*
     Move piece to BODY
     so it can cross the frame.
  */

  document.body.appendChild(
    piece
  );


  piece.style.position =
    "fixed";

  piece.style.left =
    rect.left + "px";

  piece.style.top =
    rect.top + "px";

  piece.style.width =
    "96px";

  piece.style.height =
    "96px";


  piece.classList.add(
    "dragging"
  );


  draggingPiece =
    piece;


  try{

    piece.setPointerCapture(
      e.pointerId
    );

  }catch(err){}


  piece.addEventListener(
    "pointermove",
    dragMove
  );

  piece.addEventListener(
    "pointerup",
    endDrag
  );

  piece.addEventListener(
    "pointercancel",
    endDrag
  );


  e.preventDefault();
}


/* =========================================================
   DRAG MOVE
   ========================================================= */

function dragMove(e){

  if(
    !draggingPiece ||
    draggingPiece !==
      e.currentTarget
  ){
    return;
  }


  draggingPiece.style.left =
    (
      e.clientX -
      dragOffsetX
    ) + "px";


  draggingPiece.style.top =
    (
      e.clientY -
      dragOffsetY
    ) + "px";


  e.preventDefault();
}


/* =========================================================
   END DRAG
   ========================================================= */

function endDrag(e){

  if(
    !draggingPiece ||
    draggingPiece !==
      e.currentTarget
  ){
    return;
  }


  const piece =
    draggingPiece;


  piece.removeEventListener(
    "pointermove",
    dragMove
  );

  piece.removeEventListener(
    "pointerup",
    endDrag
  );

  piece.removeEventListener(
    "pointercancel",
    endDrag
  );


  draggingPiece = null;


  piece.classList.remove(
    "dragging"
  );


  checkDrop(piece);

}


/* =========================================================
   CHECK DROP
   ========================================================= */

function checkDrop(piece){

  const row =
    Number(
      piece.dataset.row
    );

  const col =
    Number(
      piece.dataset.col
    );


  const boardRect =
    boardCanvas.getBoundingClientRect();


  const cellW =
    boardRect.width / GRID;

  const cellH =
    boardRect.height / GRID;


  const pieceRect =
    piece.getBoundingClientRect();


  const centerX =
    pieceRect.left +
    pieceRect.width / 2;

  const centerY =
    pieceRect.top +
    pieceRect.height / 2;


  const targetX =
    boardRect.left +
    (col + .5) *
    cellW;

  const targetY =
    boardRect.top +
    (row + .5) *
    cellH;


  const dx =
    centerX -
    targetX;

  const dy =
    centerY -
    targetY;


  const distance =
    Math.sqrt(
      dx*dx +
      dy*dy
    );


  /*
     Very generous drop area.
  */

  const tolerance =
    Math.min(
      cellW,
      cellH
    ) * .90;


  if(
    distance <= tolerance
  ){

    lockPiece(
      piece,
      row,
      col
    );

  }else{

    wrongPlacement(
      piece
    );

  }

}


/* =========================================================
   LOCK PIECE INSIDE FRAME
   ========================================================= */

function lockPiece(
  piece,
  row,
  col
){

  const boardRect =
    boardCanvas.getBoundingClientRect();


  const frameRect =
    frame.getBoundingClientRect();


  const cellW =
    boardRect.width / GRID;

  const cellH =
    boardRect.height / GRID;


  /*
     Jigsaw tab space.
  */

  const padX =
    cellW * .18;

  const padY =
    cellH * .18;


  /*
     IMPORTANT:

     The piece is now moved into
     #lockedPieces.

     Therefore it is positioned
     relative to the frame,
     NOT the screen.
  */

  lockedPieces.appendChild(
    piece
  );


  piece.classList.add(
    "locked"
  );


  piece.style.position =
    "absolute";


  piece.style.width =
    (
      cellW +
      padX*2
    ) + "px";


  piece.style.height =
    (
      cellH +
      padY*2
    ) + "px";


  /*
     Position relative to frame.
  */

  piece.style.left =
    (
      col*cellW -
      padX
    ) + "px";


  piece.style.top =
    (
      row*cellH -
      padY
    ) + "px";


  piece.style.zIndex =
    "10";


  moves++;

  lockedCount++;


  updateStats();


  playCorrectSound();

  vibrate(35);


  messageEl.textContent =
    "🎉 Great! Correct piece!";


  if(
    lockedCount ===
    GRID*GRID
  ){

    setTimeout(
      completeGame,
      300
    );

  }

}


/* =========================================================
   WRONG PLACEMENT
   ========================================================= */

function wrongPlacement(piece){

  moves++;

  updateStats();


  playWrongSound();

  vibrate([
    40,
    40,
    40
  ]);


  piece.classList.add(
    "shake"
  );


  messageEl.textContent =
    "❌ Not there. Try another place.";


  setTimeout(
    () => {

      piece.classList.remove(
        "shake"
      );

      returnPiece(piece);

    },
    380
  );

}


/* =========================================================
   RETURN PIECE
   ========================================================= */

function returnPiece(piece){

  piecesArea.appendChild(
    piece
  );


  piece.style.position =
    "relative";

  piece.style.left =
    "";

  piece.style.top =
    "";

  piece.style.width =
    "96px";

  piece.style.height =
    "96px";

  piece.style.zIndex =
    "";


  piece.classList.remove(
    "locked",
    "dragging"
  );

}


/* =========================================================
   TIMER
   ========================================================= */

function startTimer(){

  stopTimer();


  timerInterval =
    setInterval(
      () => {

        seconds++;

        updateStats();

      },
      1000
    );

}


function stopTimer(){

  if(timerInterval){

    clearInterval(
      timerInterval
    );

    timerInterval =
      null;

  }

}


/* =========================================================
   FORMAT TIME
   ========================================================= */

function formatTime(total){

  const minutes =
    Math.floor(
      total / 60
    );

  const secs =
    total % 60;


  return (
    String(minutes)
      .padStart(2,"0") +
    ":" +
    String(secs)
      .padStart(2,"0")
  );

}


/* =========================================================
   SCORE
   ========================================================= */

function calculateScore(){

  return Math.max(
    0,
    100 -
    moves*2 -
    Math.floor(
      seconds/5
    )
  );

}


/* =========================================================
   UPDATE STATS
   ========================================================= */

function updateStats(){

  timerEl.textContent =
    formatTime(seconds);

  movesEl.textContent =
    moves;

  scoreEl.textContent =
    calculateScore();

  bestScoreEl.textContent =
    bestScore > 0
      ? bestScore
      : "-";

}


/* =========================================================
   COMPLETE
   ========================================================= */

function completeGame(){

  stopTimer();

  gameStarted = false;


  const finalScore =
    calculateScore();


  /*
     Best score.
  */

  if(
    finalScore >
    bestScore
  ){

    bestScore =
      finalScore;

    localStorage.setItem(
      "completePic_v24_bestScore",
      bestScore
    );

  }


  /*
     Best time.
  */

  if(
    bestTime === 0 ||
    seconds < bestTime
  ){

    bestTime =
      seconds;

    localStorage.setItem(
      "completePic_v24_bestTime",
      bestTime
    );

  }


  updateStats();


  finalTimeEl.textContent =
    formatTime(seconds);

  finalMovesEl.textContent =
    moves;

  finalScoreEl.textContent =
    finalScore;


  winScreen.style.display =
    "flex";


  playWinSound();


  vibrate([
    100,
    60,
    100,
    60,
    180
  ]);


  createConfetti();

}


/* =========================================================
   CONFETTI
   ========================================================= */

function createConfetti(){

  const emojis = [
    "🎉",
    "⭐",
    "🐼",
    "🧩",
    "🎊"
  ];


  for(
    let i=0;
    i<35;
    i++
  ){

    const item =
      document.createElement(
        "div"
      );


    item.className =
      "confetti";


    item.textContent =
      emojis[
        Math.floor(
          Math.random() *
          emojis.length
        )
      ];


    item.style.left =
      Math.random()*100 +
      "vw";


    item.style.animationDelay =
      Math.random()*1.2 +
      "s";


    document.body.appendChild(
      item
    );


    setTimeout(
      () => item.remove(),
      4000
    );

  }

}


/* =========================================================
   AUDIO
   ========================================================= */

function initAudio(){

  if(!audioContext){

    try{

      audioContext =
        new (
          window.AudioContext ||
          window.webkitAudioContext
        )();

    }catch(err){}

  }

}


function beep(
  frequency,
  duration,
  type="sine"
){

  if(!audioContext)
    return;


  try{

    const oscillator =
      audioContext
        .createOscillator();

    const gain =
      audioContext
        .createGain();


    oscillator.type =
      type;

    oscillator.frequency.value =
      frequency;


    gain.gain.setValueAtTime(
      .001,
      audioContext.currentTime
    );


    gain.gain.exponentialRampToValueAtTime(
      .12,
      audioContext.currentTime +
      .01
    );


    gain.gain.exponentialRampToValueAtTime(
      .001,
      audioContext.currentTime +
      duration
    );


    oscillator.connect(
      gain
    );

    gain.connect(
      audioContext.destination
    );


    oscillator.start();


    oscillator.stop(
      audioContext.currentTime +
      duration
    );

  }catch(err){}

}


function playCorrectSound(){

  initAudio();

  beep(
    700,
    .10,
    "sine"
  );


  setTimeout(
    () =>
      beep(
        950,
        .12,
        "sine"
      ),
    90
  );

}


function playWrongSound(){

  initAudio();

  beep(
    180,
    .18,
    "sawtooth"
  );

}


function playWinSound(){

  initAudio();


  beep(
    523,
    .12
  );


  setTimeout(
    () =>
      beep(
        659,
        .12
      ),
    130
  );


  setTimeout(
    () =>
      beep(
        784,
        .18
      ),
    260
  );

}


/* =========================================================
   VIBRATION
   ========================================================= */

function vibrate(pattern){

  if(
    navigator.vibrate
  ){

    try{

      navigator.vibrate(
        pattern
      );

    }catch(err){}

  }

}


/* =========================================================
   WINDOW RESIZE
   ========================================================= */

window.addEventListener(
  "resize",
  () => {

    if(imageReady){

      resizeBoard();

    }

  }
);


/* =========================================================
   INITIAL START
   ========================================================= */

if(
  pandaImage.complete &&
  pandaImage.naturalWidth > 0
){

  pandaImage.onload();

}
