/* =========================================
   AUDIO
========================================= */

function getAudio(){

    if(!audioContext){
        audioContext =
            new (window.AudioContext ||
            window.webkitAudioContext)();
    }

    return audioContext;
}

function playSound(type){

    try{

        const ac = getAudio();

        const osc = ac.createOscillator();
        const gain = ac.createGain();

        osc.connect(gain);
        gain.connect(ac.destination);

        let frequency = 440;

        if(type === "correct")
            frequency = 650;

        if(type === "wrong")
            frequency = 180;

        if(type === "win")
            frequency = 850;

        osc.frequency.value = frequency;

        osc.type = "sine";

        gain.gain.setValueAtTime(
            0.0001,
            ac.currentTime
        );

        gain.gain.exponentialRampToValueAtTime(
            0.15,
            ac.currentTime + .02
        );

        gain.gain.exponentialRampToValueAtTime(
            0.0001,
            ac.currentTime + .25
        );

        osc.start();

        osc.stop(
            ac.currentTime + .27
        );

    }catch(e){}
}

function drawCloud(ctx,x,y,s){

    ctx.fillStyle="#ffffff";

    ctx.arc(
        x,
        y,
        45*s,
        0,
        Math.PI*2
    );

    ctx.arc(
        x+45*s,
        y-18*s,

        Math.PI*2
    );

    ctx.arc(
        x+100*s,
        y,
        42*s,
        0,
        Math.PI*2
    );

    ctx.fill();
}

/* =========================================
   JIGSAW SHAPES
========================================= */

/*
 edge:
 -1 = outer edge
  0 = inward/straight
  1 = tab
*/

function createEdges(){

    const edges=[];

    for(let r=0;r<ROWS;r++){

        edges[r]=[];

        for(let c=0;c<COLS;c++){

            const top =
                r===0
                ? 0
                : -edges[r-1][c].bottom;

            const left =
                c===0
                ? 0
                : -edges[r][c-1].right;

            const right =
                c===COLS-1
                ? 0
                : (Math.random()<.5?1:-1);

            const bottom =
                r===ROWS-1
                ? 0
                : (Math.random()<.5?1:-1);

            edges[r][c]={
                top,
                right,
                bottom,
                left
            };
        }
    }

    return edges;
}


/* =========================================
   JIGSAW PATH
========================================= */

function addJigsawPath(
    c,
    x,
    y,
    w,
    h,
    edges
){

    c.beginPath();

    /* top */

    c.moveTo(x,y);

    if(edges.top===0){

        c.lineTo(
            x+w,
            y
        );

    }else{

        c.lineTo(
            x+w*.38,
            y
        );

        drawTab(
            c,
            x+w*.38,
            y,
            x+w*.62,
            y,
            edges.top,
            true
        );

        c.lineTo(
            x+w,
            y
        );
    }


    /* right */

    if(edges.right===0){

        c.lineTo(
            x+w,
            y+h
        );

    }else{

        c.lineTo(
            x+w,
            y+h*.38
        );

        drawTab(
            c,
            x+w,
            y+h*.38,
            x+w,
            y+h*.62,
            edges.right,
            false
        );

        c.lineTo(
            x+w,
            y+h
        );
    }


    /* bottom */

    if(edges.bottom===0){

        c.lineTo(
            x,
            y+h
        );

    }else{

        c.lineTo(
            x+w*.62,
            y+h
        );

        drawTab(
            c,
            x+w*.62,
            y+h,
            x+w*.38,
            y+h,
            edges.bottom,
            true
        );

        c.lineTo(
            x,
            y+h
        );
    }


    /* left */

    if(edges.left===0){

        c.lineTo(
            x,
            y
        );

    }else{

        c.lineTo(
            x,
            y+h*.62
        );

        drawTab(
            c,
            x,
            y+h*.62,
            x,
            y+h*.38,
            edges.left,
            false
        );

        c.lineTo(
            x,
            y
        );
    }

    c.closePath();
}


/*
Draw a rounded tab/slot.
*/

function drawTab(
    c,
    x1,y1,
    x2,y2,
    direction,
    horizontal
){

    const bulge =
        direction===1
        ? 38
        : -38;

    if(horizontal){

        const midX=(x1+x2)/2;
        const midY=y1;

        c.bezierCurveTo(
            x1+25,
            midY,
            midX-35,
            midY+bulge,
            midX,
            midY+bulge
        );

        c.bezierCurveTo(
            midX+35,
            midY+bulge,
            x2-25,
            midY,
            x2,
            midY
        );

    }else{

        const midX=x1;
        const midY=(y1+y2)/2;

        c.bezierCurveTo(
            midX,
            y1+25,
            midX+bulge,
            midY-35,
            midX+bulge,
            midY
        );

        c.bezierCurveTo(
            midX+bulge,
            midY+35,
            midX,
            y2-25,
            midX,
            y2
        );
    }
}


/* =========================================
   CREATE PIECES
========================================= */

function createPieces(){

    piecesContainer.innerHTML="";

    pieceData=[];

    const edges=createEdges();

    for(let r=0;r<ROWS;r++){

        for(let col=0;col<COLS;col++){

            const index =
                r*COLS+col;

            const canvas =
                document.createElement("canvas");

            const pad=45;

            canvas.width=
                CELL+pad*2;

            canvas.height=
                CELL+pad*2;

            const c=
                canvas.getContext("2d");

            /*
             Create a mask.
             The actual picture is drawn
             underneath the same path.
            */

            c.save();

            addJigsawPath(
                c,
                pad,
                pad,
                CELL,
                CELL,
                edges[r][col]
            );

            c.clip();


            /*
             Draw the SAME complete panda
             shifted into this piece.
            */

            c.drawImage(
                sourceCanvas,
                pad-col*CELL,
                pad-r*CELL
            );

            c.restore();


            /* outline */

            c.save();

            addJigsawPath(
                c,
                pad,
                pad,
                CELL,
                CELL,
                edges[r][col]
            );

            c.strokeStyle="#111";
            c.lineWidth=5;

            c.stroke();

            c.restore();


            const piece =
                document.createElement("div");

            piece.className="piece";

            piece.dataset.index=index;

            piece.appendChild(canvas);

            piecesContainer.appendChild(piece);

            pieceData.push({
                element:piece,
                index:index,
                row:r,
                col:col,
                placed:false
            });

            addDragEvents(piece);
        }
    }

    shufflePieces();
}


/* =========================================
   SHUFFLE
========================================= */

function shufflePieces(){

    for(
        let i=pieceData.length-1;
        i>0;
        i--
    ){

        const j=
            Math.floor(
                Math.random()*(i+1)
            );

        [
            pieceData[i],
            pieceData[j]
        ]=[
            pieceData[j],
            pieceData[i]
        ];
    }

    pieceData.forEach(
        p =>
        piecesContainer.appendChild(
            p.element
        )
    );
}


/* =========================================
   DRAG SYSTEM
========================================= */

function addDragEvents(piece){

    let startX=0;
    let startY=0;

    let originalLeft=0;
    let originalTop=0;

    let dragging=false;


    piece.addEventListener(
        "pointerdown",
        e=>{

            if(
                piece.classList.contains("correct")
            ) return;

            dragging=true;

            piece.setPointerCapture(
                e.pointerId
            );

            const rect=
                piece.getBoundingClientRect();

            startX=e.clientX;
            startY=e.clientY;

            originalLeft=
                rect.left;

            originalTop=
                rect.top;

            piece.classList.add(
                "dragging"
            );

            piece.style.position="fixed";

            piece.style.width=
                rect.width+"px";

            piece.style.height=
                rect.height+"px";

            piece.style.left=
                rect.left+"px";

            piece.style.top=
                rect.top+"px";
        }
    );


    piece.addEventListener(
        "pointermove",
        e=>{

            if(!dragging)return;

            const dx=
                e.clientX-startX;

            const dy=
                e.clientY-startY;

            piece.style.left=
                originalLeft+dx+"px";

            piece.style.top=
                originalTop+dy+"px";
        }
    );


    piece.addEventListener(
        "pointerup",
        e=>{

            if(!dragging)return;

            dragging=false;

            piece.classList.remove(
                "dragging"
            );

            checkDrop(piece);
        }
    );


    piece.addEventListener(
        "pointercancel",
        e=>{

            if(!dragging)return;

            dragging=false;

            piece.classList.remove(
                "dragging"
            );

            returnPiece(piece);
        }
    );
}


/* =========================================
   CHECK DROP
========================================= */

function checkDrop(piece){

    moves++;

    movesEl.textContent=moves;

    const index=
        Number(piece.dataset.index);

    const row=
        Math.floor(index/COLS);

    const col=
        index%COLS;

    const boardRect=
        board.getBoundingClientRect();

    const pieceRect=
        piece.getBoundingClientRect();

    const centerX=
        pieceRect.left+
        pieceRect.width/2;

    const centerY=
        pieceRect.top+
        pieceRect.height/2;

    const targetX=
        boardRect.left+
        (col+.5)*
        boardRect.width/COLS;

    const targetY=
        boardRect.top+
        (row+.5)*
        boardRect.height/ROWS;

    const distance=
        Math.hypot(
            centerX-targetX,
            centerY-targetY
        );

    /*
      Correct if center is close
      to target cell.
    */

    if(
        distance <
        boardRect.width*.18
    ){

        placeCorrect(
            piece,
            row,
            col
        );

    }else{

        wrongPiece(piece);
    }
}


/* =========================================
   CORRECT
========================================= */

function placeCorrect(
    piece,
    row,
    col
){

    const boardRect=
        board.getBoundingClientRect();

    const cellW=
        boardRect.width/COLS;

    const cellH=
        boardRect.height/ROWS;

    const pieceSize=
        cellW;


    piece.classList.add(
        "correct"
    );

    piece.style.position=
        "absolute";

    piece.style.width=
        cellW+"px";

    piece.style.height=
        cellH+"px";

    piece.style.left=
        col*cellW+"px";

    piece.style.top=
        row*cellH+"px";

    piece.style.transform=
        "scale(1)";

    board.appendChild(piece);

    const data=
        pieceData.find(
            p =>
            p.element===piece
        );

    if(data)
        data.placed=true;

    completed++;

    playSound("correct");

    messageEl.textContent=
        "🎉 Great! Correct piece!";

    updateScore();

    if(
        completed===
        ROWS*COLS
    ){

        finishGame();
    }
}


/* =========================================
   WRONG
========================================= */

function wrongPiece(piece){

    playSound("wrong");

    messageEl.textContent=
        "❌ Not the right place!";

    piece.classList.add(
        "wrong"
    );

    setTimeout(
        ()=>{

            piece.classList.remove(
                "wrong"
            );

            returnPiece(piece);

        },
        400
    );
}


/* =========================================
   RETURN PIECE
========================================= */

function returnPiece(piece){

    piece.style.position=
        "relative";

    piece.style.left="";
    piece.style.top="";
    piece.style.width="";
    piece.style.height="";

    piecesContainer.appendChild(
        piece
    );
}


/* =========================================
   SCORE
========================================= */

function updateScore(){

    let value=
        100-
        moves*2-
        Math.floor(seconds/5);

    if(value<10)
        value=10;

    scoreEl.textContent=value;
}


/* =========================================
   TIMER
========================================= */

function startTimer(){

    clearInterval(
        timerInterval
    );

    timerInterval=
        setInterval(
            ()=>{

                seconds++;

                const min=
                    String(
                        Math.floor(seconds/60)
                    ).padStart(2,"0");

                const sec=
                    String(
                        seconds%60
                    ).padStart(2,"0");

                timerEl.textContent=
                    min+":"+sec;

                updateScore();

            },
            1000
        );
}


/* =========================================
   FINISH
========================================= */

function finishGame(){

    clearInterval(
        timerInterval
    );

    playSound("win");

    board.classList.add(
        "boardWin"
    );

    targetCanvas.style.opacity="1";

    const finalScore=
        Number(
            scoreEl.textContent
        );

    messageEl.textContent=
        "🏆 Amazing! You completed the Panda!";

    winText.innerHTML=
        `
        ⏱ Time: <b>${timerEl.textContent}</b><br>
        👣 Moves: <b>${moves}</b><br>
        ⭐ Score: <b>${finalScore}</b>
        `;

    winBox.style.display=
        "block";
}


/* =========================================
   NEW GAME
========================================= */

function newGame(){

    clearInterval(
        timerInterval
    );

    moves=0;
    seconds=0;
    completed=0;

    movesEl.textContent="0";
    timerEl.textContent="00:00";
    scoreEl.textContent="100";

    messageEl.textContent=
        "Drag each piece into its correct place.";

    winBox.style.display=
        "none";

    board.classList.remove(
        "boardWin"
    );

    targetCanvas.style.opacity=".13";

    drawPanda();

    createPieces();

    startTimer();
}


/* =========================================
   START
========================================= */

newGame();

</script>

</body>
</html>
