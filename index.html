<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1.0,user-scalable=no">

<title>Complete the Pic - Panda Puzzle</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  text-align:center;
  background:linear-gradient(135deg,#dff7ff,#fff0c9);
  color:#222;
  overflow-x:hidden;
}

h1{
  margin:12px 0 3px;
  font-size:29px;
}

.subtitle{
  color:#555;
  margin-bottom:10px;
  font-size:15px;
}

.info{
  display:flex;
  justify-content:center;
  gap:22px;
  flex-wrap:wrap;
  font-weight:bold;
  margin-bottom:10px;
}

#game{
  width:100%;
  max-width:560px;
  margin:auto;
  padding:8px;
}

/* ================================
   PUZZLE BOARD
================================ */

#board{
  position:relative;
  width:min(92vw,450px);
  height:min(92vw,450px);
  margin:auto;

  background:#fff;

  border:9px solid #000;

  overflow:hidden;

  box-shadow:
    0 6px 18px rgba(0,0,0,.3);
}

/*
 The target image is hidden until
 pieces are correctly placed.
*/
#targetCanvas{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  opacity:.10;
  transition:opacity .4s;
}

#targetCanvas.show{
  opacity:1;
}


/* ================================
   TARGET CELLS
================================ */

.targetCell{
  position:absolute;

  width:33.3333%;
  height:33.3333%;

  border:1px dashed rgba(0,0,0,.35);

  z-index:2;

  pointer-events:none;
}

.targetCell.correct{
  border:1px solid rgba(0,150,40,.35);
}

#cell0{left:0;top:0}
#cell1{left:33.3333%;top:0}
#cell2{left:66.6666%;top:0}

#cell3{left:0;top:33.3333%}
#cell4{left:33.3333%;top:33.3333%}
#cell5{left:66.6666%;top:33.3333%}

#cell6{left:0;top:66.6666%}
#cell7{left:33.3333%;top:66.6666%}
#cell8{left:66.6666%;top:66.6666%}


/* ================================
   MESSAGE
================================ */

#message{
  min-height:32px;
  margin:9px 4px;

  font-size:17px;
  font-weight:bold;
}

#message.win{
  color:#0b982f;
  font-size:23px;
}


/* ================================
   PIECES AREA
================================ */

#piecesArea{
  width:min(96vw,520px);

  margin:10px auto;

  padding:12px;

  background:rgba(255,255,255,.82);

  border:3px dashed #555;

  border-radius:15px;
}

#piecesTitle{
  font-weight:bold;
  margin-bottom:10px;
}

#pieces{
  display:grid;

  grid-template-columns:
    repeat(3,1fr);

  gap:9px;

  justify-items:center;
}


/* ================================
   PUZZLE PIECE
================================ */

.piece{
  position:relative;

  width:min(28vw,135px);
  height:min(28vw,135px);

  cursor:grab;

  touch-action:none;
  user-select:none;

  z-index:10;

  filter:
    drop-shadow(
      0 3px 4px rgba(0,0,0,.25)
    );

  transition:
    transform .12s;
}

.piece:active{
  cursor:grabbing;

  transform:
    scale(1.06);

  z-index:100;
}

.pieceCanvas{
  width:100%;
  height:100%;
  display:block;
}


/* ================================
   BUTTON
================================ */

button{
  border:0;

  border-radius:12px;

  padding:12px 24px;

  margin:6px;

  background:#222;
  color:white;

  font-size:16px;
  font-weight:bold;
}

button:active{
  transform:scale(.95);
}


/* ================================
   ANIMATIONS
================================ */

@keyframes shake{

  0%{
    transform:translateX(0);
  }

  25%{
    transform:translateX(-8px);
  }

  50%{
    transform:translateX(8px);
  }

  75%{
    transform:translateX(-8px);
  }

  100%{
    transform:translateX(0);
  }

}

.shake{
  animation:shake .3s;
}


@keyframes winAnimation{

  0%{
    transform:scale(1);
  }

  50%{
    transform:
      scale(1.06)
      rotate(2deg);
  }

  100%{
    transform:scale(1);
  }

}

.winBoard{
  animation:
    winAnimation .7s
    infinite;
}


/* ================================
   MOBILE
================================ */

@media(max-width:420px){

  h1{
    font-size:25px;
  }

  .info{
    gap:13px;
    font-size:14px;
  }

}
</style>
</head>

<script>

/* =====================================================
   COMPLETE THE PIC V1.3
   SEAMLESS CANVAS PANDA PUZZLE
===================================================== */


/* =====================================================
   ELEMENTS
===================================================== */

const board =
  document.getElementById("board");

const targetCanvas =
  document.getElementById("targetCanvas");

const targetCtx =
  targetCanvas.getContext("2d");

const piecesContainer =
  document.getElementById("pieces");

const message =
  document.getElementById("message");

const timerText =
  document.getElementById("timer");

const movesText =
  document.getElementById("moves");

const scoreText =
  document.getElementById("score");


/* =====================================================
   GAME VARIABLES
===================================================== */

let moves = 0;

let seconds = 0;

let completed = 0;

let timer = null;

let started = false;


/*
  Board drawing resolution.

  900 x 900 gives the generated picture
  enough detail for mobile screens.
*/

const SIZE = 900;


/* =====================================================
   AUDIO
===================================================== */

let audioContext = null;


function playSound(type){

  try{

    if(!audioContext){

      audioContext =
        new (
          window.AudioContext ||
          window.webkitAudioContext
        )();

    }

    const oscillator =
      audioContext.createOscillator();

    const gain =
      audioContext.createGain();

    oscillator.connect(gain);

    gain.connect(
      audioContext.destination
    );


    if(type === "correct"){

      oscillator.frequency.value = 700;

    }

    else if(type === "wrong"){

      oscillator.frequency.value = 170;

    }

    else if(type === "win"){

      oscillator.frequency.value = 900;

    }

    else{

      oscillator.frequency.value = 400;

    }


    gain.gain.setValueAtTime(
      .08,
      audioContext.currentTime
    );

    gain.gain.exponentialRampToValueAtTime(
      .001,
      audioContext.currentTime + .25
    );


    oscillator.start();

    oscillator.stop(
      audioContext.currentTime + .25
    );

  }

  catch(error){

    /* Audio may be blocked by browser. */

  }

}


/* =====================================================
   CREATE THE COMPLETE PANDA IMAGE
===================================================== */

function drawPanda(){

  targetCanvas.width = SIZE;
  targetCanvas.height = SIZE;

  const ctx = targetCtx;

  ctx.clearRect(
    0,
    0,
    SIZE,
    SIZE
  );


  /* ===============================
     SKY
  =============================== */

  const sky =
    ctx.createLinearGradient(
      0,
      0,
      0,
      SIZE
    );

  sky.addColorStop(
    0,
    "#9ee5ff"
  );

  sky.addColorStop(
    .58,
    "#d9f7ff"
  );

  sky.addColorStop(
    .58,
    "#8bd36b"
  );

  sky.addColorStop(
    1,
    "#63b94e"
  );

  ctx.fillStyle = sky;

  ctx.fillRect(
    0,
    0,
    SIZE,
    SIZE
  );


  /* ===============================
     CLOUDS
  =============================== */

  drawCloud(
    ctx,
    130,
    130,
    1
  );

  drawCloud(
    ctx,
    690,
    150,
    .8
  );


  /* ===============================
     SMALL HILLS
  =============================== */

  ctx.fillStyle =
    "#5fb84d";

  ctx.beginPath();

  ctx.moveTo(
    0,
    650
  );

  ctx.quadraticCurveTo(
    200,
    540,
    390,
    650
  );

  ctx.quadraticCurveTo(
    620,
    520,
    900,
    640
  );

  ctx.lineTo(
    900,
    900
  );

  ctx.lineTo(
    0,
    900
  );

  ctx.closePath();

  ctx.fill();


  /* ===============================
     PANDA EARS
  =============================== */

  ctx.fillStyle =
    "#111";

  ctx.beginPath();

  ctx.arc(
    325,
    255,
    90,
    0,
    Math.PI * 2
  );

  ctx.fill();


  ctx.beginPath();

  ctx.arc(
    575,
    255,
    90,
    0,
    Math.PI * 2
  );

  ctx.fill();


  /* ===============================
     PANDA BODY
  =============================== */

  ctx.fillStyle =
    "#111";

  ctx.beginPath();

  ctx.ellipse(
    450,
    690,
    185,
    205,
    0,
    0,
    Math.PI * 2
  );

  ctx.fill();


  /* ===============================
     BELLY
  =============================== */

  ctx.fillStyle =
    "#fff";

  ctx.beginPath();

  ctx.ellipse(
    450,
    700,
    115,
    135,
    0,
    0,
    Math.PI * 2
  );

  ctx.fill();


  /* ===============================
     ARMS
  =============================== */

  ctx.fillStyle =
    "#111";

  ctx.save();

  ctx.translate(
    285,
    670
  );

  ctx.rotate(
    .45
  );

  ctx.beginPath();

  ctx.ellipse(
    0,
    0,
    70,
    145,
    0,
    0,
    Math.PI * 2
  );

  ctx.fill();

  ctx.restore();


  ctx.save();

  ctx.translate(
    615,
    670
  );

  ctx.rotate(
    -.45
  );

  ctx.beginPath();

  ctx.ellipse(
    0,
    0,
    70,
    145,
    0,
    0,
    Math.PI * 2
  );

  ctx.fill();

  ctx.restore();


  /* ===============================
     HEAD
  =============================== */

  ctx.fillStyle =
    "#fff";

  ctx.strokeStyle =
    "#111";

  ctx.lineWidth =
    10;

  ctx.beginPath();

  ctx.ellipse(
    450,
    410,
    245,
    215,
    0,
    0,
    Math.PI * 2
  );

  ctx.fill();

  ctx.stroke();


  /* ===============================
     EYE PATCHES
  =============================== */

  ctx.fillStyle =
    "#111";

  ctx.save();

  ctx.translate(
    355,
    390
  );

  ctx.rotate(
    -.35
  );

  ctx.beginPath();

  ctx.ellipse(
    0,
    0,
    62,
    90,
    0,
    0,
    Math.PI * 2
  );

  ctx.fill();

  ctx.restore();


  ctx.save();

  ctx.translate(
    545,
    390
  );

  ctx.rotate(
    .35
  );

  ctx.beginPath();

  ctx.ellipse(
    0,
    0,
    62,
    90,
    0,
    0,
    Math.PI * 2
  );

  ctx.fill();

  ctx.restore();


  /* ===============================
     EYES
  =============================== */

  ctx.fillStyle =
    "#fff";

  ctx.beginPath();

  ctx.arc(
    355,
    390,
    28,
    0,
    Math.PI * 2
  );

  ctx.fill();


  ctx.beginPath();

  ctx.arc(
    545,
    390,
    28,
    0,
    Math.PI * 2
  );

  ctx.fill();


  ctx.fillStyle =
    "#111";

  ctx.beginPath();

  ctx.arc(
    355,
    390,
    15,
    0,
    Math.PI * 2
  );

  ctx.fill();


  ctx.beginPath();

  ctx.arc(
    545,
    390,
    15,
    0,
    Math.PI * 2
  );

  ctx.fill();


  /* ===============================
     NOSE
  =============================== */

  ctx.fillStyle =
    "#111";

  ctx.beginPath();

  ctx.ellipse(
    450,
    465,
    35,
    25,
    0,
    0,
    Math.PI * 2
  );

  ctx.fill();


  /* ===============================
     MOUTH
  =============================== */

  ctx.strokeStyle =
    "#111";

  ctx.lineWidth =
    9;

  ctx.beginPath();

  ctx.arc(
    450,
    490,
    50,
    0,
    Math.PI
  );

  ctx.stroke();


  /* ===============================
     CHEEKS
  =============================== */

  ctx.fillStyle =
    "rgba(255,150,150,.35)";

  ctx.beginPath();

  ctx.arc(
    315,
    475,
    32,
    0,
    Math.PI * 2
  );

  ctx.fill();


  ctx.beginPath();

  ctx.arc(
    585,
    475,
    32,
    0,
    Math.PI * 2
  );

  ctx.fill();


  /* ===============================
     BAMBOO
  =============================== */

  ctx.strokeStyle =
    "#347a32";

  ctx.lineWidth =
    18;

  ctx.beginPath();

  ctx.moveTo(
    780,
    850
  );

  ctx.lineTo(
    800,
    470
  );

  ctx.stroke();


  ctx.lineWidth =
    8;

  for(
    let y=520;
    y<820;
    y+=75
  ){

    ctx.beginPath();

    ctx.moveTo(
      770,
      y
    );

    ctx.lineTo(
      820,
      y
    );

    ctx.stroke();

  }

}


/* =====================================================
   CLOUD
===================================================== */

function drawCloud(
  ctx,
  x,
  y,
  scale
){

  ctx.save();

  ctx.translate(
    x,
    y
  );

  ctx.scale(
    scale,
    scale
  );

  ctx.fillStyle =
    "rgba(255,255,255,.8)";


  ctx.beginPath();

  ctx.arc(
    0,
    20,
    45,
    0,
    Math.PI*2
  );

  ctx.arc(
    50,
    0,
    60,
    0,
    Math.PI*2
  );

  ctx.arc(
    105,
    20,
    45,
    0,
    Math.PI*2
  );

  ctx.fill();

  ctx.restore();

}


/* =====================================================
   GET PUZZLE PIECE IMAGE
===================================================== */

function createPieceCanvas(index){

  const canvas =
    document.createElement("canvas");

  const ctx =
    canvas.getContext("2d");

  /*
    Each piece has a square canvas.

    Extra space allows the jigsaw
    tabs to be visible.
  */

  canvas.width =
    330;

  canvas.height =
    330;


  const cell =
    SIZE / 3;


  const col =
    index % 3;

  const row =
    Math.floor(index / 3);


  /*
    Source position.
  */

  const sx =
    col * cell;

  const sy =
    row * cell;


  /*
    Draw the exact same panda
    image into the piece.
  */

  ctx.drawImage(
    targetCanvas,

    sx,
    sy,
    cell,
    cell,

    0,
    0,
    330,
    330
  );


  /*
    Add jigsaw-style edge lines.

    The picture itself remains
    continuous when pieces are
    placed together.
  */

  ctx.strokeStyle =
    "#111";

  ctx.lineWidth =
    7;

  ctx.strokeRect(
    4,
    4,
    322,
    322
  );


  /*
    Highlight.
  */

  ctx.strokeStyle =
    "rgba(255,255,255,.45)";

  ctx.lineWidth =
    3;

  ctx.strokeRect(
    9,
    9,
    312,
    312
  );


  return canvas;
}


/* =====================================================
   SHUFFLE
===================================================== */

function shuffle(array){

  for(
    let i=array.length-1;
    i>0;
    i--
  ){

    const j =
      Math.floor(
        Math.random()*(i+1)
      );

    [
      array[i],
      array[j]
    ]=[
      array[j],
      array[i]
    ];

  }

  return array;
}


/* =====================================================
   CREATE ALL PUZZLE PIECES
===================================================== */

function createPieces(){

  piecesContainer.innerHTML="";

  const order =
    shuffle([
      0,1,2,
      3,4,5,
      6,7,8
    ]);


  order.forEach(index=>{

    const piece =
      document.createElement("div");

    piece.className =
      "piece";

    piece.dataset.correct =
      index;


    const canvas =
      createPieceCanvas(index);

    canvas.className =
      "pieceCanvas";


    piece.appendChild(
      canvas
    );


    addDragEvents(
      piece
    );


    piecesContainer.appendChild(
      piece
    );

  });

}


/* =====================================================
   DRAG SYSTEM
===================================================== */

function addDragEvents(piece){

  let dragging=false;

  let startX=0;

  let startY=0;


  piece.addEventListener(
    "pointerdown",
    e=>{

      if(
        piece.dataset.locked==="true"
      ){

        return;

      }


      e.preventDefault();


      dragging=true;


      startX =
        e.clientX;

      startY =
        e.clientY;


      piece.setPointerCapture(
        e.pointerId
      );


      piece.style.zIndex =
        200;


      if(!started){

        started=true;

        startTimer();

      }

    }
  );


  piece.addEventListener(
    "pointermove",
    e=>{

      if(!dragging)return;


      const dx =
        e.clientX-startX;

      const dy =
        e.clientY-startY;


      piece.style.transform =
        `translate(${dx}px,${dy}px)
         scale(1.06)`;

    }
  );


  piece.addEventListener(
    "pointerup",
    e=>{

      if(!dragging)return;


      dragging=false;


      piece.style.transform =
        "";


      piece.style.zIndex =
        10;


      moves++;

      movesText.textContent =
        moves;


      checkDrop(
        piece
      );

    }
  );


  piece.addEventListener(
    "pointercancel",
    ()=>{
      dragging=false;
      piece.style.transform="";
      piece.style.zIndex=10;
    }
  );

}


/* =====================================================
   CHECK DROP POSITION
===================================================== */

function checkDrop(piece){

  const boardRect =
    board.getBoundingClientRect();


  const pieceRect =
    piece.getBoundingClientRect();


  const centerX =
    pieceRect.left +
    pieceRect.width/2;


  const centerY =
    pieceRect.top +
    pieceRect.height/2;


  const x =
    centerX -
    boardRect.left;


  const y =
    centerY -
    boardRect.top;


  /*
    Require the piece center
    to be inside the board.
  */

  if(
    x<0 ||
    y<0 ||
    x>boardRect.width ||
    y>boardRect.height
  ){

    wrongPiece(piece);

    return;

  }


  const col =
    Math.floor(
      x /
      (boardRect.width/3)
    );


  const row =
    Math.floor(
      y /
      (boardRect.height/3)
    );


  const target =
    row*3+col;


  const correct =
    Number(
      piece.dataset.correct
    );


  if(target===correct){

    placeCorrectPiece(
      piece,
      target
    );

  }

  else{

    wrongPiece(
      piece
    );

  }

}


/* =====================================================
   PLACE CORRECT PIECE
===================================================== */

function placeCorrectPiece(
  piece,
  target
){

  /*
    The piece is moved into
    the exact target cell.
  */

  const cellSize =
    100/3;


  piece.dataset.locked =
    "true";


  piece.style.position =
    "absolute";


  piece.style.width =
    cellSize+"%";


  piece.style.height =
    cellSize+"%";


  piece.style.left =
    ((target%3)*cellSize)+"%";


  piece.style.top =
    (Math.floor(target/3)*cellSize)+"%";


  piece.style.margin =
    "0";


  piece.style.transform =
    "scale(1)";


  piece.style.cursor =
    "default";


  piece.style.zIndex =
    5;


  board.appendChild(
    piece
  );


  /*
    Mark target.
  */

  const cell =
    document.getElementById(
      "cell"+target
    );

  cell.classList.add(
    "correct"
  );


  completed++;


  playSound(
    "correct"
  );


  message.textContent =
    "✅ Correct piece!";


  /*
    Update score.
  */

  updateScore();


  /*
    Finished?
  */

  if(
    completed===9
  ){

    finishGame();

  }

}


/* =====================================================
   WRONG PIECE
===================================================== */

function wrongPiece(piece){

  piece.classList.remove(
    "shake"
  );


  void piece.offsetWidth;


  piece.classList.add(
    "shake"
  );


  playSound(
    "wrong"
  );


  message.textContent =
    "❌ Wrong place — try again!";

}


/* =====================================================
   SCORE
===================================================== */

function updateScore(){

  const score =
    Math.max(
      10,
      100 -
      (moves*2) -
      Math.floor(
        seconds/5
      )
    );


  scoreText.textContent =
    score;

}


/* =====================================================
   TIMER
===================================================== */

function startTimer(){

  if(timer)return;


  timer =
    setInterval(()=>{

      seconds++;


      timerText.textContent =
        seconds;


      updateScore();


    },1000);

}


/* =====================================================
   FINISH
===================================================== */

function finishGame(){

  clearInterval(
    timer
  );

  timer=null;

  started=false;


  targetCanvas.classList.add(
    "show"
  );


  board.classList.add(
    "winBoard"
  );


  const finalScore =
    Math.max(
      10,
      100 -
      (moves*2) -
      Math.floor(
        seconds/5
      )
    );


  scoreText.textContent =
    finalScore;


  message.innerHTML =
    `🎉 AMAZING!<br>
     🐼 Picture Complete!<br>
     <span style="font-size:16px">
     Time: ${seconds}s
     &nbsp; | &nbsp;
     Moves: ${moves}
     &nbsp; | &nbsp;
     Score: ${finalScore}
     </span>`;


  message.classList.add(
    "win"
  );


  playSound(
    "win"
  );

}


/* =====================================================
   NEW GAME
===================================================== */

function newGame(){

  clearInterval(
    timer
  );

  timer=null;


  moves=0;

  seconds=0;

  completed=0;

  started=false;


  timerText.textContent =
    "0";

  movesText.textContent =
    "0";

  scoreText.textContent =
    "100";


  message.className="";

  message.textContent =
    "Drag the pieces into the black frame.";


  board.classList.remove(
    "winBoard"
  );


  targetCanvas.classList.remove(
    "show"
  );


  /*
    Remove pieces that were
    already placed on board.
  */

  document
    .querySelectorAll(
      "#board .piece"
    )
    .forEach(
      p=>p.remove()
    );


  /*
    Reset target cells.
  */

  document
    .querySelectorAll(
      ".targetCell"
    )
    .forEach(
      cell=>{
        cell.classList.remove(
          "correct"
        );
      }
    );


  createPieces();

}


/* =====================================================
   START GAME
===================================================== */

drawPanda();

createPieces();

</script>

</body>
</html>
