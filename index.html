<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>Complete the Pic V2.2</title>

<style>

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  padding:0;
  width:100%;
  min-height:100%;
  font-family:Arial,sans-serif;
  background:linear-gradient(
    180deg,
    #eef8ff,
    #ffffff
  );
  color:#222;
  overflow-x:hidden;
}

body{
  text-align:center;
}

h1{
  margin:15px 0 3px;
  font-size:28px;
}

.subtitle{
  margin:0 0 12px;
  color:#666;
  font-size:15px;
}

#info{
  display:flex;
  justify-content:center;
  gap:8px;
  flex-wrap:wrap;
  margin:8px auto 14px;
}

.infoBox{
  background:#fff;
  border:1px solid #ddd;
  border-radius:12px;
  padding:8px 14px;
  min-width:82px;
  box-shadow:0 2px 8px rgba(0,0,0,.06);
}

.infoTitle{
  font-size:11px;
  color:#888;
}

.infoValue{
  font-size:18px;
  font-weight:bold;
  margin-top:2px;
}

#gameArea{
  width:100%;
  max-width:620px;
  margin:auto;
  padding:0 12px 30px;
}

/* =========================
   FRAME
========================= */

#frameTitle{
  font-size:14px;
  color:#777;
  margin-bottom:7px;
}

#boardWrap{

  width:min(92vw,500px);

  aspect-ratio:1/1;

  margin:auto;

  position:relative;

  background:#fff;

  /* LIGHT FRAME */
  border:4px solid #b8bec4;

  border-radius:10px;

  overflow:visible;

  box-shadow:
    0 3px 12px rgba(0,0,0,.08);
}

#board{

  width:100%;
  height:100%;

  display:block;

  border-radius:5px;

  background:#fff;
}

/* Target grid */

.targetGrid{

  position:absolute;

  inset:0;

  display:grid;

  grid-template-columns:
    repeat(3,1fr);

  grid-template-rows:
    repeat(3,1fr);

  pointer-events:none;
}

.targetCell{

  border:
    1px dashed
    rgba(100,110,120,.22);

  background:
    rgba(255,255,255,.04);
}

/* =========================
   INSTRUCTION
========================= */

#instruction{

  margin:12px auto 8px;

  width:min(92vw,500px);

  padding:10px;

  border-radius:10px;

  background:#fff;

  border:1px solid #e1e1e1;

  color:#666;

  font-size:14px;
}

/* =========================
   PIECES
========================= */

#piecesTitle{

  margin:16px 0 8px;

  font-size:16px;

  font-weight:bold;
}

#piecesArea{

  width:min(94vw,600px);

  min-height:230px;

  margin:auto;

  padding:12px;

  background:rgba(255,255,255,.95);

  border:1px solid #ddd;

  border-radius:14px;

  display:flex;

  flex-wrap:wrap;

  justify-content:center;

  align-items:center;

  gap:10px;

  position:relative;
}

/* Individual piece */

.piece{

  position:relative;

  width:92px;
  height:92px;

  border:
    2px solid #999;

  border-radius:6px;

  background:#fff;

  box-shadow:
    0 3px 8px rgba(0,0,0,.16);

  touch-action:none;

  user-select:none;

  -webkit-user-select:none;

  cursor:grab;

  z-index:10;

  flex-shrink:0;
}

.piece canvas{

  width:100%;
  height:100%;

  display:block;

  border-radius:4px;

  pointer-events:none;
}

/* While dragging */

.piece.dragging{

  cursor:grabbing;

  transform:scale(1.06);

  box-shadow:
    0 12px 28px
    rgba(0,0,0,.30);

  z-index:99999;
}

/* Wrong piece */

.piece.wrong{

  animation:
    shake .35s ease;
}

@keyframes shake{

  0%{
    transform:translateX(0);
  }

  20%{
    transform:translateX(-10px);
  }

  40%{
    transform:translateX(10px);
  }

  60%{
    transform:translateX(-8px);
  }

  80%{
    transform:translateX(8px);
  }

  100%{
    transform:translateX(0);
  }
}

/* Locked piece */

.piece.locked{

  position:fixed !important;

  margin:0;

  padding:0;

  border:
    1px solid
    rgba(0,0,0,.12);

  box-shadow:none;

  cursor:default;

  pointer-events:none;

  z-index:500;
}

/* =========================
   BUTTON
========================= */

button{

  border:0;

  border-radius:12px;

  padding:12px 22px;

  background:#222;

  color:white;

  font-size:16px;

  font-weight:bold;

  cursor:pointer;

  box-shadow:
    0 3px 8px
    rgba(0,0,0,.15);
}

button:active{

  transform:scale(.96);
}

#newGameBtn{

  margin-top:14px;
}

/* =========================
   WIN SCREEN
========================= */

#winScreen{

  position:fixed;

  inset:0;

  background:
    rgba(0,0,0,.55);

  display:none;

  align-items:center;

  justify-content:center;

  z-index:100000;
}

#winBox{

  width:min(88vw,380px);

  background:#fff;

  border-radius:20px;

  padding:28px 20px;

  box-shadow:
    0 15px 45px
    rgba(0,0,0,.35);

  animation:
    pop .35s ease;
}

@keyframes pop{

  0%{
    transform:scale(.6);
    opacity:0;
  }

  100%{
    transform:scale(1);
    opacity:1;
  }
}

#winEmoji{

  font-size:55px;
}

#winBox h2{

  margin:8px 0;

  font-size:27px;
}

#winMessage{

  color:#666;

  line-height:1.5;
}

#finalScore{

  font-size:22px;

  font-weight:bold;

  margin:12px 0;
}

/* =========================
   CONFETTI
========================= */

.confetti{

  position:fixed;

  width:9px;

  height:14px;

  z-index:100001;

  pointer-events:none;

  animation:
    fall 2s linear forwards;
}

@keyframes fall{

  from{

    transform:
      translateY(-20px)
      rotate(0deg);

    opacity:1;
  }

  to{

    transform:
      translateY(100vh)
      rotate(720deg);

    opacity:0;
  }
}

/* =========================
   MOBILE
========================= */

@media(max-width:400px){

  h1{
    font-size:24px;
  }

  .piece{

    width:80px;
    height:80px;
  }

  #piecesArea{

    min-height:210px;

    gap:7px;

    padding:8px;
  }
}

</style>
</head>


<body>

<h1>🧩 Complete the Pic</h1>

<div class="subtitle">
  Pick the pieces. Complete the picture!
</div>


<!-- =========================
     GAME INFORMATION
========================= -->

<div id="info">

  <div class="infoBox">

    <div class="infoTitle">
      TIME
    </div>

    <div
      class="infoValue"
      id="timer">
      00:00
    </div>

  </div>


  <div class="infoBox">

    <div class="infoTitle">
      MOVES
    </div>

    <div
      class="infoValue"
      id="moves">
      0
    </div>

  </div>


  <div class="infoBox">

    <div class="infoTitle">
      SCORE
    </div>

    <div
      class="infoValue"
      id="score">
      100
    </div>

  </div>

</div>


<div id="gameArea">


  <!-- =========================
       PANDA FRAME
  ========================= -->

  <div id="frameTitle">
    🐼 Complete the Panda
  </div>


  <div id="boardWrap">

    <canvas id="board"></canvas>


    <div class="targetGrid">

      <div class="targetCell"></div>
      <div class="targetCell"></div>
      <div class="targetCell"></div>

      <div class="targetCell"></div>
      <div class="targetCell"></div>
      <div class="targetCell"></div>

      <div class="targetCell"></div>
      <div class="targetCell"></div>
      <div class="targetCell"></div>

    </div>

  </div>

    👆 Drag any piece
    <b>across the frame</b>
    and drop it near its matching position.

  <div id="piecesTitle">
    🧩 Puzzle Pieces
  </div>


  <div id="piecesArea"></div>

  </button>

<!-- =========================
     WIN SCREEN
========================= -->

<div id="winScreen">

  <div id="winBox">

    <div id="winEmoji">
      🎉🐼🎉
    </div>

    <h2>
      Picture Complete!
    </h2>

    <div id="winMessage">

      Great job!
      You completed the Panda.

    </div>

    <div id="finalScore">
      Score: 100
    </div>

    <button id="playAgainBtn">
      ▶ Play Again
    </button>

  </div>

</div>


<script>

/* =====================================================
   COMPLETE THE PIC V2.2
   ===================================================== */


/* =========================
   PANDA IMAGE
========================= */

const pandaImage =
  new Image();

pandaImage.src =
  "panda.png";

let imageReady =
  false;


/* =========================
   HTML ELEMENTS
========================= */

const board =
  document.getElementById(
    "board"
  );

const boardWrap =
  document.getElementById(
    "boardWrap"
  );

const piecesArea =
  document.getElementById(
    "piecesArea"
  );

const timerElement =
  document.getElementById(
    "timer"
  );

const movesElement =
  document.getElementById(
    "moves"
  );

const scoreElement =
  document.getElementById(
    "score"
  );

const winScreen =
  document.getElementById(
    "winScreen"
  );

const finalScore =
  document.getElementById(
    "finalScore"
  );

const newGameBtn =
  document.getElementById(
    "newGameBtn"
  );

const playAgainBtn =
  document.getElementById(
    "playAgainBtn"
  );

const boardCtx =
  board.getContext("2d");


/* =========================
   GAME VARIABLES
========================= */

const GRID = 3;

let pieces = [];

let lockedCount = 0;

let moves = 0;

let seconds = 0;

let timerInterval = null;

let gameStarted = false;

let draggingPiece = null;

let dragOffsetX = 0;

let dragOffsetY = 0;


/* =========================
   IMAGE LOADED
========================= */

pandaImage.onload =
  function(){

    imageReady = true;

    drawBoard();

    createNewPuzzle();

  };


pandaImage.onerror =
  function(){

    alert(
      "panda.png was not found.\n\n" +
      "Please make sure panda.png " +
      "is uploaded in the SAME folder " +
      "as index.html."
    );

  };


/* =====================================================
   BOARD
===================================================== */

function resizeBoard(){

  const rect =
    board.getBoundingClientRect();

  const dpr =
    window.devicePixelRatio || 1;

  board.width =
    Math.round(
      rect.width * dpr
    );

  board.height =
    Math.round(
      rect.height * dpr
    );

  boardCtx.setTransform(
    dpr,
    0,
    0,
    dpr,
    0,
    0
  );

}


function drawBoard(){

  if(!imageReady)
    return;


  resizeBoard();


  const rect =
    board.getBoundingClientRect();

  const w =
    rect.width;

  const h =
    rect.height;


  /*
    IMPORTANT:
    Clear the entire canvas first.
  */

  boardCtx.clearRect(
    0,
    0,
    w,
    h
  );


  /*
    WHITE BACKGROUND
  */

  boardCtx.fillStyle =
    "#ffffff";

  boardCtx.fillRect(
    0,
    0,
    w,
    h
  );


  /*
    FAINT PANDA GUIDE
  */

  boardCtx.globalAlpha =
    0.12;

  boardCtx.drawImage(
    pandaImage,
    0,
    0,
    w,
    h
  );

  boardCtx.globalAlpha =
    1;

}


/* =====================================================
   CREATE NEW PUZZLE
===================================================== */

function createNewPuzzle(){

  /*
    Stop old timer
  */

  stopTimer();


  /*
    Reset game values
  */

  seconds = 0;

  moves = 0;

  lockedCount = 0;

  gameStarted = false;

  draggingPiece = null;


  /*
    Hide winning screen
  */

  winScreen.style.display =
    "none";


  /*
    IMPORTANT:
    Remove ALL old pieces,
    including pieces that were
    locked and moved to BODY.
  */

  document
    .querySelectorAll(".piece")
    .forEach(
      function(piece){

        piece.remove();

      }
    );


  /*
    Empty the pieces area.
  */

  piecesArea.innerHTML =
    "";


  /*
    Reset information.
  */

  updateTimer();

  updateStats();


  /*
    Redraw Panda background.
  */

  drawBoard();


  /*
    Create 9 fresh pieces.
  */

  createPieces();

}


/* =====================================================
   CREATE 9 PIECES
===================================================== */

function createPieces(){

  if(!imageReady)
    return;


  /*
    Make absolutely sure
    pieces area is empty.
  */

  piecesArea.innerHTML =
    "";


  pieces = [];


  const sourceW =
    pandaImage.naturalWidth;

  const sourceH =
    pandaImage.naturalHeight;


  const cropW =
    sourceW / GRID;

  const cropH =
    sourceH / GRID;


  /*
    Create positions.
  */

  let positions = [];


  for(
    let row = 0;
    row < GRID;
    row++
  ){

    for(
      let col = 0;
      col < GRID;
      col++
    ){

      positions.push({

        row:row,

        col:col,

        index:
          row * GRID + col

      });

    }

  }


  /*
    Shuffle pieces.
  */

  for(
    let i =
      positions.length - 1;

    i > 0;

    i--
  ){

    const j =
      Math.floor(
        Math.random() *
        (i + 1)
      );


    [
      positions[i],
      positions[j]
    ] =
    [
      positions[j],
      positions[i]
    ];

  }


  /*
    Create each piece.
  */

  positions.forEach(
    function(pos){

      const piece =
        document.createElement(
          "div"
        );


      piece.className =
        "piece";


      piece.dataset.row =
        pos.row;


      piece.dataset.col =
        pos.col;


      piece.dataset.index =
        pos.index;


      /*
        Create canvas for piece.
      */

      const canvas =
        document.createElement(
          "canvas"
        );


      canvas.width =
        300;

      canvas.height =
        300;


      const ctx =
        canvas.getContext(
          "2d"
        );


      /*
        Crop EXACTLY from
        panda.png.
      */

      ctx.drawImage(

        pandaImage,

        pos.col * cropW,

        pos.row * cropH,

        cropW,

        cropH,

        0,

        0,

        300,

        300

      );


      piece.appendChild(
        canvas
      );


      /*
        Put piece into pieces area.
      */

      piecesArea.appendChild(
        piece
      );


      /*
        Enable dragging.
      */

      setupDragging(
        piece
      );


      pieces.push(
        piece
      );

    }
  );

}


/* =====================================================
   DRAGGING
===================================================== */

function setupDragging(piece){

  piece.addEventListener(
    "pointerdown",
    startDrag
  );

}


function startDrag(e){

  e.preventDefault();

  if(
    this.classList.contains(
      "locked"
    )
  ){

    return;

  }


  /*
    Start timer with
    first touch.
  */

  if(!gameStarted){

    startTimer();

  }


  const piece =
    this;


  draggingPiece =
    piece;


  /*
    Get original screen position.
  */

  const rect =
    piece.getBoundingClientRect();


  dragOffsetX =
    e.clientX -
    rect.left;


  dragOffsetY =
    e.clientY -
    rect.top;


  /*
    =================================================
    MAIN FIX
    =================================================

    Move piece to BODY.

    It is NO LONGER trapped
    inside piecesArea.

    Therefore it can cross
    the frame boundary.
    */

  document.body.appendChild(
    piece
  );


  piece.style.position =
    "fixed";


  piece.style.width =
    rect.width + "px";


  piece.style.height =
    rect.height + "px";


  piece.style.left =
    rect.left + "px";


  piece.style.top =
    rect.top + "px";


  piece.style.margin =
    "0";


  piece.style.zIndex =
    "99999";


  piece.classList.add(
    "dragging"
  );


  try{

    piece.setPointerCapture(
      e.pointerId
    );

  }catch(error){}


  piece.addEventListener(
    "pointermove",
    dragMove
  );


  piece.addEventListener(
    "pointerup",
    endDrag
  );


  piece.addEventListener(
    "pointercancel",
    cancelDrag
  );

}


/* =====================================================
   MOVE PIECE
===================================================== */

function dragMove(e){

  e.preventDefault();


  if(!draggingPiece)
    return;


  /*
    NO BOUNDARY LIMIT.

    The piece can move
    anywhere on the screen.
  */

  draggingPiece.style.left =
    (
      e.clientX -
      dragOffsetX
    ) + "px";


  draggingPiece.style.top =
    (
      e.clientY -
      dragOffsetY
    ) + "px";

}


/* =====================================================
   DROP
===================================================== */

function endDrag(e){

  e.preventDefault();


  if(!draggingPiece)
    return;


  const piece =
    draggingPiece;


  piece.removeEventListener(
    "pointermove",
    dragMove
  );


  piece.removeEventListener(
    "pointerup",
    endDrag
  );


  piece.removeEventListener(
    "pointercancel",
    cancelDrag
  );


  checkDrop(
    piece
  );


  draggingPiece =
    null;

}


/* =====================================================
   CANCEL
===================================================== */

function cancelDrag(){

  if(!draggingPiece)
    return;


  returnPiece(
    draggingPiece
  );


  draggingPiece =
    null;

}


/* =====================================================
   CHECK DROP
===================================================== */

function checkDrop(piece){

  const boardRect =
    board.getBoundingClientRect();


  const pieceRect =
    piece.getBoundingClientRect();


  /*
    Piece center.
  */

  const pieceCenterX =
    pieceRect.left +
    pieceRect.width / 2;


  const pieceCenterY =
    pieceRect.top +
    pieceRect.height / 2;


  /*
    Cell size.
  */

  const cellW =
    boardRect.width / GRID;

  const cellH =
    boardRect.height / GRID;


  /*
    Correct location.
  */

  const correctRow =
    Number(
      piece.dataset.row
    );


  const correctCol =
    Number(
      piece.dataset.col
    );


  /*
    Correct cell center.
  */

  const targetX =
    boardRect.left +
    correctCol * cellW +
    cellW / 2;


  const targetY =
    boardRect.top +
    correctRow * cellH +
    cellH / 2;


  /*
    Distance.
  */

  const dx =
    pieceCenterX -
    targetX;


  const dy =
    pieceCenterY -
    targetY;


  const distance =
    Math.sqrt(
      dx * dx +
      dy * dy
    );


  /*
    VERY EASY DROP.

    User can drop quite far
    from exact center.
  */

  const tolerance =
    Math.min(
      cellW,
      cellH
    ) * 0.95;


  /*
    Also make sure piece is
    reasonably over the frame.
  */

  const insideFrame =

    pieceCenterX >=
      boardRect.left -
      cellW * 0.35 &&

    pieceCenterX <=
      boardRect.right +
      cellW * 0.35 &&

    pieceCenterY >=
      boardRect.top -
      cellH * 0.35 &&

    pieceCenterY <=
      boardRect.bottom +
      cellH * 0.35;


  if(
    insideFrame &&
    distance <= tolerance
  ){

    lockPiece(
      piece,
      correctRow,
      correctCol
    );

  }else{

    wrongPlacement(
      piece
    );

  }

}


/* =====================================================
   LOCK PIECE
===================================================== */

function lockPiece(
  piece,
  row,
  col
){

  const boardRect =
    board.getBoundingClientRect();


  const cellW =
    boardRect.width / GRID;

  const cellH =
    boardRect.height / GRID;


  piece.classList.remove(
    "dragging"
  );


  piece.classList.add(
    "locked"
  );


  piece.style.position =
    "fixed";


  piece.style.width =
    cellW + "px";


  piece.style.height =
    cellH + "px";


  piece.style.left =
    (
      boardRect.left +
      col * cellW
    ) + "px";


  piece.style.top =
    (
      boardRect.top +
      row * cellH
    ) + "px";


  piece.style.zIndex =
    "500";


  lockedCount++;

  moves++;


  updateStats();


  correctSound();

  vibrate(40);


  /*
    Check completed picture.
  */

  if(
    lockedCount ===
    GRID * GRID
  ){

    finishGame();

  }

}


/* =====================================================
   WRONG PIECE
===================================================== */

function wrongPlacement(piece){

  moves++;

  updateStats();


  wrongSound();

  vibrate(100);


  piece.classList.remove(
    "dragging"
  );


  piece.classList.add(
    "wrong"
  );


  setTimeout(
    function(){

      piece.classList.remove(
        "wrong"
      );


      returnPiece(
        piece
      );

    },
    350
  );

}


/* =====================================================
   RETURN PIECE
===================================================== */

function returnPiece(piece){

  if(
    piece.classList.contains(
      "locked"
    )
  ){

    return;

  }


  /*
    Put piece back into
    puzzle pieces area.
  */

  piecesArea.appendChild(
    piece
  );


  piece.style.position =
    "relative";


  piece.style.left =
    "";


  piece.style.top =
    "";


  piece.style.width =
    "";


  piece.style.height =
    "";


  piece.style.margin =
    "";


  piece.style.zIndex =
    "10";


  piece.style.transform =
    "";


  piece.classList.remove(
    "dragging"
  );

}


/* =====================================================
   TIMER
===================================================== */

function startTimer(){

  if(gameStarted)
    return;


  gameStarted =
    true;


  timerInterval =
    setInterval(
      function(){

        seconds++;

        updateTimer();

        updateScore();

      },
      1000
    );

}


function stopTimer(){

  if(
    timerInterval
  ){

    clearInterval(
      timerInterval
    );

  }


  timerInterval =
    null;

}


function updateTimer(){

  const minutes =
    Math.floor(
      seconds / 60
    );


  const secs =
    seconds % 60;


  timerElement.textContent =

    String(
      minutes
    ).padStart(2,"0")

    +

    ":"

    +

    String(
      secs
    ).padStart(2,"0");

}


/* =====================================================
   SCORE
===================================================== */

function calculateScore(){

  return Math.max(

    0,

    100 -

    moves * 2 -

    Math.floor(
      seconds / 5
    )

  );

}


function updateScore(){

  scoreElement.textContent =
    calculateScore();

}


function updateStats(){

  movesElement.textContent =
    moves;

  updateScore();

}


/* =====================================================
   WIN
===================================================== */

function finishGame(){

  stopTimer();

  gameStarted =
    false;


  const final =
    calculateScore();


  finalScore.textContent =
    "Score: " + final;


  saveBest(
    final,
    seconds
  );


  setTimeout(
    function(){

      winScreen.style.display =
        "flex";

      confetti();

    },
    400
  );

}


/* =====================================================
   BEST SCORE
===================================================== */

function saveBest(
  score,
  time
){

  const oldScore =
    Number(
      localStorage.getItem(
        "completePic_v22_bestScore"
      ) || 0
    );


  const oldTime =
    Number(
      localStorage.getItem(
        "completePic_v22_bestTime"
      ) || 999999
    );


  if(
    score > oldScore
  ){

    localStorage.setItem(
      "completePic_v22_bestScore",
      score
    );

  }


  if(
    time < oldTime
  ){

    localStorage.setItem(
      "completePic_v22_bestTime",
      time
    );

  }

}


/* =====================================================
   SOUND
===================================================== */

let audioContext =
  null;


function getAudio(){

  if(!audioContext){

    try{

      audioContext =
        new (
          window.AudioContext ||
          window.webkitAudioContext
        )();

    }catch(error){}

  }

  return audioContext;

}


function beep(
  frequency,
  duration,
  type="sine"
){

  const ctx =
    getAudio();


  if(!ctx)
    return;


  try{

    const oscillator =
      ctx.createOscillator();


    const gain =
      ctx.createGain();


    oscillator.type =
      type;


    oscillator.frequency.value =
      frequency;


    gain.gain.setValueAtTime(
      .0001,
      ctx.currentTime
    );


    gain.gain.exponentialRampToValueAtTime(
      .12,
      ctx.currentTime + .02
    );


    gain.gain.exponentialRampToValueAtTime(
      .0001,
      ctx.currentTime + duration
    );


    oscillator.connect(
      gain
    );


    gain.connect(
      ctx.destination
    );


    oscillator.start();


    oscillator.stop(
      ctx.currentTime +
      duration
    );

  }catch(error){}

}


function correctSound(){

  beep(
    700,
    .12,
    "sine"
  );


  setTimeout(
    function(){

      beep(
        950,
        .16,
        "sine"
      );

    },
    100
  );

}


function wrongSound(){

  beep(
    170,
    .18,
    "sawtooth"
  );

}


/* =====================================================
   VIBRATION
===================================================== */

function vibrate(ms){

  if(
    navigator.vibrate
  ){

    navigator.vibrate(ms);

  }

}


/* =====================================================
   CONFETTI
===================================================== */

function confetti(){

  const symbols =
    [
      "🎉",
      "⭐",
      "✨",
      "🐼",
      "💚",
      "🎊"
    ];


  for(
    let i=0;
    i<45;
    i++
  ){

    const c =
      document.createElement(
        "div"
      );


    c.className =
      "confetti";


    c.textContent =
      symbols[
        Math.floor(
          Math.random() *
          symbols.length
        )
      ];


    c.style.left =
      Math.random() *
      100 +
      "vw";


    c.style.top =
      "-30px";


    c.style.fontSize =
      (
        12 +
        Math.random() *
        14
      ) +
      "px";


    c.style.animationDuration =
      (
        1.5 +
        Math.random() *
        1.5
      ) +
      "s";


    document.body.appendChild(
      c
    );


    setTimeout(
      function(){

        c.remove();

      },
      3500
    );

  }

}

/* =====================================================
   RESIZE
===================================================== */

window.addEventListener(
  "resize",
  function(){

    if(!imageReady)
      return;


    drawBoard();


    /*
      Reposition locked pieces
      after screen rotation/resize.
    */

    pieces
      .filter(
        function(piece){

          return piece.classList
            .contains("locked");

        }
      )
      .forEach(
        function(piece){

          const row =
            Number(
              piece.dataset.row
            );


          const col =
            Number(
              piece.dataset.col
            );


          const rect =
            board.getBoundingClientRect();


          const cellW =
            rect.width / GRID;


          const cellH =
            rect.height / GRID;


          piece.style.width =
            cellW + "px";


          piece.style.height =
            cellH + "px";


          piece.style.left =
            (
              rect.left +
              col * cellW
            ) + "px";


          piece.style.top =
            (
              rect.top +
              row * cellH
            ) + "px";

        }
      );

  }
);
