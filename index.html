/* =========================================================
   AUDIO
========================================================= */

function startAudio(){

  if(!audio){

    try{

      audio =
      new(
        window.AudioContext ||
        window.webkitAudioContext
      )();

    }catch(e){}

  }

  if(audio &&
     audio.state==="suspended"){

    audio.resume();

  }

}


function tone(freq,duration,type="sine"){

  startAudio();

  if(!audio) return;

  try{

    const osc =
    audio.createOscillator();

    const gain =
    audio.createGain();

    osc.type=type;

    osc.frequency.value=freq;

    gain.gain.setValueAtTime(
      .06,
      audio.currentTime
    );

    gain.gain.exponentialRampToValueAtTime(
      .001,
      audio.currentTime+duration
    );

    osc.connect(gain);

    gain.connect(
      audio.destination
    );

    osc.start();

    osc.stop(
      audio.currentTime+duration
    );

  }catch(e){}

}


function correctSound(){

function cloud(ctx,x,y,s){

  ctx.beginPath();

  ctx.arc(
    x,
    y,
    35*s,
    0,
    Math.PI*2
  );

  ctx.arc(
    x+40*s,
    y-18*s,
    45*s,
    0,

  );

  ctx.arc(
    x+85*s,
    y,
    34*s,

  );

  ctx.arc(
    x+45*s,
    y+15*s,
    48*s,
    0,
    Math.PI*2
  );

  ctx.fill();

}


function bamboo(ctx,x,y,s){

  ctx.save();

  ctx.lineWidth=
  22*s;

  ctx.lineCap="round";

  ctx.beginPath();

  ctx.moveTo(
    x,
    y+210*s
  );

  ctx.lineTo(
    x+12*s,
    y
  );

  ctx.stroke();


  ctx.strokeStyle="#276c2c";

  ctx.lineWidth=
  4*s;

  for(
    let i=0;
    i<4;
    i++

    const yy=
    y+45*i*s;

    ctx.moveTo(
      x-10*s,
      yy

    ctx.lineTo(
      x+18*s,

    i<3;
    i++

      42*s,
      17*s,
      -.45,
      0,
      Math.PI*2
    );

    ctx.fill();

  }

  ctx.restore();

}

/* =========================================================
   TARGET GRID
========================================================= */

function createTargetGrid(){

  targetGrid.innerHTML="";

  for(
    let r=0;
    r<ROWS;
    r++
  ){

    for(
      let c=0;
      c<COLS;
      c++
    ){

      const target=
      document.createElement("div");

      target.className="target";

      target.style.left=
      (c*100/COLS)+"%";

      target.style.top=
      (r*100/ROWS)+"%";

      target.style.width=
      (100/COLS)+"%";

      target.style.height=
      (100/ROWS)+"%";

      targetGrid.appendChild(
        target
      );

    }

  }

}


/* =========================================================
   CREATE PUZZLE PIECES
========================================================= */

function createPiece(row,col){

  const piece=
  document.createElement("div");

  piece.className="piece";

  piece.dataset.row=row;
  piece.dataset.col=col;


  const canvas=
  document.createElement("canvas");

  canvas.width=CELL;
  canvas.height=CELL;


  const ctx=
  canvas.getContext("2d");


  /*
     Draw EXACTLY the matching
     part of the original Panda.
  */

  ctx.drawImage(
    sourceCanvas,

    col*CELL,
    row*CELL,
    CELL,
    CELL,

    0,
    0,
    CELL,
    CELL
  );


  /*
     Add a subtle puzzle-style border.
     The actual image itself remains
     perfectly aligned.
  */

  ctx.strokeStyle=
  "rgba(0,0,0,.65)";

  ctx.lineWidth=5;

  ctx.strokeRect(
    2,
    2,
    CELL-4,
    CELL-4
  );


  piece.appendChild(canvas);

  return piece;

}


/* =========================================================
   SHUFFLE
========================================================= */

function shuffle(array){

  for(
    let i=array.length-1;
    i>0;
    i--
  ){

    const j=
    Math.floor(
      Math.random()*(i+1)
    );

    [
      array[i],
      array[j]
    ]=[
      array[j],
      array[i]
    ];

  }

}

   CREATE ALL PIECES
========================================================= */

function createPieces(){

  piecesArea.innerHTML="";

  pieces=[];


  for(
    let r=0;
    r<ROWS;
    r++
  ){

    for(
      let c=0;
      c<COLS;
      c++
    ){

      const piece=
      createPiece(r,c);

      pieces.push(piece);

    }

  }


  shuffle(pieces);


  pieces.forEach(
    piece=>{

      piecesArea.appendChild(
        piece
      );

      enableDrag(piece);

    }
  );

}


/* =========================================================
   DRAG SYSTEM
========================================================= */

function enableDrag(piece){

  let dragging=false;

  let offsetX=0;
  let offsetY=0;

  let pointerId=null;


  piece.addEventListener(
    "pointerdown",
    function(e){

      if(
        piece.classList.contains(
          "locked"
        )
      ){
        return;
      }


      e.preventDefault();

      startAudio();


      dragging=true;

      pointerId=e.pointerId;


      const rect=
      piece.getBoundingClientRect();


      offsetX=
      e.clientX-rect.left;

      offsetY=
      e.clientY-rect.top;


      /*
        Important:
        Change to fixed position
        ONLY after getting the
        original position.
      */

      piece.style.position=
      "fixed";

      piece.style.margin="0";

      piece.style.left=
      (e.clientX-offsetX)+"px";

      piece.style.top=
      (e.clientY-offsetY)+"px";


      piece.classList.add(
        "dragging"
      );


      try{

        piece.setPointerCapture(
          pointerId
        );

      }catch(err){}

    },
    {passive:false}
  );


  piece.addEventListener(
    "pointermove",
    function(e){

      if(!dragging) return;

      e.preventDefault();


      piece.style.left=
      (e.clientX-offsetX)+"px";

      piece.style.top=
      (e.clientY-offsetY)+"px";

    },
    {passive:false}
  );


  piece.addEventListener(
    "pointerup",
    function(e){

      if(!dragging) return;

      e.preventDefault();

      dragging=false;

      piece.classList.remove(
        "dragging"
      );


      try{

        piece.releasePointerCapture(
          pointerId
        );

      }catch(err){}


      checkDrop(piece);

    },
    {passive:false}
  );


  piece.addEventListener(
    "pointercancel",
    function(){

      if(!dragging) return;

      dragging=false;

      piece.classList.remove(
        "dragging"
      );

      returnPiece(piece);

    }
  );

}


/* =========================================================
   CHECK DROP
========================================================= */

function checkDrop(piece){

  if(
    piece.classList.contains(
      "locked"
    )
  ){
    return;
  }


  const row=
  Number(piece.dataset.row);

  const col=
  Number(piece.dataset.col);


  const boardRect=
  board.getBoundingClientRect();

  const pieceRect=
  piece.getBoundingClientRect();


  const centerX=
  pieceRect.left+
  pieceRect.width/2;

  const centerY=
  pieceRect.top+
  pieceRect.height/2;


  const cellW=
  boardRect.width/COLS;

  const cellH=
  boardRect.height/ROWS;


  /*
     Find the nearest cell.
  */

  let nearestCol=
  Math.floor(
    (centerX-boardRect.left)/
    cellW
  );

  let nearestRow=
  Math.floor(
    (centerY-boardRect.top)/
    cellH
  );


  /*
     Keep values inside board.
  */

  nearestCol=
  Math.max(
    0,
    Math.min(
      COLS-1,
      nearestCol
    )
  );


  nearestRow=
  Math.max(
    0,
    Math.min(
      ROWS-1,
      nearestRow
    )
  );


  const targetCenterX=
  boardRect.left+
  (nearestCol+.5)*cellW;

  const targetCenterY=
  boardRect.top+
  (nearestRow+.5)*cellH;


  const dx=
  centerX-targetCenterX;

  const dy=
  centerY-targetCenterY;


  const distance=
  Math.sqrt(
    dx*dx+
    dy*dy
  );


  /*
     V1.7 uses a large,
     forgiving snap area.
  */

  const snapDistance=
  Math.min(
    cellW,
    cellH
  )*.62;


  moves++;

  updateStats();


  if(
    nearestRow===row &&
    nearestCol===col &&
    distance<=snapDistance
  ){

    lockPiece(
      piece,
      row,
      col
    );

  }else{

    wrongPiece(piece);

  }

}


/* =========================================================
   LOCK CORRECT PIECE
========================================================= */

function lockPiece(
  piece,
  row,
  col
){

  const boardRect=
  board.getBoundingClientRect();


  const cellW=
  boardRect.width/COLS;

  const cellH=
  boardRect.height/ROWS;


  /*
     Position piece exactly
     over its target cell.
  */

  piece.style.position=
  "fixed";

  piece.style.width=
  cellW+"px";

  piece.style.height=
  cellH+"px";


  piece.style.left=
  (
    boardRect.left+
    col*cellW
  )+"px";


  piece.style.top=
  (
    boardRect.top+
    row*cellH
  )+"px";


  piece.classList.add(
    "locked"
  );


  completed++;


  correctSound();


  showMessage(
    "🎉 Correct!",
    true
  );


  if(
    completed===
    ROWS*COLS
  ){

    setTimeout(
      finishGame,
      400
    );

  }

}


/* =========================================================
   WRONG PIECE
========================================================= */

function wrongPiece(piece){

  wrongSound();


  showMessage(
    "❌ Wrong place!",
    false
  );


  piece.classList.add(
    "shake"
  );


  setTimeout(
    function(){

      piece.classList.remove(
        "shake"
      );

      returnPiece(
        piece
      );

    },
    350
  );

}


/* =========================================================
   RETURN PIECE
========================================================= */

function returnPiece(piece){

  piece.style.position="";
  piece.style.left="";
  piece.style.top="";
  piece.style.width="";
  piece.style.height="";
  piece.style.margin="";


  piecesArea.appendChild(
    piece
  );

}


/* =========================================================
   MESSAGE
========================================================= */

function showMessage(
  text,
  good
){

  const message=
  document.getElementById(
    "message"
  );

  message.textContent=text;

  message.className=
  good ? "good" : "bad";


  setTimeout(
    function(){

      if(running){

        message.textContent=
        "Drag a piece into the picture.";

        message.className="";

      }

    },
    1000
  );

}


/* =========================================================
   SCORE
========================================================= */

function getScore(){

  return Math.max(
    0,
    100-
    moves*2-
    Math.floor(seconds/5)
  );

}


function updateStats(){

  document.getElementById(
    "moves"
  ).textContent=moves;


  document.getElementById(
    "score"
  ).textContent=getScore();

}


/* =========================================================
   TIMER
========================================================= */

function startTimer(){

  clearInterval(timer);

  timer=
  setInterval(
    function(){

      if(!running) return;

      seconds++;

      document.getElementById(
        "time"
      ).textContent=seconds;

      updateStats();

    },
    1000
  );

}


/* =========================================================
   BEST SCORE
========================================================= */

function updateBest(){

  const bestScore=
  localStorage.getItem(
    "completePic_v17_bestScore"
  );

  const bestTime=
  localStorage.getItem(
    "completePic_v17_bestTime"
  );


  document.getElementById(
    "bestScore"
  ).textContent=
  bestScore===null
  ? "—"
  : bestScore;


  document.getElementById(
    "bestTime"
  ).textContent=
  bestTime===null
  ? "—"
  : bestTime;

}


/* =========================================================
   FINISH GAME
========================================================= */

function finishGame(){

  if(!running) return;


  running=false;

  clearInterval(timer);


  const finalScore=
  getScore();


  document.getElementById(
    "finalTime"
  ).textContent=seconds;


  document.getElementById(
    "finalMoves"
  ).textContent=moves;


  document.getElementById(
    "finalScore"
  ).textContent=finalScore;


  const oldScore=
  localStorage.getItem(
    "completePic_v17_bestScore"
  );

  const oldTime=
  localStorage.getItem(
    "completePic_v17_bestTime"
  );


  if(
    oldScore===null ||
    finalScore>Number(oldScore)
  ){

    localStorage.setItem(
      "completePic_v17_bestScore",
      finalScore
    );

  }


  if(
    oldTime===null ||
    seconds<Number(oldTime)
  ){

    localStorage.setItem(
      "completePic_v17_bestTime",
      seconds
    );

  }


  updateBest();

  winSound();


  document.getElementById(
    "winScreen"
  ).style.display="flex";

}


/* =========================================================
   NEW GAME
========================================================= */

function newGame(){

  startAudio();


  clearInterval(timer);


  moves=0;
  seconds=0;
  completed=0;

  running=true;


  document.getElementById(
    "time"
  ).textContent="0";


  document.getElementById(
    "moves"
  ).textContent="0";


  document.getElementById(
    "score"
  ).textContent="100";


  document.getElementById(
    "message"
  ).textContent=
  "Drag a piece into the picture.";


  document.getElementById(
    "message"
  ).className="";


  document.getElementById(
    "winScreen"
  ).style.display="none";


  /*
     Create the Panda again.
  */

  drawPanda();


  /*
     Show the complete picture
     inside the black frame.
  */

  boardCtx.clearRect(
    0,
    0,
    SIZE,
    SIZE
  );


  boardCtx.drawImage(
    sourceCanvas,
    0,
    0
  );


  createTargetGrid();


  createPieces();


  updateBest();


  startTimer();

}


/* =========================================================
   START GAME
========================================================= */

updateBest();

newGame();

</script>
