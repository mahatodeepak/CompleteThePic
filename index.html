<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1.0,user-scalable=no">

<title>Complete the Pic - V2.3</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  padding:0;
  width:100%;
  min-height:100%;
  font-family:Arial,sans-serif;
  background:#f7f7f7;
  color:#222;
  overflow-x:hidden;
}

body{
  padding-bottom:30px;
}

header{
  text-align:center;
  padding:16px 10px 8px;
}

h1{
  margin:0;
  font-size:28px;
}

.subtitle{
  margin-top:5px;
  font-size:14px;
  color:#666;
}

.stats{
  display:flex;
  justify-content:center;
  gap:10px;
  flex-wrap:wrap;
  margin:10px auto;
}

.stat{
  background:white;
  border:1px solid #ddd;
  border-radius:12px;
  padding:8px 13px;
  min-width:85px;
  box-shadow:0 2px 6px rgba(0,0,0,.06);
}

.stat b{
  display:block;
  font-size:18px;
}

.stat span{
  font-size:11px;
  color:#777;
}

#gameArea{
  width:min(94vw,520px);
  margin:auto;
}

#frame{
  position:relative;
  width:100%;
  aspect-ratio:1/1;
  background:#fff;
  border:3px solid #555;
  border-radius:14px;
  overflow:visible;
  box-shadow:0 3px 12px rgba(0,0,0,.08);
}

#boardCanvas{
  width:100%;
  height:100%;
  display:block;
  border-radius:10px;
}

#piecesTitle{
  text-align:center;
  margin:20px 0 8px;
  font-weight:bold;
}

#piecesArea{
  min-height:250px;
  padding:12px;
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  align-items:center;
  gap:8px;
  background:white;
  border:1px solid #ddd;
  border-radius:16px;
  box-shadow:0 2px 8px rgba(0,0,0,.05);
}

.piece{
  width:96px;
  height:96px;
  position:relative;
  touch-action:none;
  user-select:none;
  cursor:grab;
  z-index:20;
}

.piece svg{
  width:100%;
  height:100%;
  display:block;
  overflow:visible;
  touch-action:none;
  user-select:none;
}

.piece.dragging{
  cursor:grabbing;
  z-index:9999;
  filter:drop-shadow(0 7px 12px rgba(0,0,0,.25));
}

.piece.locked{
  z-index:30;
  cursor:default;
}

#buttons{
  display:flex;
  justify-content:center;
  gap:10px;
  margin:16px auto;
  flex-wrap:wrap;
}

button{
  border:0;
  border-radius:12px;
  padding:12px 20px;
  font-size:16px;
  font-weight:bold;
  background:#222;
  color:white;
  cursor:pointer;
}

button:active{
  transform:scale(.96);
}

#message{
  min-height:28px;
  text-align:center;
  font-weight:bold;
  margin:8px;
}

#winScreen{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.55);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:10000;
  padding:20px;
}

.winBox{
  width:min(90vw,380px);
  background:white;
  border-radius:22px;
  padding:28px 20px;
  text-align:center;
  box-shadow:0 10px 40px rgba(0,0,0,.3);
  animation:pop .35s ease;
}

.winBox h2{
  margin-top:0;
  font-size:30px;
}

.winEmoji{
  font-size:55px;
}

#loading{
  text-align:center;
  padding:12px;
  color:#777;
  font-size:14px;
}

@keyframes pop{
  from{
    transform:scale(.7);
    opacity:0;
  }
  to{
    transform:scale(1);
    opacity:1;
  }
}

@keyframes shake{
  0%,100%{transform:translateX(0)}
  20%{transform:translateX(-10px)}
  40%{transform:translateX(10px)}
  60%{transform:translateX(-8px)}
  80%{transform:translateX(8px)}
}

.shake{
  animation:shake .35s ease;
}

.confetti{
  position:fixed;
  top:-20px;
  font-size:22px;
  z-index:11000;
  pointer-events:none;
  animation:fall 2.5s linear forwards;
}

@keyframes fall{
  to{
    transform:translateY(110vh) rotate(720deg);
    opacity:0;
  }
}
</style>
</head>

<body>

<header>
  <h1>🐼 Complete the Pic</h1>
  <div class="subtitle">Pick the pieces. Complete the picture!</div>

  <div class="stats">
    <div class="stat">
      <b id="timer">00:00</b>
      <span>Time</span>
    </div>

    <div class="stat">
      <b id="moves">0</b>
      <span>Moves</span>
    </div>

    <div class="stat">
      <b id="score">100</b>
      <span>Score</span>
    </div>

    <div class="stat">
      <b id="bestScore">-</b>
      <span>Best</span>
    </div>
  </div>
</header>

<div id="gameArea">

  <div id="loading">
    Loading Panda picture...
  </div>

  <div id="frame">
    <canvas id="boardCanvas"></canvas>
  </div>

  <div id="piecesTitle">
    🧩 Drag the pieces into the frame
  </div>

  <div id="piecesArea"></div>

  <div id="message"></div>

  <div id="buttons">
    <button onclick="newGame()">🔄 New Game</button>
  </div>

</div>

<div id="winScreen">
  <div class="winBox">
    <div class="winEmoji">🎉🐼🧩</div>
    <h2>Picture Complete!</h2>

    <p>
      Great job!
    </p>

    <p>
      Time: <b id="finalTime">00:00</b>
    </p>

    <p>
      Moves: <b id="finalMoves">0</b>
    </p>

    <p>
      Score: <b id="finalScore">0</b>
    </p>

    <button onclick="newGame()">
      ▶ Play Again
    </button>
  </div>
</div>

<script>

/* =========================================================
   COMPLETE THE PIC V2.3
   TRUE JIGSAW SHAPES
   ========================================================= */

const GRID = 3;

const boardCanvas =
  document.getElementById("boardCanvas");

const boardCtx =
  boardCanvas.getContext("2d");

const frame =
  document.getElementById("frame");

const piecesArea =
  document.getElementById("piecesArea");

const loading =
  document.getElementById("loading");

const timerEl =
  document.getElementById("timer");

const movesEl =
  document.getElementById("moves");

const scoreEl =
  document.getElementById("score");

const bestScoreEl =
  document.getElementById("bestScore");

const messageEl =
  document.getElementById("message");

const winScreen =
  document.getElementById("winScreen");

const finalTimeEl =
  document.getElementById("finalTime");

const finalMovesEl =
  document.getElementById("finalMoves");

const finalScoreEl =
  document.getElementById("finalScore");


/* ---------------------------------------------------------
   PANDA IMAGE
   --------------------------------------------------------- */

const pandaImage = new Image();

pandaImage.src = "panda.png";

let imageReady = false;


/* ---------------------------------------------------------
   GAME VARIABLES
   --------------------------------------------------------- */

let seconds = 0;
let moves = 0;
let lockedCount = 0;

let timerInterval = null;
let gameStarted = false;

let draggingPiece = null;

let dragOffsetX = 0;
let dragOffsetY = 0;

let edgeHorizontal = [];
let edgeVertical = [];

let audioContext = null;


/* ---------------------------------------------------------
   LOCAL STORAGE
   --------------------------------------------------------- */

let bestScore =
  Number(localStorage.getItem(
    "completePic_v23_bestScore"
  )) || 0;

let bestTime =
  Number(localStorage.getItem(
    "completePic_v23_bestTime"
  )) || 0;

bestScoreEl.textContent =
  bestScore > 0 ? bestScore : "-";


/* ---------------------------------------------------------
   IMAGE LOADED
   --------------------------------------------------------- */

pandaImage.onload = function(){

  imageReady = true;

  loading.style.display = "none";

  resizeBoard();

  newGame();
};


/* ---------------------------------------------------------
   IMAGE ERROR
   --------------------------------------------------------- */

pandaImage.onerror = function(){

  loading.textContent =
    "❌ panda.png not found. Put panda.png beside index.html.";

};


/* ---------------------------------------------------------
   BOARD RESIZE
   --------------------------------------------------------- */

function resizeBoard(){

  const rect =
    frame.getBoundingClientRect();

  const size =
    Math.max(300, Math.floor(rect.width));

  boardCanvas.width = size;
  boardCanvas.height = size;

  drawBoard();
}


/* ---------------------------------------------------------
   DRAW BOARD
   --------------------------------------------------------- */

function drawBoard(){

  if(!imageReady) return;

  const w = boardCanvas.width;
  const h = boardCanvas.height;

  boardCtx.clearRect(0,0,w,h);

  boardCtx.fillStyle = "#ffffff";
  boardCtx.fillRect(0,0,w,h);

  /*
     Very faint Panda guide.
  */

  boardCtx.save();

  boardCtx.globalAlpha = 0.10;

  boardCtx.drawImage(
    pandaImage,
    0,
    0,
    w,
    h
  );

  boardCtx.restore();


  /*
     Very light 3x3 guide lines.
  */

  boardCtx.save();

  boardCtx.strokeStyle =
    "rgba(80,80,80,.18)";

  boardCtx.lineWidth = 1;

  const cell = w / GRID;

  for(let i=1;i<GRID;i++){

    boardCtx.beginPath();

    boardCtx.moveTo(i*cell,0);
    boardCtx.lineTo(i*cell,h);

    boardCtx.stroke();

    boardCtx.beginPath();

    boardCtx.moveTo(0,i*cell);
    boardCtx.lineTo(w,i*cell);

    boardCtx.stroke();
  }

  boardCtx.restore();
}


/* =========================================================
   JIGSAW EDGE GENERATOR
   ========================================================= */

function buildEdges(){

  edgeHorizontal = [];
  edgeVertical = [];

  /*
     Horizontal shared edges.
     Each value:
       +1 = outward tab
       -1 = inward cut
  */

  for(let r=0;r<GRID-1;r++){

    edgeHorizontal[r] = [];

    for(let c=0;c<GRID;c++){

      edgeHorizontal[r][c] =
        Math.random() < 0.5 ? 1 : -1;
    }
  }


  /*
     Vertical shared edges.
  */

  for(let r=0;r<GRID;r++){

    edgeVertical[r] = [];

    for(let c=0;c<GRID-1;c++){

      edgeVertical[r][c] =
        Math.random() < 0.5 ? 1 : -1;
    }
  }
}


/* =========================================================
   JIGSAW PATH
   ========================================================= */

function makeJigsawPath(
  row,
  col,
  S,
  P
){

  /*
     Logical piece area:
       P ... P+S

     The extra P gives room for tabs.
  */

  const x0 = P;
  const y0 = P;

  const x1 = P + S;
  const y1 = P + S;

  let d = "";

  d += `M ${x0} ${y0} `;


  /* TOP */

  let topSign = 0;

  if(row > 0){
    topSign =
      -edgeHorizontal[row-1][col];
  }

  d += horizontalEdge(
    x0,
    y0,
    S,
    topSign,
    true
  );


  /* RIGHT */

  let rightSign = 0;

  if(col < GRID-1){
    rightSign =
      edgeVertical[row][col];
  }

  d += verticalEdge(
    x1,
    y0,
    S,
    rightSign,
    true
  );


  /* BOTTOM */

  let bottomSign = 0;

  if(row < GRID-1){
    bottomSign =
      edgeHorizontal[row][col];
  }

  d += horizontalEdge(
    x1,
    y1,
    -S,
    bottomSign,
    false
  );


  /* LEFT */

  let leftSign = 0;

  if(col > 0){
    leftSign =
      -edgeVertical[row][col-1];
  }

  d += verticalEdge(
    x0,
    y1,
    -S,
    leftSign,
    false
  );


  d += " Z";

  return d;
}


/* ---------------------------------------------------------
   HORIZONTAL JIGSAW EDGE
   --------------------------------------------------------- */

function horizontalEdge(
  x,
  y,
  length,
  sign,
  forward
){

  if(sign === 0){

    return `L ${x+length} ${y} `;
  }

  const dir =
    length >= 0 ? 1 : -1;

  const L =
    Math.abs(length);

  const bump =
    0.16 * 100;

  /*
     bump is scaled from the logical cell.
     The actual S is 100.
  */

  const start =
    x;

  const end =
    x + length;

  const a =
    x + dir * L * 0.28;

  const b =
    x + dir * L * 0.38;

  const c =
    x + dir * L * 0.62;

  const e =
    x + dir * L * 0.72;

  /*
     For a horizontal edge:
     positive sign means bump in +Y.
  */

  const by =
    y + sign * bump;

  return `
    L ${a} ${y}
    C ${a + dir*L*0.05} ${y},
      ${b - dir*L*0.02} ${by},
      ${b} ${by}
    C ${x + dir*L*0.46} ${by},
      ${x + dir*L*0.54} ${by},
      ${c} ${by}
    C ${c + dir*L*0.02} ${by},
      ${e - dir*L*0.05} ${y},
      ${e} ${y}
    L ${end} ${y}
  `;
}


/* ---------------------------------------------------------
   VERTICAL JIGSAW EDGE
   --------------------------------------------------------- */

function verticalEdge(
  x,
  y,
  length,
  sign,
  forward
){

  if(sign === 0){

    return `L ${x} ${y+length} `;
  }

  const dir =
    length >= 0 ? 1 : -1;

  const L =
    Math.abs(length);

  const bump =
    0.16 * 100;

  const end =
    y + length;

  const a =
    y + dir * L * 0.28;

  const b =
    y + dir * L * 0.38;

  const c =
    y + dir * L * 0.62;

  const e =
    y + dir * L * 0.72;

  /*
     Positive sign means bump in +X.
  */

  const bx =
    x + sign * bump;

  return `
    L ${x} ${a}
    C ${x} ${a + dir*L*0.05},
      ${bx} ${b - dir*L*0.02},
      ${bx} ${b}
    C ${bx} ${y + dir*L*0.46},
      ${bx} ${y + dir*L*0.54},
      ${bx} ${c}
    C ${bx} ${c + dir*L*0.02},
      ${x} ${e - dir*L*0.05},
      ${x} ${e}
    L ${x} ${end}
  `;
}


/* =========================================================
   CREATE ONE JIGSAW PIECE
   ========================================================= */

function createPiece(
  row,
  col
){

  const piece =
    document.createElement("div");

  piece.className = "piece";

  piece.dataset.row = row;
  piece.dataset.col = col;

  const svgNS =
    "http://www.w3.org/2000/svg";

  const svg =
    document.createElementNS(
      svgNS,
      "svg"
    );

  svg.setAttribute(
    "viewBox",
    "0 0 136 136"
  );

  svg.setAttribute(
    "preserveAspectRatio",
    "none"
  );

  const S = 100;
  const P = 18;

  const pathData =
    makeJigsawPath(
      row,
      col,
      S,
      P
    );


  /*
     Unique clip path.
  */

  const clipId =
    "clip_" +
    Date.now() +
    "_" +
    Math.random()
      .toString(36)
      .substring(2,8);


  const defs =
    document.createElementNS(
      svgNS,
      "defs"
    );

  const clip =
    document.createElementNS(
      svgNS,
      "clipPath"
    );

  clip.setAttribute(
    "id",
    clipId
  );

  const clipPath =
    document.createElementNS(
      svgNS,
      "path"
    );

  clipPath.setAttribute(
    "d",
    pathData
  );

  clip.appendChild(clipPath);
  defs.appendChild(clip);

  svg.appendChild(defs);


  /*
     Panda image.

     The entire image is placed in every piece,
     then clipped to its jigsaw shape.
  */

  const image =
    document.createElementNS(
      svgNS,
      "image"
    );

  const imageURL =
    pandaImage.currentSrc ||
    pandaImage.src;

  image.setAttribute(
    "href",
    imageURL
  );

  image.setAttribute(
    "xlink:href",
    imageURL
  );

  image.setAttribute(
    "x",
    P - col*S
  );

  image.setAttribute(
    "y",
    P - row*S
  );

  image.setAttribute(
    "width",
    GRID*S
  );

  image.setAttribute(
    "height",
    GRID*S
  );

  image.setAttribute(
    "preserveAspectRatio",
    "none"
  );

  image.setAttribute(
    "clip-path",
    `url(#${clipId})`
  );

  svg.appendChild(image);


  /*
     Subtle jigsaw outline.
  */

  const outline =
    document.createElementNS(
      svgNS,
      "path"
    );

  outline.setAttribute(
    "d",
    pathData
  );

  outline.setAttribute(
    "fill",
    "none"
  );

  outline.setAttribute(
    "stroke",
    "rgba(0,0,0,.30)"
  );

  outline.setAttribute(
    "stroke-width",
    "1.5"
  );

  outline.setAttribute(
    "pointer-events",
    "none"
  );

  svg.appendChild(outline);


  piece.appendChild(svg);


  /*
     Touch / mouse drag.
  */

  piece.addEventListener(
    "pointerdown",
    startDrag
  );

  return piece;
}


/* =========================================================
   CREATE ALL PIECES
   ========================================================= */

function createPieces(){

  piecesArea.innerHTML = "";

  const pieces = [];

  for(let row=0;row<GRID;row++){

    for(let col=0;col<GRID;col++){

      pieces.push(
        createPiece(row,col)
      );
    }
  }


  /*
     Shuffle pieces.
  */

  pieces.sort(
    () => Math.random() - 0.5
  );


  pieces.forEach(
    piece =>
      piecesArea.appendChild(piece)
  );
}


/* =========================================================
   NEW GAME
   ========================================================= */

function newGame(){

  if(!imageReady) return;

  stopTimer();

  seconds = 0;
  moves = 0;
  lockedCount = 0;

  gameStarted = false;

  messageEl.textContent = "";

  winScreen.style.display = "none";


  /*
     Remove ALL old pieces.

     Important because locked pieces are moved
     to document.body.
  */

  document
    .querySelectorAll(".piece")
    .forEach(
      p => p.remove()
    );


  piecesArea.innerHTML = "";


  buildEdges();

  resizeBoard();

  createPieces();

  updateStats();
}


/* =========================================================
   START DRAG
   ========================================================= */

function startDrag(e){

  if(
    e.button !== undefined &&
    e.button !== 0
  ) return;

  const piece = e.currentTarget;

  if(piece.classList.contains("locked"))
    return;


  initAudio();


  /*
     Start timer on first move.
  */

  if(!gameStarted){

    gameStarted = true;

    startTimer();
  }


  const rect =
    piece.getBoundingClientRect();


  dragOffsetX =
    e.clientX - rect.left;

  dragOffsetY =
    e.clientY - rect.top;


  /*
     Move piece to BODY.

     This is the important Android fix:
     the piece can cross the frame.
  */

  document.body.appendChild(piece);


  piece.style.position = "fixed";

  piece.style.left =
    rect.left + "px";

  piece.style.top =
    rect.top + "px";


  piece.style.width =
    "96px";

  piece.style.height =
    "96px";


  piece.classList.add("dragging");


  draggingPiece = piece;


  try{
    piece.setPointerCapture(e.pointerId);
  }catch(err){}


  piece.addEventListener(
    "pointermove",
    dragMove
  );

  piece.addEventListener(
    "pointerup",
    endDrag
  );

  piece.addEventListener(
    "pointercancel",
    endDrag
  );

  e.preventDefault();
}


/* =========================================================
   DRAG MOVE
   ========================================================= */

function dragMove(e){

  if(
    !draggingPiece ||
    draggingPiece !== e.currentTarget
  ) return;


  draggingPiece.style.left =
    (e.clientX - dragOffsetX) + "px";

  draggingPiece.style.top =
    (e.clientY - dragOffsetY) + "px";


  e.preventDefault();
}


/* =========================================================
   END DRAG
   ========================================================= */

function endDrag(e){

  if(
    !draggingPiece ||
    draggingPiece !== e.currentTarget
  ) return;


  const piece =
    draggingPiece;

  piece.removeEventListener(
    "pointermove",
    dragMove
  );

  piece.removeEventListener(
    "pointerup",
    endDrag
  );

  piece.removeEventListener(
    "pointercancel",
    endDrag
  );


  draggingPiece = null;

  piece.classList.remove("dragging");


  checkDrop(piece);
}


/* =========================================================
   CHECK DROP
   ========================================================= */

function checkDrop(piece){

  const row =
    Number(piece.dataset.row);

  const col =
    Number(piece.dataset.col);


  const boardRect =
    boardCanvas.getBoundingClientRect();


  const cellW =
    boardRect.width / GRID;

  const cellH =
    boardRect.height / GRID;


  const pieceRect =
    piece.getBoundingClientRect();


  const centerX =
    pieceRect.left +
    pieceRect.width/2;

  const centerY =
    pieceRect.top +
    pieceRect.height/2;


  const targetX =
    boardRect.left +
    (col + 0.5) * cellW;

  const targetY =
    boardRect.top +
    (row + 0.5) * cellH;


  const dx =
    centerX - targetX;

  const dy =
    centerY - targetY;

  const distance =
    Math.sqrt(dx*dx + dy*dy);


  /*
     Generous Android-friendly tolerance.
  */

  const tolerance =
    Math.min(cellW,cellH) * 0.85;


  /*
     Make sure the piece is reasonably near
     the board.
  */

  const boardMargin =
    Math.min(cellW,cellH) * 1.2;


  const nearBoard =
    centerX >
      boardRect.left - boardMargin &&
    centerX <
      boardRect.right + boardMargin &&
    centerY >
      boardRect.top - boardMargin &&
    centerY <
      boardRect.bottom + boardMargin;


  if(
    nearBoard &&
    distance <= tolerance
  ){

    lockPiece(
      piece,
      row,
      col
    );

  }else{

    wrongPlacement(piece);
  }
}


/* =========================================================
   LOCK CORRECT PIECE
   ========================================================= */

function lockPiece(
  piece,
  row,
  col
){

  const boardRect =
    boardCanvas.getBoundingClientRect();


  const cellW =
    boardRect.width / GRID;

  const cellH =
    boardRect.height / GRID;


  /*
     Tab padding scales with cell size.
  */

  const padX =
    cellW * 0.18;

  const padY =
    cellH * 0.18;


  piece.style.width =
    (cellW + padX*2) + "px";

  piece.style.height =
    (cellH + padY*2) + "px";


  piece.style.left =
    (
      boardRect.left +
      col*cellW -
      padX
    ) + "px";


  piece.style.top =
    (
      boardRect.top +
      row*cellH -
      padY
    ) + "px";


  piece.classList.add("locked");


  lockedCount++;

  moves++;

  updateStats();

  playCorrectSound();

  vibrate(35);


  messageEl.textContent =
    "🎉 Great! Correct piece!";


  /*
     Small delay before checking completion.
  */

  if(lockedCount === GRID*GRID){

    setTimeout(
      completeGame,
      300
    );
  }
}


/* =========================================================
   WRONG PIECE
   ========================================================= */

function wrongPlacement(piece){

  moves++;

  updateStats();

  playWrongSound();

  vibrate([40,40,40]);


  piece.classList.add("shake");

  messageEl.textContent =
    "❌ Not there. Try another place.";


  setTimeout(
    () => {

      piece.classList.remove("shake");

      returnPiece(piece);

    },
    380
  );
}


/* =========================================================
   RETURN PIECE
   ========================================================= */

function returnPiece(piece){

  piecesArea.appendChild(piece);

  piece.style.position =
    "relative";

  piece.style.left = "";
  piece.style.top = "";

  piece.style.width =
    "96px";

  piece.style.height =
    "96px";

  piece.style.zIndex = "";

  piece.classList.remove(
    "locked",
    "dragging"
  );
}


/* =========================================================
   TIMER
   ========================================================= */

function startTimer(){

  stopTimer();

  timerInterval =
    setInterval(
      () => {

        seconds++;

        updateStats();

      },
      1000
    );
}


function stopTimer(){

  if(timerInterval){

    clearInterval(
      timerInterval
    );

    timerInterval = null;
  }
}


/* =========================================================
   FORMAT TIME
   ========================================================= */

function formatTime(total){

  const min =
    Math.floor(total/60);

  const sec =
    total % 60;

  return (
    String(min).padStart(2,"0") +
    ":" +
    String(sec).padStart(2,"0")
  );
}


/* =========================================================
   SCORE
   ========================================================= */

function calculateScore(){

  const score =
    100 -
    moves*2 -
    Math.floor(seconds/5);

  return Math.max(
    0,
    score
  );
}


/* =========================================================
   UPDATE STATS
   ========================================================= */

function updateStats(){

  timerEl.textContent =
    formatTime(seconds);

  movesEl.textContent =
    moves;

  scoreEl.textContent =
    calculateScore();

  bestScoreEl.textContent =
    bestScore > 0
      ? bestScore
      : "-";
}


/* =========================================================
   COMPLETE GAME
   ========================================================= */

function completeGame(){

  stopTimer();

  gameStarted = false;


  const finalScore =
    calculateScore();


  /*
     Save best score.
  */

  if(finalScore > bestScore){

    bestScore =
      finalScore;

    localStorage.setItem(
      "completePic_v23_bestScore",
      bestScore
    );
  }


  /*
     Save best time.
  */

  if(
    bestTime === 0 ||
    seconds < bestTime
  ){

    bestTime =
      seconds;

    localStorage.setItem(
      "completePic_v23_bestTime",
      bestTime
    );
  }


  updateStats();


  finalTimeEl.textContent =
    formatTime(seconds);

  finalMovesEl.textContent =
    moves;

  finalScoreEl.textContent =
    finalScore;


  winScreen.style.display =
    "flex";


  playWinSound();

  vibrate([
    100,
    60,
    100,
    60,
    180
  ]);


  createConfetti();
}


/* =========================================================
   CONFETTI
   ========================================================= */

function createConfetti(){

  const emojis = [
    "🎉",
    "⭐",
    "🐼",
    "🧩",
    "🎊"
  ];


  for(let i=0;i<35;i++){

    const item =
      document.createElement("div");

    item.className =
      "confetti";

    item.textContent =
      emojis[
        Math.floor(
          Math.random()*emojis.length
        )
      ];

    item.style.left =
      Math.random()*100 + "vw";

    item.style.animationDelay =
      Math.random()*1.2 + "s";

    document.body.appendChild(item);


    setTimeout(
      () => item.remove(),
      4000
    );
  }
}


/* =========================================================
   AUDIO
   ========================================================= */

function initAudio(){

  if(!audioContext){

    try{

      audioContext =
        new (
          window.AudioContext ||
          window.webkitAudioContext
        )();

    }catch(err){}
  }
}


function beep(
  frequency,
  duration,
  type="sine"
){

  if(!audioContext) return;

  try{

    const oscillator =
      audioContext.createOscillator();

    const gain =
      audioContext.createGain();


    oscillator.type =
      type;

    oscillator.frequency.value =
      frequency;


    gain.gain.setValueAtTime(
      0.001,
      audioContext.currentTime
    );

    gain.gain.exponentialRampToValueAtTime(
      0.12,
      audioContext.currentTime + 0.01
    );

    gain.gain.exponentialRampToValueAtTime(
      0.001,
      audioContext.currentTime + duration
    );


    oscillator.connect(gain);

    gain.connect(audioContext.destination);


    oscillator.start();

    oscillator.stop(
      audioContext.currentTime +
      duration
    );

  }catch(err){}
}


function playCorrectSound(){

  initAudio();

  beep(700,.10,"sine");

  setTimeout(
    () => beep(950,.12,"sine"),
    90
  );
}


function playWrongSound(){

  initAudio();

  beep(180,.18,"sawtooth");
}


function playWinSound(){

  initAudio();

  beep(523,.12);

  setTimeout(
    () => beep(659,.12),
    130
  );

  setTimeout(
    () => beep(784,.18),
    260
  );
}


/* =========================================================
   VIBRATION
   ========================================================= */

function vibrate(pattern){

  if(
    navigator.vibrate
  ){

    try{
      navigator.vibrate(pattern);
    }catch(err){}
  }
}


/* =========================================================
   RESIZE
   ========================================================= */

window.addEventListener(
  "resize",
  () => {

    if(imageReady){

      resizeBoard();
    }
  }
);

   START
   ========================================================= */

if(pandaImage.complete){

  if(
    pandaImage.naturalWidth > 0
  ){

    pandaImage.onload();

  }
}
