<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">

<title>Complete the Pic - Panda Puzzle</title>

<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg, #dff7ff, #fff4d6);
  text-align: center;
  color: #222;
  overflow-x: hidden;
}

h1 {
  margin: 14px 0 2px;
  font-size: 30px;
}

.subtitle {
  margin: 0 0 12px;
  color: #555;
  font-size: 15px;
}

.info {
  display: flex;
  justify-content: center;
  gap: 25px;
  font-weight: bold;
  margin-bottom: 12px;
}

#gameArea {
  width: 100%;
  max-width: 520px;
  margin: auto;
  padding: 8px;
}

/* Puzzle board */
#board {
  position: relative;
  width: min(92vw, 450px);
  height: min(92vw, 450px);
  margin: auto;
  background: white;
  border: 9px solid black;
  overflow: hidden;
  box-shadow: 0 5px 15px rgba(0,0,0,.25);
}

/* Panda artwork */
#panda {
  position: absolute;
  inset: 0;
  background: linear-gradient(#bdeeff 0 58%, #8bd36e 58%);
}

/* Panda ears */
.panda-ear {
  position: absolute;
  width: 17%;
  height: 17%;
  background: #111;
  border-radius: 50%;
  top: 19%;
}

.ear-left {
  left: 27%;
}

.ear-right {
  right: 27%;
}

/* Panda head */
.panda-head {
  position: absolute;
  width: 48%;
  height: 43%;
  background: white;
  border: 5px solid #111;
  border-radius: 48%;
  left: 26%;
  top: 20%;
}

/* Eyes */
.eye {
  position: absolute;
  width: 19%;
  height: 25%;
  background: #111;
  border-radius: 50%;
  top: 34%;
}

.eye-left {
  left: 22%;
  transform: rotate(25deg);
}

.eye-right {
  right: 22%;
  transform: rotate(-25deg);
}

.eye::after {
  content: "";
  position: absolute;
  width: 30%;
  height: 30%;
  background: white;
  border-radius: 50%;
  left: 20%;
  top: 12%;
}

/* Nose */
.nose {
  position: absolute;
  width: 13%;
  height: 9%;
  background: #111;
  border-radius: 50%;
  left: 43.5%;
  top: 61%;
}

/* Mouth */
.mouth {
  position: absolute;
  width: 20%;
  height: 12%;
  left: 40%;
  top: 68%;
  border-bottom: 4px solid #111;
  border-radius: 50%;
}

/* Body */
.panda-body {
  position: absolute;
  width: 39%;
  height: 39%;
  background: #111;
  border-radius: 45% 45% 35% 35%;
  left: 30.5%;
  top: 57%;
}

/* Belly */
.belly {
  position: absolute;
  width: 58%;
  height: 58%;
  background: white;
  border-radius: 50%;
  left: 21%;
  top: 22%;
}

/* Arms */
.arm {
  position: absolute;
  width: 22%;
  height: 38%;
  background: #111;
  border-radius: 50%;
  top: 60%;
}

.arm-left {
  left: 18%;
  transform: rotate(35deg);
}

.arm-right {
  right: 18%;
  transform: rotate(-35deg);
}

/* Puzzle covering */
#piecesArea {
  margin: 18px auto 10px;
  width: min(95vw, 500px);
  min-height: 210px;
  padding: 10px;
  border: 3px dashed #555;
  border-radius: 15px;
  background: rgba(255,255,255,.75);
}

#piecesTitle {
  font-weight: bold;
  margin-bottom: 8px;
}

#pieces {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  justify-items: center;
}

/* Pieces */
.piece {
  position: relative;
  width: min(27vw, 125px);
  height: min(27vw, 125px);
  border: 3px solid #111;
  border-radius: 8px;
  background: white;
  cursor: grab;
  touch-action: none;
  user-select: none;
  overflow: hidden;
  box-shadow: 0 3px 8px rgba(0,0,0,.25);
}

.piece:active {
  cursor: grabbing;
  transform: scale(1.04);
  z-index: 50;
}

/* Each piece contains a copy of the panda */
.piecePanda {
  position: absolute;
  width: 300%;
  height: 300%;
}

/*
  The panda is positioned differently inside every piece.
  This creates the visual effect of a cut-up picture.
*/
.piece:nth-child(1) .piecePanda { left: 0; top: 0; }
.piece:nth-child(2) .piecePanda { left: -100%; top: 0; }
.piece:nth-child(3) .piecePanda { left: -200%; top: 0; }

.piece:nth-child(4) .piecePanda { left: 0; top: -100%; }
.piece:nth-child(5) .piecePanda { left: -100%; top: -100%; }
.piece:nth-child(6) .piecePanda { left: -200%; top: -100%; }

.piece:nth-child(7) .piecePanda { left: 0; top: -200%; }
.piece:nth-child(8) .piecePanda { left: -100%; top: -200%; }
.piece:nth-child(9) .piecePanda { left: -200%; top: -200%; }

/* Drop slots */
.slot {
  position: absolute;
  width: 33.3333%;
  height: 33.3333%;
  border: 2px dashed rgba(0,0,0,.35);
  z-index: 2;
}

.slot.correct {
  border: 3px solid #19a83b;
  background: rgba(60,220,80,.12);
}

#slot0 { left:0; top:0; }
#slot1 { left:33.333%; top:0; }
#slot2 { left:66.666%; top:0; }

#slot3 { left:0; top:33.333%; }
#slot4 { left:33.333%; top:33.333%; }
#slot5 { left:66.666%; top:33.333%; }

#slot6 { left:0; top:66.666%; }
#slot7 { left:33.333%; top:66.666%; }
#slot8 { left:66.666%; top:66.666%; }

/* When completed, hide panda underneath */
.hidePanda {
  opacity: 0;
}

/* Buttons */
button {
  border: none;
  border-radius: 12px;
  padding: 12px 22px;
  margin: 6px;
  font-size: 16px;
  font-weight: bold;
  background: #222;
  color: white;
  cursor: pointer;
}

button:active {
  transform: scale(.96);
}

#message {
  min-height: 28px;
  font-size: 18px;
  font-weight: bold;
  margin: 5px;
}

.win {
  color: #12952e;
  font-size: 24px !important;
}

/* Win animation */
@keyframes celebrate {
  0% { transform: scale(1); }
  50% { transform: scale(1.08) rotate(2deg); }
  100% { transform: scale(1); }
}

.celebrate {
  animation: celebrate .6s infinite;
}

/* Mobile */
@media(max-width:420px) {
  h1 {
    font-size: 25px;
  }

  .info {
    gap: 15px;
    font-size: 14px;
  }

  #piecesArea {
    min-height: 190px;
  }
}
</style>
</head>

<body>

<h1>🐼 Complete the Pic</h1>
<div class="subtitle">Pick the pieces. Complete the picture!</div>

<div class="info">
  <div>⏱️ Time: <span id="timer">0</span>s</div>
  <div>🎯 Moves: <span id="moves">0</span></div>
</div>

<div id="gameArea">

  <!-- BLACK PUZZLE FRAME -->
  <div id="board">

    <!-- PANDA IMAGE -->
    <div id="panda">

      <div class="panda-ear ear-left"></div>
      <div class="panda-ear ear-right"></div>

      <div class="panda-head">
        <div class="eye eye-left"></div>
        <div class="eye eye-right"></div>
        <div class="nose"></div>
        <div class="mouth"></div>
      </div>

      <div class="panda-body">
        <div class="belly"></div>
      </div>

      <div class="arm arm-left"></div>
      <div class="arm arm-right"></div>

    </div>

    <!-- PUZZLE SLOTS -->
    <div class="slot" id="slot0" data-slot="0"></div>
    <div class="slot" id="slot1" data-slot="1"></div>
    <div class="slot" id="slot2" data-slot="2"></div>

    <div class="slot" id="slot3" data-slot="3"></div>
    <div class="slot" id="slot4" data-slot="4"></div>
    <div class="slot" id="slot5" data-slot="5"></div>

    <div class="slot" id="slot6" data-slot="6"></div>
    <div class="slot" id="slot7" data-slot="7"></div>
    <div class="slot" id="slot8" data-slot="8"></div>

  </div>

  <div id="message">Drag each piece into the black frame.</div>

  <div id="piecesArea">
    <div id="piecesTitle">🧩 Puzzle Pieces</div>
    <div id="pieces"></div>
  </div>

  <button onclick="newGame()">🔄 New Game</button>

</div>

<script>

/* =========================
   GAME VARIABLES
========================= */

let moves = 0;
let seconds = 0;
let completed = 0;
let timerInterval = null;
let gameStarted = false;

const piecesContainer = document.getElementById("pieces");
const message = document.getElementById("message");
const timerDisplay = document.getElementById("timer");
const movesDisplay = document.getElementById("moves");

/* Correct location of each piece */
const correctPositions = [
  0,1,2,
  3,4,5,
  6,7,8
];


/* =========================
   CREATE PANDA FOR PIECES
========================= */

function createPiecePanda() {

  const panda = document.createElement("div");
  panda.className = "piecePanda";

  panda.innerHTML = `
    <div style="
      position:absolute;
      inset:0;
      background:linear-gradient(#bdeeff 0 58%,#8bd36e 58%);
    ">

      <div style="
        position:absolute;
        width:17%;
        height:17%;
        background:#111;
        border-radius:50%;
        top:19%;
        left:27%;
      "></div>

      <div style="
        position:absolute;
        width:17%;
        height:17%;
        background:#111;
        border-radius:50%;
        top:19%;
        right:27%;
      "></div>

      <div style="
        position:absolute;
        width:48%;
        height:43%;
        background:white;
        border:5px solid #111;
        border-radius:48%;
        left:26%;
        top:20%;
      ">

        <div style="
          position:absolute;
          width:19%;
          height:25%;
          background:#111;
          border-radius:50%;
          top:34%;
          left:22%;
          transform:rotate(25deg);
        "></div>

        <div style="
          position:absolute;
          width:19%;
          height:25%;
          background:#111;
          border-radius:50%;
          top:34%;
          right:22%;
          transform:rotate(-25deg);
        "></div>

        <div style="
          position:absolute;
          width:13%;
          height:9%;
          background:#111;
          border-radius:50%;
          left:43.5%;
          top:61%;
        "></div>

        <div style="
          position:absolute;
          width:20%;
          height:12%;
          left:40%;
          top:68%;
          border-bottom:4px solid #111;
          border-radius:50%;
        "></div>

      </div>

      <div style="
        position:absolute;
        width:39%;
        height:39%;
        background:#111;
        border-radius:45% 45% 35% 35%;
        left:30.5%;
        top:57%;
      ">

        <div style="
          position:absolute;
          width:58%;
          height:58%;
          background:white;
          border-radius:50%;
          left:21%;
          top:22%;
        "></div>

      </div>

      <div style="
        position:absolute;
        width:22%;
        height:38%;
        background:#111;
        border-radius:50%;
        top:60%;
        left:18%;
        transform:rotate(35deg);
      "></div>

      <div style="
        position:absolute;
        width:22%;
        height:38%;
        background:#111;
        border-radius:50%;
        top:60%;
        right:18%;
        transform:rotate(-35deg);
      "></div>

    </div>
  `;

  return panda;
}


/* =========================
   SHUFFLE
========================= */

function shuffle(array) {

  for (let i = array.length - 1; i > 0; i--) {

    const j = Math.floor(Math.random() * (i + 1));

    [array[i], array[j]] =
    [array[j], array[i]];
  }

  return array;
}


/* =========================
   CREATE PUZZLE
========================= */

function createPuzzle() {

  piecesContainer.innerHTML = "";

  let order = shuffle([...correctPositions]);

  order.forEach(correct => {

    const piece = document.createElement("div");

    piece.className = "piece";

    piece.dataset.correct = correct;

    piece.appendChild(createPiecePanda());

    addDragEvents(piece);

    piecesContainer.appendChild(piece);
  });
}


/* =========================
   DRAG / TOUCH
========================= */

function addDragEvents(piece) {

  let startX = 0;
  let startY = 0;
  let dragging = false;

  piece.addEventListener("pointerdown", function(e) {

    if (piece.dataset.locked === "true") return;

    e.preventDefault();

    dragging = true;

    startX = e.clientX;
    startY = e.clientY;

    piece.setPointerCapture(e.pointerId);

    piece.style.zIndex = 100;

    if (!gameStarted) {
      startTimer();
      gameStarted = true;
    }

  });


  piece.addEventListener("pointermove", function(e) {

    if (!dragging) return;

    const dx = e.clientX - startX;
    const dy = e.clientY - startY;

    piece.style.transform =
      `translate(${dx}px,${dy}px) scale(1.05)`;
  });


  piece.addEventListener("pointerup", function(e) {

    if (!dragging) return;

    dragging = false;

    piece.style.transform = "";

    piece.style.zIndex = "";

    moves++;

    movesDisplay.textContent = moves;

    checkDrop(piece);
  });

}


/* =========================
   CHECK DROP
========================= */

function checkDrop(piece) {

  const board =
    document.getElementById("board");

  const boardRect =
    board.getBoundingClientRect();

  const pieceRect =
    piece.getBoundingClientRect();

  const pieceCenterX =
    pieceRect.left + pieceRect.width / 2;

  const pieceCenterY =
    pieceRect.top + pieceRect.height / 2;

  const x =
    pieceCenterX - boardRect.left;

  const y =
    pieceCenterY - boardRect.top;

  const column =
    Math.floor(x / (boardRect.width / 3));

  const row =
    Math.floor(y / (boardRect.height / 3));

  if (
    column < 0 ||
    column > 2 ||
    row < 0 ||
    row > 2
  ) {

    wrongPiece(piece);
    return;
  }

  const target =
    row * 3 + column;

  const correct =
    Number(piece.dataset.correct);

  if (target === correct) {

    correctPiece(piece, target);

  } else {

    wrongPiece(piece);

  }
}


/* =========================
   CORRECT PIECE
========================= */

function correctPiece(piece, target) {

  const slot =
    document.getElementById("slot" + target);

  piece.dataset.locked = "true";

  piece.style.position = "absolute";

  piece.style.width =
    "33.3333%";

  piece.style.height =
    "33.3333%";

  piece.style.margin = "0";

  piece.style.padding = "0";

  piece.style.border =
    "2px solid #19a83b";

  piece.style.borderRadius = "0";

  piece.style.boxShadow = "none";

  piece.style.left =
    (target % 3) * 33.3333 + "%";

  piece.style.top =
    Math.floor(target / 3) * 33.3333 + "%";

  piece.style.transform = "";

  piece.style.zIndex = 5;

  /*
    Move the piece directly onto the board.
  */
  board.appendChild(piece);

  slot.classList.add("correct");

  completed++;

  message.textContent =
    "✅ Correct!";

  if (completed === 9) {

    finishGame();

  }

}


/* =========================
   WRONG PIECE
========================= */

function wrongPiece(piece) {

  piece.style.animation =
    "none";

  void piece.offsetWidth;

  piece.style.animation =
    "shake .3s";

  message.textContent =
    "❌ Try another place!";
}


/* =========================
   TIMER
========================= */

function startTimer() {

  if (timerInterval) return;

  timerInterval =
    setInterval(() => {

      seconds++;

      timerDisplay.textContent =
        seconds;

    }, 1000);
}


/* =========================
   FINISH
========================= */

function finishGame() {

  clearInterval(timerInterval);

  timerInterval = null;

  message.innerHTML =
    `🎉 Amazing! Picture Complete!<br>
     <span style="font-size:16px">
     Time: ${seconds}s &nbsp; | &nbsp;
     Moves: ${moves}
     </span>`;

  message.classList.add("win");

  document
    .getElementById("board")
    .classList.add("celebrate");

}


/* =========================
   NEW GAME
========================= */

function newGame() {

  clearInterval(timerInterval);

  timerInterval = null;

  moves = 0;
  seconds = 0;
  completed = 0;
  gameStarted = false;

  timerDisplay.textContent = "0";

  movesDisplay.textContent = "0";

  message.textContent =
    "Drag each piece into the black frame.";

  message.classList.remove("win");

  document
    .getElementById("board")
    .classList.remove("celebrate");

  /*
    Remove old pieces accidentally
    placed on board.
  */
  document
    .querySelectorAll("#board .piece")
    .forEach(p => p.remove());

  /*
    Reset slots.
  */
  document
    .querySelectorAll(".slot")
    .forEach(slot => {

      slot.classList.remove("correct");

    });

  createPuzzle();
}


/* =========================
   START GAME
========================= */

createPuzzle();

</script>

</body>
</html>
