/* ==================================================
   LEVEL
================================================== */

function setLevel(level){

    currentLevel = level;

    if(level === "easy"){

        ROWS = 3;
        COLS = 3;

    }

    if(level === "medium"){

        ROWS = 4;
        COLS = 4;

    }

    if(level === "hard"){

        ROWS = 5;
        COLS = 5;

    }

    CELL = SIZE / COLS;

    document
        .querySelectorAll(".levelBtn")
        .forEach(btn=>{
            btn.classList.remove("active");
        });

    if(level === "easy")
        document
            .getElementById("easyBtn")
            .classList.add("active");

    if(level === "medium")
        document
            .getElementById("mediumBtn")
            .classList.add("active");

    if(level === "hard")
        document
            .getElementById("hardBtn")
            .classList.add("active");

    newGame();
}


/* ==================================================
   AUDIO
================================================== */

let audioContext = null;

function getAudio(){

    if(!audioContext){

        audioContext =
            new (
                window.AudioContext ||
                window.webkitAudioContext
            )();

    }

    return audioContext;
}


function playSound(type){

    try{

        const ac = getAudio();

        const osc =
            ac.createOscillator();

        const gain =
            ac.createGain();

        osc.connect(gain);
        gain.connect(ac.destination);

        let frequency = 440;

        if(type === "correct")
            frequency = 680;

        if(type === "wrong")
            frequency = 180;

        if(type === "win")
            frequency = 850;

        osc.frequency.value =
            frequency;

        osc.type = "sine";

        gain.gain.setValueAtTime(
            0.0001,
            ac.currentTime
        );

        gain.gain.exponentialRampToValueAtTime(
            0.15,
            ac.currentTime + .02
        );

        gain.gain.exponentialRampToValueAtTime(
            0.0001,
            ac.currentTime + .25
        );

        osc.start();

        osc.stop(
            ac.currentTime + .27
        );

    }catch(e){}

}


/* ==================================================
   VIBRATION
================================================== */

function vibrate(pattern){

    try{

        if(
            navigator.vibrate
        ){

            navigator.vibrate(

        }

    }catch(e){}

}


/* ==================================================
   CLOUD
================================================== */

function drawCloud(
    c,
    x,
    y,
    s
){

    c.fillStyle="#ffffff";

    c.beginPath();

    c.arc(
        x,
        y,
        45*s,
        0,
        Math.PI*2
    );

    c.arc(
        x+45*s,
        y-18*s,
        55*s,
        0,
        Math.PI*2
    );

    c.arc(
        x+100*s,
        y,
        42*s,
        0,
        Math.PI*2
    );

    c.fill();

}

/* ==================================================
   JIGSAW EDGES
================================================== */

function createEdges(){

    const edges=[];

    for(
        let r=0;
        r<ROWS;
        r++
    ){

        edges[r]=[];

        for(
            let col=0;
            col<COLS;
            col++
        ){

            const top =
                r===0
                ? 0
                : -edges[r-1][col].bottom;

            const left =
                col===0
                ? 0
                : -edges[r][col-1].right;

            const right =
                col===COLS-1
                ? 0
                : (
                    Math.random()<.5
                    ? 1
                    : -1
                );

            const bottom =
                r===ROWS-1
                ? 0
                : (
                    Math.random()<.5
                    ? 1
                    : -1
                );

            edges[r][col]={
                top:top,
                right:right,
                bottom:bottom,
                left:left
            };

        }

    }

    return edges;

}


/* ==================================================
   TAB DRAWING
================================================== */

function drawTab(
    c,
    x1,
    y1,
    x2,
    y2,
    direction,
    horizontal
){

    const bulge =
        direction===1
        ? 38
        : -38;


    if(horizontal){

        const midX =
            (x1+x2)/2;

        const midY=y1;

        c.bezierCurveTo(
            x1+25,
            midY,
            midX-35,
            midY+bulge,
            midX,
            midY+bulge
        );

        c.bezierCurveTo(
            midX+35,
            midY+bulge,
            x2-25,
            midY,
            x2,
            midY
        );

    }else{

        const midX=x1;

        const midY=
            (y1+y2)/2;

        c.bezierCurveTo(
            midX,
            y1+25,
            midX+bulge,
            midY-35,
            midX+bulge,
            midY
        );

        c.bezierCurveTo(
            midX+bulge,
            midY+35,
            midX,
            y2-25,
            midX,
            y2
        );

    }

}


/* ==================================================
   JIGSAW PATH
================================================== */

function addJigsawPath(
    c,
    x,
    y,
    w,
    h,
    edges
){

    c.beginPath();


    /* TOP */

    c.moveTo(
        x,
        y
    );

    if(edges.top===0){

        c.lineTo(
            x+w,
            y
        );

    }else{

        c.lineTo(
            x+w*.38,
            y
        );

        drawTab(
            c,
            x+w*.38,
            y,
            x+w*.62,
            y,
            edges.top,
            true
        );

        c.lineTo(
            x+w,
            y
        );

    }


    /* RIGHT */

    if(edges.right===0){

        c.lineTo(
            x+w,
            y+h
        );

    }else{

        c.lineTo(
            x+w,
            y+h*.38
        );

        drawTab(
            c,
            x+w,
            y+h*.38,
            x+w,
            y+h*.62,
            edges.right,
            false
        );

        c.lineTo(
            x+w,
            y+h
        );

    }


    /* BOTTOM */

    if(edges.bottom===0){

        c.lineTo(
            x,
            y+h
        );

    }else{

        c.lineTo(
            x+w*.62,
            y+h
        );

        drawTab(
            c,
            x+w*.62,
            y+h,
            x+w*.38,
            y+h,
            edges.bottom,
            true
        );

        c.lineTo(
            x,
            y+h
        );

    }


    /* LEFT */

    if(edges.left===0){

        c.lineTo(
            x,
            y
        );

    }else{

        c.lineTo(
            x,
            y+h*.62
        );

        drawTab(
            c,
            x,
            y+h*.62,
            x,
            y+h*.38,
            edges.left,
            false
        );

        c.lineTo(
            x,
            y
        );

    }

    c.closePath();

}


/* ==================================================
   TARGET GRID
================================================== */

function createTargetGrid(){

    targetGrid.innerHTML="";

    for(
        let r=0;
        r<ROWS;
        r++
    ){

        for(
            let col=0;
            col<COLS;
            col++
        ){

            const cell =
                document.createElement(
                    "div"
                );

            cell.className=
                "targetCell";

            cell.style.width=
                (100/COLS)+"%";

            cell.style.height=
                (100/ROWS)+"%";

            cell.style.left=
                (col*100/COLS)+"%";

            cell.style.top=
                (r*100/ROWS)+"%";

            targetGrid.appendChild(
                cell
            );

        }

    }

}


/* ==================================================
   CREATE PIECES
================================================== */

function createPieces(){

    piecesContainer.innerHTML="";

    pieceData=[];

    const edges=
        createEdges();


    for(
        let r=0;
        r<ROWS;
        r++
    ){

        for(
            let col=0;
            col<COLS;
            col++
        ){

            const index =
                r*COLS+col;

            const canvas =
                document.createElement(
                    "canvas"
                );

            const pad=45;

            canvas.width=
                CELL+pad*2;

            canvas.height=
                CELL+pad*2;

            const c=
                canvas.getContext(
                    "2d"
                );


            /* MASK */

            c.save();

            addJigsawPath(
                c,
                pad,
                pad,
                CELL,
                CELL,
                edges[r][col]
            );

            c.clip();


            /* SAME PANDA IMAGE */

            c.drawImage(
                sourceCanvas,

                pad-col*CELL,

                pad-r*CELL
            );

            c.restore();


            /* BORDER */

            c.save();

            addJigsawPath(
                c,
                pad,
                pad,
                CELL,
                CELL,
                edges[r][col]
            );

            c.strokeStyle="#111";

            c.lineWidth=5;

            c.stroke();

            c.restore();


            const piece =
                document.createElement(
                    "div"
                );

            piece.className=
                "piece";

            piece.dataset.index=
                index;

            piece.appendChild(
                canvas
            );

            piecesContainer.appendChild(
                piece
            );


            pieceData.push({

                element:piece,

                index:index,

                row:r,

                col:col,

                placed:false

            });


            addDragEvents(
                piece
            );

        }

    }


    shufflePieces();

}


/* ==================================================
   SHUFFLE
================================================== */

function shufflePieces(){

    for(
        let i=pieceData.length-1;
        i>0;
        i--
    ){

        const j=
            Math.floor(
                Math.random()*
                (i+1)
            );

        [
            pieceData[i],
            pieceData[j]
        ]=[
            pieceData[j],
            pieceData[i]
        ];

    }


    pieceData.forEach(
        p=>{
            piecesContainer.appendChild(
                p.element
            );
        }
    );

}


/* ==================================================
   DRAG EVENTS
================================================== */

function addDragEvents(piece){

    let startX=0;
    let startY=0;

    let originalLeft=0;
    let originalTop=0;

    let dragging=false;


    piece.addEventListener(
        "pointerdown",
        e=>{

            if(
                piece.classList.contains(
                    "correct"
                )
            )
                return;


            dragging=true;


            try{
                piece.setPointerCapture(
                    e.pointerId
                );
            }catch(err){}


            const rect =
                piece.getBoundingClientRect();


            startX=e.clientX;
            startY=e.clientY;


            originalLeft=
                rect.left;

            originalTop=
                rect.top;


            piece.classList.add(
                "dragging"
            );


            piece.style.position=
                "fixed";

            piece.style.width=
                rect.width+"px";

            piece.style.height=
                rect.height+"px";

            piece.style.left=
                rect.left+"px";

            piece.style.top=
                rect.top+"px";

        }
    );


    piece.addEventListener(
        "pointermove",
        e=>{

            if(!dragging)
                return;


            const dx=
                e.clientX-startX;

            const dy=
                e.clientY-startY;


            piece.style.left=
                originalLeft+dx+"px";

            piece.style.top=
                originalTop+dy+"px";

        }
    );


    piece.addEventListener(
        "pointerup",
        e=>{

            if(!dragging)
                return;


            dragging=false;


            piece.classList.remove(
                "dragging"
            );


            checkDrop(
                piece
            );

        }
    );


    piece.addEventListener(
        "pointercancel",
        e=>{

            if(!dragging)
                return;


            dragging=false;


            piece.classList.remove(
                "dragging"
            );


            returnPiece(
                piece
            );

        }
    );

}


/* ==================================================
   CHECK DROP
================================================== */

function checkDrop(piece){

    moves++;

    movesEl.textContent=
        moves;


    const index=
        Number(
            piece.dataset.index
        );


    const row=
        Math.floor(
            index/COLS
        );

    const col=
        index%COLS;


    const boardRect=
        board.getBoundingClientRect();

    const pieceRect=
        piece.getBoundingClientRect();


    const centerX=
        pieceRect.left+
        pieceRect.width/2;

    const centerY=
        pieceRect.top+
        pieceRect.height/2;


    const targetX=
        boardRect.left+
        (col+.5)*
        boardRect.width/COLS;

    const targetY=
        boardRect.top+
        (row+.5)*
        boardRect.height/ROWS;


    const distance=
        Math.hypot(
            centerX-targetX,
            centerY-targetY
        );


    if(
        distance<
        boardRect.width*
        (
            .20/COLS*3
        )
    ){

        placeCorrect(
            piece,
            row,
            col
        );

    }else{

        wrongPiece(
            piece
        );

    }

}


/* ==================================================
   CORRECT PIECE
================================================== */

function placeCorrect(
    piece,
    row,
    col
){

    const boardRect=
        board.getBoundingClientRect();


    const cellW=
        boardRect.width/COLS;

    const cellH=
        boardRect.height/ROWS;


    piece.classList.add(
        "correct"
    );


    piece.style.position=
        "absolute";


    piece.style.width=
        cellW+"px";

    piece.style.height=
        cellH+"px";


    piece.style.left=
        col*cellW+"px";

    piece.style.top=
        row*cellH+"px";


    piece.style.transform=
        "scale(1)";


    board.appendChild(
        piece
    );


    const data=
        pieceData.find(
            p =>
            p.element===piece
        );


    if(data)
        data.placed=true;


    completed++;


    playSound(
        "correct"
    );

    vibrate(
        [30]
    );


    messageEl.textContent=
        "🎉 Correct!";


    updateScore();


    if(
        completed===
        ROWS*COLS
    ){

        finishGame();

    }

}


/* ==================================================
   WRONG PIECE
================================================== */

function wrongPiece(piece){

    playSound(
        "wrong"
    );

    vibrate(
        [60,40,60]
    );


    lives--;


    updateLives();


    messageEl.textContent=
        "❌ Wrong place!";


    piece.classList.add(
        "wrong"
    );


    setTimeout(
        ()=>{

            piece.classList.remove(
                "wrong"
            );

            returnPiece(
                piece
            );

        },
        400
    );


    if(
        lives<=0
    ){

        gameOver();

    }

}


/* ==================================================
   RETURN
================================================== */

function returnPiece(piece){

    piece.style.position=
        "relative";

    piece.style.left="";

    piece.style.top="";

    piece.style.width="";

    piece.style.height="";

    piecesContainer.appendChild(
        piece
    );

}


/* ==================================================
   LIVES
================================================== */

function updateLives(){

    let hearts="";

    for(
        let i=0;
        i<3;
        i++
    ){

        hearts +=
            i<lives
            ? "❤️"
            : "🖤";

    }

    livesEl.textContent=
        hearts;

}


/* ==================================================
   GAME OVER
================================================== */

function gameOver(){

    clearInterval(
        timerInterval
    );


    messageEl.textContent=
        "💔 Game Over! Try again.";


    setTimeout(
        ()=>{
            alert(
                "💔 Game Over!\n\nTap New Game to try again."
            );
        },
        100
    );

}


/* ==================================================
   SCORE
================================================== */

function updateScore(){

    let penalty=
        moves*2+
        Math.floor(
            seconds/5
        );


    if(
        currentLevel==="medium"
    ){

        penalty=
            moves*1.5+
            Math.floor(
                seconds/4
            );

    }


    if(
        currentLevel==="hard"
    ){

        penalty=
            moves+
            Math.floor(
                seconds/3
            );

    }


    let value=
        100-
        penalty;


    if(value<10)
        value=10;


    scoreEl.textContent=
        Math.round(value);

}


/* ==================================================
   TIMER
================================================== */

function startTimer(){

    clearInterval(
        timerInterval
    );


    timerInterval=
        setInterval(
            ()=>{

                seconds++;


                const min=
                    String(
                        Math.floor(
                            seconds/60
                        )
                    ).padStart(
                        2,
                        "0"
                    );


                const sec=
                    String(
                        seconds%60
                    ).padStart(
                        2,
                        "0"
                    );


                timerEl.textContent=
                    min+":"+sec;


                updateScore();

            },
            1000
        );

}


/* ==================================================
   BEST SCORE
================================================== */

function bestScoreKey(){

    return(
        "completePic_bestScore_"+
        currentLevel
    );

}


function bestTimeKey(){

    return(
        "completePic_bestTime_"+
        currentLevel
    );

}


function loadBest(){

    const score=
        Number(
            localStorage.getItem(
                bestScoreKey()
            )||0
        );


    const time=
        Number(
            localStorage.getItem(
                bestTimeKey()
            )||0
        );


    bestScoreEl.textContent=
        score;


    if(time>0){

        bestTimeEl.textContent=
            formatTime(time);

    }else{

        bestTimeEl.textContent=
            "--:--";

    }

}


/* ==================================================
   SAVE BEST
================================================== */

function saveBest(){

    const score=
        Number(
            scoreEl.textContent
        );


    const oldScore=
        Number(
            localStorage.getItem(
                bestScoreKey()
            )||0
        );


    if(
        score>oldScore
    ){

        localStorage.setItem(
            bestScoreKey(),
            score
        );

    }


    const oldTime=
        Number(
            localStorage.getItem(
                bestTimeKey()
            )||0
        );


    if(
        oldTime===0 ||
        seconds<oldTime
    ){

        localStorage.setItem(
            bestTimeKey(),
            seconds
        );

    }


    loadBest();

}


/* ==================================================
   FORMAT TIME
================================================== */

function formatTime(value){

    const min=
        String(
            Math.floor(
                value/60
            )
        ).padStart(
            2,
            "0"
        );


    const sec=
        String(
            value%60
        ).padStart(
            2,
            "0"
        );


    return(
        min+":"+sec
    );

}


/* ==================================================
   WIN
================================================== */

function finishGame(){

    clearInterval(
        timerInterval
    );


    playSound(
        "win"
    );


    vibrate(
        [100,50,100,50,200]
    );


    board.classList.add(
        "boardWin"
    );


    targetCanvas.style.opacity=
        "1";


    const finalScore=
        Number(
            scoreEl.textContent
        );


    saveBest();


    messageEl.textContent=
        "🏆 Amazing! Picture completed!";


    winText.innerHTML=
        `
        Level:
        <b>
        ${currentLevel.toUpperCase()}
        </b>
        <br><br>

        ⏱ Time:
        <b>
        ${timerEl.textContent}
        </b>

        <br>

        👣 Moves:
        <b>
        ${moves}
        </b>

        <br>

        ⭐ Score:
        <b>
        ${finalScore}
        </b>

        <br><br>

        🏆 Best score:
        <b>
        ${bestScoreEl.textContent}
        </b>
        `;


    winBox.style.display=
        "block";


    createConfetti();

}


/* ==================================================
   CONFETTI
================================================== */

function createConfetti(){

    const canvas=
        document.getElementById(
            "confetti"
        );

    const c=
        canvas.getContext(
            "2d"
        );


    canvas.width=
        window.innerWidth;

    canvas.height=
        window.innerHeight;


    const pieces=[];


    for(
        let i=0;
        i<100;
        i++
    ){

        pieces.push({

            x:
                Math.random()*
                canvas.width,

            y:
                -Math.random()*
                canvas.height,

            size:
                5+
                Math.random()*8,

            speed:
                2+
                Math.random()*4,

            angle:
                Math.random()*
                Math.PI*2,

            spin:
                -.1+
                Math.random()*.2

        });

    }


    let frame=0;


    function animate(){

        c.clearRect(
            0,
            0,
            canvas.width,
            canvas.height
        );


        pieces.forEach(
            p=>{

                p.y +=
                    p.speed;

                p.angle +=
                    p.spin;


                c.save();

                c.translate(
                    p.x,
                    p.y
                );

                c.rotate(
                    p.angle
                );


                c.fillStyle=
                    [
                        "#e74c3c",
                        "#3498db",
                        "#f1c40f",
                        "#2ecc71",
                        "#9b59b6"
                    ][
                        Math.floor(
                            Math.random()*5
                        )
                    ];


                c.fillRect(
                    -p.size/2,
                    -p.size/2,
                    p.size,
                    p.size
                );


                c.restore();

            }
        );


        frame++;


        if(
            frame<180
        ){

            requestAnimationFrame(
                animate
            );

        }else{

            c.clearRect(
                0,
                0,
                canvas.width,
                canvas.height
            );

        }

    }


    animate();

}


/* ==================================================
   NEW GAME
================================================== */

function newGame(){

    clearInterval(
        timerInterval
    );


    moves=0;

    seconds=0;

    completed=0;

    lives=3;


    movesEl.textContent=
        "0";

    timerEl.textContent=
        "00:00";

    scoreEl.textContent=
        "100";


    updateLives();


    messageEl.textContent=
        "Drag each piece into its correct place.";


    winBox.style.display=
        "none";


    board.classList.remove(
        "boardWin"
    );


    targetCanvas.style.opacity=
        ".12";


    document
        .getElementById(
            "confetti"
        )
        .getContext("2d")
        .clearRect(
            0,
            0,
            window.innerWidth,
            window.innerHeight
        );


    drawPanda();

    createTargetGrid();

    createPieces();

    loadBest();

    startTimer();

}


/* ==================================================
   START GAME
================================================== */

newGame();

</script>
