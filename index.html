<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Complete the Pic V2.5</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    padding:0;
    min-height:100%;
    font-family:Arial,sans-serif;
    background:linear-gradient(#f8fbff,#eef4f8);
    color:#222;
}

body{
    overflow-x:hidden;
}

header{
    text-align:center;
    padding:14px 10px 8px;
}

h1{
    margin:0;
    font-size:30px;
}

.subtitle{
    margin-top:5px;
    color:#666;
    font-size:14px;
}

.stats{
    display:flex;
    justify-content:center;
    gap:8px;
    flex-wrap:wrap;
    margin:10px auto;
}

.stat{
    background:white;
    border:1px solid #ddd;
    border-radius:12px;
    padding:7px 12px;
    min-width:78px;
    box-shadow:0 2px 7px rgba(0,0,0,.07);
    text-align:center;
}

.stat b{
    display:block;
    font-size:17px;
}

.stat span{
    font-size:11px;
    color:#777;
}

#game{
    width:100%;
    max-width:650px;
    margin:auto;
    padding:5px 12px 30px;
}

#frameWrap{
    display:flex;
    justify-content:center;
    margin:10px auto 20px;
}

#frame{
    position:relative;
    width:min(88vw,420px);
    aspect-ratio:1/1;
    background:white;
    border:3px solid #bfc7ce;
    border-radius:10px;
    box-shadow:
        0 5px 18px rgba(0,0,0,.10),
        inset 0 0 0 1px #fff;
    overflow:visible;
}

#board{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    border-radius:7px;
}

#lockedPieces{
    position:absolute;
    inset:0;
    pointer-events:none;
    overflow:visible;
}

#piecesTitle{
    text-align:center;
    font-size:14px;
    color:#777;
    margin:5px 0 8px;
}

#piecesArea{
    min-height:240px;
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    align-items:center;
    gap:8px;
    padding:12px 5px 20px;
}

.piece{
    position:relative;
    width:92px;
    height:92px;
    touch-action:none;
    user-select:none;
    -webkit-user-select:none;
    cursor:grab;
    z-index:20;
}

.piece.dragging{
    cursor:grabbing;
    z-index:9999;
    filter:drop-shadow(0 8px 13px rgba(0,0,0,.25));
}

.piece svg{
    width:100%;
    height:100%;
    display:block;
    overflow:visible;
}

.piece.locked{
    position:absolute !important;
    margin:0 !important;
    cursor:default;
    z-index:5;
    pointer-events:none;
    filter:none;
}

.buttons{
    display:flex;
    justify-content:center;
    gap:10px;
    flex-wrap:wrap;
    margin-top:5px;
}

button{
    border:0;
    border-radius:12px;
    padding:12px 22px;
    font-size:16px;
    font-weight:bold;
    background:#222;
    color:white;
    cursor:pointer;
    box-shadow:0 3px 8px rgba(0,0,0,.15);
}

button:active{
    transform:scale(.97);
}

#message{
    min-height:28px;
    text-align:center;
    margin:8px;
    font-weight:bold;
}

#winScreen{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.55);
    display:none;
    align-items:center;
    justify-content:center;
    z-index:20000;
    padding:20px;
}

.winBox{
    background:white;
    border-radius:20px;
    padding:28px;
    width:min(90vw,380px);
    text-align:center;
    box-shadow:0 15px 45px rgba(0,0,0,.3);
}

.winBox h2{
    margin-top:0;
    font-size:28px;
}

.winBox p{
    color:#555;
    line-height:1.6;
}

#confetti{
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:19999;
    overflow:hidden;
}

.confettiPiece{
    position:absolute;
    width:9px;
    height:14px;
    top:-20px;
    animation:fall 2.8s linear forwards;
}

@keyframes fall{
    to{
        transform:translateY(110vh) rotate(720deg);
        opacity:0;
    }
}

.shake{
    animation:shake .35s ease;
}

@keyframes shake{
    0%,100%{transform:translateX(0)}
    25%{transform:translateX(-10px)}
    50%{transform:translateX(10px)}
    75%{transform:translateX(-7px)}
}

@media(max-width:400px){
    h1{
        font-size:25px;
    }

    .piece{
        width:82px;
        height:82px;
    }

    #piecesArea{
        min-height:220px;
        gap:5px;
    }
}
</style>
</head>

<body>

<header>
    <h1>🧩 Complete the Pic</h1>
    <div class="subtitle">Pick the pieces. Complete the picture!</div>

    <div class="stats">
        <div class="stat">
            <b id="time">00:00</b>
            <span>TIME</span>
        </div>

        <div class="stat">
            <b id="moves">0</b>
            <span>MOVES</span>
        </div>

        <div class="stat">
            <b id="score">100</b>
            <span>SCORE</span>
        </div>

        <div class="stat">
            <b id="best">—</b>
            <span>BEST</span>
        </div>
    </div>
</header>

<div id="game">

    <div id="frameWrap">
        <div id="frame">

            <canvas id="board"></canvas>

            <div id="lockedPieces"></div>

        </div>
    </div>

    <div id="piecesTitle">
        Drag each piece into the correct position
    </div>

    <div id="piecesArea"></div>

    <div id="message"></div>

    <div class="buttons">
        <button onclick="newGame()">🔄 New Game</button>
    </div>

</div>

<div id="winScreen">
    <div class="winBox">
        <h2>🎉 Picture Complete!</h2>

        <p>
            Excellent work!<br>
            You completed the Panda picture.
        </p>

        <p>
            <b>Time:</b> <span id="finalTime">00:00</span><br>
            <b>Moves:</b> <span id="finalMoves">0</span><br>
            <b>Score:</b> <span id="finalScore">100</span>
        </p>

        <button onclick="newGame()">▶ Play Again</button>
    </div>
</div>

<div id="confetti"></div>

<script>

const ROWS = 3;
const COLS = 3;

const pandaImage = new Image();
pandaImage.src = "panda.png";

const board = document.getElementById("board");
const boardCtx = board.getContext("2d");

const frame = document.getElementById("frame");
const piecesArea = document.getElementById("piecesArea");
const lockedPieces = document.getElementById("lockedPieces");

const timeEl = document.getElementById("time");
const movesEl = document.getElementById("moves");
const scoreEl = document.getElementById("score");
const bestEl = document.getElementById("best");
const messageEl = document.getElementById("message");

let seconds = 0;
let moves = 0;
let score = 100;
let timer = null;
let gameStarted = false;
let lockedCount = 0;

let horizontalEdges = [];
let verticalEdges = [];

let draggingPiece = null;
let dragOffsetX = 0;
let dragOffsetY = 0;

let audioContext = null;


/* =========================
   BEST SCORE
========================= */

function getBestScore(){
    return localStorage.getItem("completePic_v25_bestScore");
}

function getBestTime(){
    return localStorage.getItem("completePic_v25_bestTime");
}

function showBest(){

    const bestScore = getBestScore();

    if(bestScore){
        bestEl.textContent = bestScore;
    }else{
        bestEl.textContent = "—";
    }
}


/* =========================
   TIMER
========================= */

function startTimer(){

    if(timer) return;

    timer = setInterval(()=>{

        if(!gameStarted) return;

        seconds++;

        updateStats();

    },1000);
}

function stopTimer(){

    if(timer){
        clearInterval(timer);
        timer = null;
    }
}

function formatTime(sec){

    const m = Math.floor(sec / 60);
    const s = sec % 60;

    return String(m).padStart(2,"0") + ":" +
           String(s).padStart(2,"0");
}


/* =========================
   STATS
========================= */

function updateStats(){

    timeEl.textContent = formatTime(seconds);
    movesEl.textContent = moves;

    score = Math.max(
        0,
        100 - moves * 2 - Math.floor(seconds / 5)
    );

    scoreEl.textContent = score;
}


/* =========================
   SOUND
========================= */

function sound(type){

    try{

        if(!audioContext){
            audioContext =
                new (window.AudioContext ||
                     window.webkitAudioContext)();
        }

        const osc = audioContext.createOscillator();
        const gain = audioContext.createGain();

        osc.connect(gain);
        gain.connect(audioContext.destination);

        if(type === "correct"){
            osc.frequency.value = 720;
        }
        else if(type === "wrong"){
            osc.frequency.value = 180;
        }
        else{
            osc.frequency.value = 950;
        }

        gain.gain.value = 0.06;

        osc.start();

        osc.stop(
            audioContext.currentTime + 0.12
        );

    }catch(e){}
}


/* =========================
   VIBRATION
========================= */

function vibrate(pattern){

    if(navigator.vibrate){
        navigator.vibrate(pattern);
    }
}


/* =========================
   BOARD
========================= */

function resizeBoard(){

    const rect = frame.getBoundingClientRect();

    const dpr = window.devicePixelRatio || 1;

    board.width = rect.width * dpr;
    board.height = rect.height * dpr;

    board.style.width = rect.width + "px";
    board.style.height = rect.height + "px";

    boardCtx.setTransform(
        dpr,0,0,dpr,0,0
    );

    drawBoard();

    repositionLockedPieces();
}


/* =========================
   DRAW PANDA GUIDE
========================= */

function drawBoard(){

    const w = frame.clientWidth;
    const h = frame.clientHeight;

    boardCtx.clearRect(0,0,w,h);

    boardCtx.fillStyle = "#ffffff";
    boardCtx.fillRect(0,0,w,h);

    if(!pandaImage.complete ||
       !pandaImage.naturalWidth){
        return;
    }

    boardCtx.globalAlpha = 0.09;

    boardCtx.drawImage(
        pandaImage,
        0,
        0,
        w,
        h
    );

    boardCtx.globalAlpha = 1;

    /*
       Very light 3×3 guide lines
    */

    boardCtx.strokeStyle =
        "rgba(120,130,140,.18)";

    boardCtx.lineWidth = 1;

    for(let i=1;i<3;i++){

        const x = w * i / 3;

        boardCtx.beginPath();
        boardCtx.moveTo(x,0);
        boardCtx.lineTo(x,h);
        boardCtx.stroke();
    }

    for(let i=1;i<3;i++){

        const y = h * i / 3;

        boardCtx.beginPath();
        boardCtx.moveTo(0,y);
        boardCtx.lineTo(w,y);
        boardCtx.stroke();
    }
}


/* =========================
   INTERESTING EDGE TYPES
=========================

   Each internal edge has:
   - direction
   - shape type

   1  = outward
  -1  = inward
*/

function randomSign(){

    return Math.random() < .5 ? 1 : -1;
}

function createEdges(){

    horizontalEdges = [];
    verticalEdges = [];

    /*
       Horizontal boundaries
       2 rows × 3 columns
    */

    for(let r=0;r<ROWS-1;r++){

        horizontalEdges[r] = [];

        for(let c=0;c<COLS;c++){

            horizontalEdges[r][c] = {
                sign: randomSign(),
                style: Math.floor(Math.random()*4)
            };
        }
    }

    /*
       Vertical boundaries
       3 rows × 2 columns
    */

    for(let r=0;r<ROWS;r++){

        verticalEdges[r] = [];

        for(let c=0;c<COLS-1;c++){

            verticalEdges[r][c] = {
                sign: randomSign(),
                style: Math.floor(Math.random()*4)
            };
        }
    }
}


/* =========================
   JIGSAW EDGE
========================= */

function edgePath(
    type,
    sign,
    style,
    S
){

    const P = 17;

    let d = sign * P;

    let path = "";

    /*
       style 0:
       large round bulb
    */

    if(style === 0){

        path +=
        `L ${S*.30} 0
         C ${S*.36} ${d*.15},
           ${S*.38} ${d},
           ${S*.50} ${d}
         C ${S*.62} ${d},
           ${S*.64} ${d*.15},
           ${S*.70} 0
         L ${S} 0`;
    }

    /*
       style 1:
       narrow rounded tab
    */

    else if(style === 1){

        path +=
        `L ${S*.38} 0
         C ${S*.42} ${d*.15},
           ${S*.43} ${d*.85},
           ${S*.50} ${d*.85}
         C ${S*.57} ${d*.85},
           ${S*.58} ${d*.15},
           ${S*.62} 0
         L ${S} 0`;
    }

    /*
       style 2:
       asymmetric bulb
    */

    else if(style === 2){

        path +=
        `L ${S*.25} 0
         C ${S*.34} ${d*.10},
           ${S*.38} ${d*.95},
           ${S*.53} ${d}
         C ${S*.65} ${d*.95},
           ${S*.63} ${d*.20},
           ${S*.74} 0
         L ${S} 0`;
    }

    /*
       style 3:
       double curve
    */

    else{

        path +=
        `L ${S*.30} 0
         C ${S*.39} ${d*.05},
           ${S*.40} ${d*.75},
           ${S*.47} ${d*.75}
         C ${S*.54} ${d*.75},
           ${S*.54} ${d*.10},
           ${S*.61} ${d}
         C ${S*.69} ${d*.80},
           ${S*.67} ${d*.10},
           ${S*.76} 0
         L ${S} 0`;
    }

    return path;
}


/* =========================
   MAKE PIECE PATH
========================= */

function makePiecePath(row,col){

    const S = 100;

    let path = `M 0 0`;

    /*
       TOP
    */

    if(row === 0){

        path += `L ${S} 0`;
    }
    else{

        const e = horizontalEdges[row-1][col];

        path += edgePath(
            "top",
            -e.sign,
            e.style,
            S
        );
    }

    /*
       RIGHT
    */

    if(col === COLS-1){

        path += `L ${S} ${S}`;
    }
    else{

        const e = verticalEdges[row][col];

        path += edgePath(
            "right",
            e.sign,
            e.style,
            S
        );

        /*
           rotate right-edge geometry
           by using transformed SVG group
           handled below
        */

    }

    /*
       Instead of relying on a single
       path orientation, build with
       SVG path using four transformed
       edge segments.
    */

    return createFullSVG(row,col);
}


/* =========================
   CREATE FULL SVG
========================= */

function createFullSVG(row,col){

    const S = 100;

    const svgNS =
        "http://www.w3.org/2000/svg";

    const svg =
        document.createElementNS(svgNS,"svg");

    svg.setAttribute(
        "viewBox",
        "-20 -20 140 140"
    );

    svg.setAttribute(
        "preserveAspectRatio",
        "none"
    );

    /*
       Different slight rotations make
       the pieces visually less repetitive.
    */

    const path =
        document.createElementNS(
            svgNS,
            "path"
        );

    let d = "M 0 0";

    /* TOP */

    if(row === 0){

        d += " L 100 0";

    }else{

        const e =
            horizontalEdges[row-1][col];

        d += horizontalSegment(
            e.sign,
            e.style,
            false
        );
    }

    /* RIGHT */

    if(col === COLS-1){

        d += " L 100 100";

    }else{

        const e =
            verticalEdges[row][col];

        d += verticalSegment(
            e.sign,
            e.style,
            true
        );
    }

    /* BOTTOM */

    if(row === ROWS-1){

        d += " L 0 100";

    }else{

        const e =
            horizontalEdges[row][col];

        d += horizontalSegment(
            e.sign,
            e.style,
            true
        );
    }

    /* LEFT */

    if(col === 0){

        d += " L 0 0";

    }else{

        const e =
            verticalEdges[row][col-1];

        d += verticalSegment(
            e.sign,
            e.style,
            false
        );
    }

    d += " Z";

    path.setAttribute("d",d);

    path.setAttribute(
        "fill",
        "white"
    );

    path.setAttribute(
        "stroke",
        "rgba(50,50,50,.55)"
    );

    path.setAttribute(
        "stroke-width",
        "1.8"
    );

    path.setAttribute(
        "stroke-linejoin",
        "round"
    );

    svg.appendChild(path);

    return svg;
}


/* =========================
   HORIZONTAL SEGMENT
========================= */

function horizontalSegment(
    sign,
    style,
    reverse
){

    let result = "";

    const s = reverse ? -1 : 1;

    const start =
        reverse ? " L 100 100" : "";

    /*
       Build from left to right.
       For bottom edge we transform
       the coordinate system logically.
    */

    if(!reverse){

        const d = sign * 17;

        if(style===0){

            result =
            ` L 30 0
              C 36 ${d*.15},38 ${d},50 ${d}
              C 62 ${d},64 ${d*.15},70 0
              L 100 0`;

        }else if(style===1){

            result =
            ` L 38 0
              C 42 ${d*.15},43 ${d*.85},50 ${d*.85}
              C 57 ${d*.85},58 ${d*.15},62 0
              L 100 0`;

        }else if(style===2){

            result =
            ` L 25 0
              C 34 ${d*.1},38 ${d*.95},53 ${d}
              C 65 ${d*.95},63 ${d*.2},74 0
              L 100 0`;

        }else{

            result =
            ` L 30 0
              C 39 ${d*.05},40 ${d*.75},47 ${d*.75}
              C 54 ${d*.75},54 ${d*.1},61 ${d}
              C 69 ${d*.8},67 ${d*.1},76 0
              L 100 0`;
        }

    }else{

        /*
           Bottom edge is generated
           from right to left.
        */

        const d = -sign * 17;

        if(style===0){

            result =
            ` L 70 100
              C 64 ${100+d*.15},62 ${100+d},50 ${100+d}
              C 38 ${100+d},36 ${100+d*.15},30 100
              L 0 100`;

        }else if(style===1){

            result =
            ` L 62 100
              C 58 ${100+d*.15},57 ${100+d*.85},50 ${100+d*.85}
              C 43 ${100+d*.85},42 ${100+d*.15},38 100
              L 0 100`;

        }else if(style===2){

            result =
            ` L 75 100
              C 66 ${100+d*.1},62 ${100+d*.95},47 ${100+d}
              C 35 ${100+d*.95},37 ${100+d*.2},26 100
              L 0 100`;

        }else{

            result =
            ` L 70 100
              C 61 ${100+d*.05},60 ${100+d*.75},53 ${100+d*.75}
              C 46 ${100+d*.75},46 ${100+d*.1},39 ${100+d}
              C 31 ${100+d*.8},33 ${100+d*.1},24 100
              L 0 100`;
        }
    }

    return result;
}


/* =========================
   VERTICAL SEGMENT
========================= */

function verticalSegment(
    sign,
    style,
    rightSide
){

    const d = sign * 17;

    let result = "";

    if(rightSide){

        if(style===0){

            result =
            ` L 100 30
              C ${100+d*.15} 36,
                ${100+d} 38,
                ${100+d} 50
              C ${100+d} 62,
                ${100+d*.15} 64,
                100 70
              L 100 100`;

        }else if(style===1){

            result =
            ` L 100 38
              C ${100+d*.15} 42,
                ${100+d*.85} 43,
                ${100+d*.85} 50
              C ${100+d*.85} 57,
                ${100+d*.15} 58,
                100 62
              L 100 100`;

        }else if(style===2){

            result =
            ` L 100 25
              C ${100+d*.1} 34,
                ${100+d*.95} 38,
                ${100+d} 53
              C ${100+d*.95} 65,
                ${100+d*.2} 63,
                100 74
              L 100 100`;

        }else{

            result =
            ` L 100 30
              C ${100+d*.05} 39,
                ${100+d*.75} 40,
                ${100+d*.75} 47
              C ${100+d*.75} 54,
                ${100+d*.1} 54,
                ${100+d} 61
              C ${100+d*.8} 69,
                ${100+d*.1} 67,
                100 76
              L 100 100`;
        }

    }else{

        /*
           Left side bottom-to-top
        */

        const d2 = -sign * 17;

        if(style===0){

            result =
            ` L 0 70
              C ${d2*.15} 64,
                ${d2} 62,
                ${d2} 50
              C ${d2} 38,
                ${d2*.15} 36,
                0 30
              L 0 0`;

        }else if(style===1){

            result =
            ` L 0 62
              C ${d2*.15} 58,
                ${d2*.85} 57,
                ${d2*.85} 50
              C ${d2*.85} 43,
                ${d2*.15} 42,
                0 38
              L 0 0`;

        }else if(style===2){

            result =
            ` L 0 75
              C ${d2*.1} 66,
                ${d2*.95} 62,
                ${d2} 47
              C ${d2*.95} 35,
                ${d2*.2} 37,
                0 26
              L 0 0`;

        }else{

            result =
            ` L 0 70
              C ${d2*.05} 61,
                ${d2*.75} 60,
                ${d2*.75} 53
              C ${d2*.75} 46,
                ${d2*.1} 46,
                ${d2} 39
              C ${d2*.8} 31,
                ${d2*.1} 33,
                0 24
              L 0 0`;
        }
    }

    return result;
}


/* =========================
   CREATE PUZZLE PIECES
========================= */

function createPieces(){

    piecesArea.innerHTML = "";

    const positions = [];

    for(let r=0;r<ROWS;r++){

        for(let c=0;c<COLS;c++){

            positions.push({
                row:r,
                col:c
            });
        }
    }

    /*
       Shuffle pieces
    */

    positions.sort(
        ()=>Math.random()-.5
    );

    positions.forEach(pos=>{

        const piece =
            document.createElement("div");

        piece.className = "piece";

        piece.dataset.row = pos.row;
        piece.dataset.col = pos.col;

        piece.appendChild(
            createFullSVG(
                pos.row,
                pos.col
            )
        );

        piecesArea.appendChild(piece);

        setupDrag(piece);
    });
}


/* =========================
   DRAG SETUP
========================= */

function setupDrag(piece){

    piece.addEventListener(
        "pointerdown",
        startDrag
    );
}


/* =========================
   START DRAG
========================= */

function startDrag(e){

    if(this.classList.contains("locked")){
        return;
    }

    e.preventDefault();

    draggingPiece = this;

    const rect =
        this.getBoundingClientRect();

    dragOffsetX =
        e.clientX - rect.left;

    dragOffsetY =
        e.clientY - rect.top;

    /*
       Move to body so it can cross
       the frame freely.
    */

    document.body.appendChild(this);

    this.style.position = "fixed";
    this.style.left = rect.left + "px";
    this.style.top = rect.top + "px";

    this.classList.add("dragging");

    this.setPointerCapture?.(e.pointerId);

    if(!gameStarted){

        gameStarted = true;

        startTimer();
    }

    sound("pickup");
}


/* =========================
   POINTER MOVE
========================= */

document.addEventListener(
    "pointermove",
    e=>{

        if(!draggingPiece){
            return;
        }

        e.preventDefault();

        draggingPiece.style.left =
            (e.clientX - dragOffsetX) + "px";

        draggingPiece.style.top =
            (e.clientY - dragOffsetY) + "px";
    },
    {passive:false}
);


/* =========================
   POINTER UP
========================= */

document.addEventListener(
    "pointerup",
    e=>{

        if(!draggingPiece){
            return;
        }

        const piece =
            draggingPiece;

        draggingPiece = null;

        piece.classList.remove(
            "dragging"
        );

        checkDrop(piece);

    }
);


/* =========================
   CHECK DROP
========================= */

function checkDrop(piece){

    const frameRect =
        frame.getBoundingClientRect();

    const pieceRect =
        piece.getBoundingClientRect();

    const pieceCenterX =
        pieceRect.left +
        pieceRect.width/2;

    const pieceCenterY =
        pieceRect.top +
        pieceRect.height/2;

    const cellW =
        frameRect.width / COLS;

    const cellH =
        frameRect.height / ROWS;

    let col =
        Math.floor(
            (pieceCenterX -
             frameRect.left) /
            cellW
        );

    let row =
        Math.floor(
            (pieceCenterY -
             frameRect.top) /
            cellH
        );

    /*
       Keep within board
    */

    col = Math.max(
        0,
        Math.min(COLS-1,col)
    );

    row = Math.max(
        0,
        Math.min(ROWS-1,row)
    );

    const correctRow =
        Number(piece.dataset.row);

    const correctCol =
        Number(piece.dataset.col);

    const targetX =
        frameRect.left +
        correctCol * cellW +
        cellW/2;

    const targetY =
        frameRect.top +
        correctRow * cellH +
        cellH/2;

    const dx =
        pieceCenterX - targetX;

    const dy =
        pieceCenterY - targetY;

    const distance =
        Math.sqrt(dx*dx + dy*dy);

    /*
       Very generous tolerance.
    */

    const tolerance =
        Math.min(cellW,cellH) * 0.70;

    if(
        row === correctRow &&
        col === correctCol &&
        distance <= tolerance
    ){

        lockPiece(
            piece,
            correctRow,
            correctCol
        );

    }else{

        wrongPlacement(piece);
    }
}


/* =========================
   LOCK PIECE
========================= */

function lockPiece(
    piece,
    row,
    col
){

    const frameRect =
        frame.getBoundingClientRect();

    const cellW =
        frame.clientWidth / COLS;

    const cellH =
        frame.clientHeight / ROWS;

    /*
       Move inside frame overlay.
    */

    lockedPieces.appendChild(piece);

    piece.classList.add("locked");

    piece.style.width =
        cellW + "px";

    piece.style.height =
        cellH + "px";

    piece.style.left =
        (col * cellW) + "px";

    piece.style.top =
        (row * cellH) + "px";

    piece.style.position =
        "absolute";

    piece.dataset.locked = "true";

    lockedCount++;
    moves++;

    updateStats();

    sound("correct");
    vibrate(35);

    messageEl.textContent =
        "🎉 Great! Correct piece!";

    if(lockedCount === ROWS * COLS){

        finishGame();
    }
}


/* =========================
   WRONG PIECE
========================= */

function wrongPlacement(piece){

    moves++;

    updateStats();

    sound("wrong");
    vibrate([40,30,40]);

    messageEl.textContent =
        "❌ Not there. Try again!";

    piece.classList.add("shake");

    setTimeout(()=>{

        piece.classList.remove(
            "shake"
        );

        returnPiece(piece);

    },350);
}


/* =========================
   RETURN PIECE
========================= */

function returnPiece(piece){

    piecesArea.appendChild(piece);

    piece.style.position =
        "relative";

    piece.style.left = "";
    piece.style.top = "";

    piece.style.width = "";
    piece.style.height = "";

    piece.style.margin = "";

    piece.dataset.locked = "false";
}


/* =========================
   REPOSITION LOCKED PIECES
========================= */

function repositionLockedPieces(){

    if(!lockedPieces){
        return;
    }

    const cellW =
        frame.clientWidth / COLS;

    const cellH =
        frame.clientHeight / ROWS;

    document
        .querySelectorAll(
            "#lockedPieces .piece"
        )
        .forEach(piece=>{

            const row =
                Number(piece.dataset.row);

            const col =
                Number(piece.dataset.col);

            piece.style.width =
                cellW + "px";

            piece.style.height =
                cellH + "px";

            piece.style.left =
                col * cellW + "px";

            piece.style.top =
                row * cellH + "px";
        });
}


/* =========================
   FINISH GAME
========================= */

function finishGame(){

    stopTimer();

    gameStarted = false;

    updateStats();

    const oldBest =
        Number(
            localStorage.getItem(
                "completePic_v25_bestScore"
            ) || 0
        );

    if(score > oldBest){

        localStorage.setItem(
            "completePic_v25_bestScore",
            score
        );
    }

    const oldTime =
        Number(
            localStorage.getItem(
                "completePic_v25_bestTime"
            ) || 999999
        );

    if(seconds < oldTime){

        localStorage.setItem(
            "completePic_v25_bestTime",
            seconds
        );
    }

    showBest();

    sound("win");

    vibrate([
        100,
        60,
        100,
        60,
        200
    ]);

    createConfetti();

    document.getElementById(
        "finalTime"
    ).textContent =
        formatTime(seconds);

    document.getElementById(
        "finalMoves"
    ).textContent =
        moves;

    document.getElementById(
        "finalScore"
    ).textContent =
        score;

    setTimeout(()=>{

        document.getElementById(
            "winScreen"
        ).style.display = "flex";

    },500);
}


/* =========================
   CONFETTI
========================= */

function createConfetti(){

    const area =
        document.getElementById(
            "confetti"
        );

    area.innerHTML = "";

    for(let i=0;i<80;i++){

        const c =
            document.createElement("div");

        c.className =
            "confettiPiece";

        c.style.left =
            Math.random()*100 + "%";

        c.style.animationDelay =
            Math.random()*1.2 + "s";

        c.style.transform =
            `rotate(${Math.random()*360}deg)`;

        /*
           Let browser choose default
           rendering without hard-coded
           palette.
        */

        c.style.background =
            `hsl(${Math.random()*360},
                 80%,
                 55%)`;

        area.appendChild(c);
    }

    setTimeout(()=>{
        area.innerHTML = "";
    },4000);
}


/* =========================
   NEW GAME
========================= */

function newGame(){

    /*
       IMPORTANT:
       No puzzle progress is saved.

       Refreshing the page also reaches
       this same initialization path.
    */

    stopTimer();

    seconds = 0;
    moves = 0;
    score = 100;

    gameStarted = false;
    lockedCount = 0;
    draggingPiece = null;

    /*
       Remove every old piece,
       including pieces locked inside
       the frame.
    */

    document
        .querySelectorAll(".piece")
        .forEach(piece=>{
            piece.remove();
        });

    piecesArea.innerHTML = "";
    lockedPieces.innerHTML = "";

    document.getElementById(
        "winScreen"
    ).style.display = "none";

    document.getElementById(
        "confetti"
    ).innerHTML = "";

    messageEl.textContent = "";

    updateStats();

    createEdges();

    drawBoard();

    createPieces();

    showBest();
}


/* =========================
   IMAGE LOAD
========================= */

pandaImage.onload = ()=>{

    resizeBoard();

    newGame();
};


/* =========================
   IMAGE ERROR
========================= */

pandaImage.onerror = ()=>{

    messageEl.textContent =
        "⚠️ panda.png was not found. Put panda.png beside index.html.";

};


/* =========================
   WINDOW RESIZE
========================= */

window.addEventListener(
    "resize",
    ()=>{
        resizeBoard();
    }
);


/* =========================
   START
========================= */

showBest();

if(pandaImage.complete &&
   pandaImage.naturalWidth){

    resizeBoard();
    newGame();
}

</script>
